  /* ---------------- schedule ---------------- */

  var schedNew = false;
  var schedView = null;      // { year, month } — month is 0-11
  var schedSelected = null;  // the day the list below the calendar shows
  var schedMode = 'month';   // 'day' | 'week' | 'month'

  function formatTime(t) {
    if (!t) return '';
    var bits = t.split(':');
    var h = parseInt(bits[0], 10), m = bits[1];
    var ap = h >= 12 ? t('pm') : t('am');
    h = h % 12; if (h === 0) h = 12;
    return h + ':' + m + ' ' + ap;
  }

  function ymd(y, m, d) {
    return y + '-' + pad(m + 1) + '-' + pad(d);
  }

  function parseYmd(s) { return new Date(s + 'T12:00:00'); }

  function todayParts() {
    var d = new Date();
    return { y: d.getFullYear(), m: d.getMonth(), d: d.getDate() };
  }

  function daysInMonth(y, m) { return new Date(y, m + 1, 0).getDate(); }

  function weekday(ymdStr) {
    var names = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
    return t(names[parseYmd(ymdStr).getDay()]);
  }

  function weekdayShort(ymdStr) {
    return t(['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][parseYmd(ymdStr).getDay()]);
  }

  function monthLabel(y, m) {
    return t(['January','February','March','April','MayMonth','June','July','August',
            'September','October','November','December'][m]) + ' ' + y;
  }

  function addDaysYmd(dstr, n) {
    var d = parseYmd(dstr);
    d.setDate(d.getDate() + n);
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  }

  // Sunday of the week containing this date.
  function weekStart(dstr) {
    var d = parseYmd(dstr);
    return addDaysYmd(dstr, -d.getDay());
  }

  // Sunday-first 6-row grid, padded with the tail of the previous month and
  // the head of the next so every week is a full row.
  function monthGrid(y, m) {
    var first = new Date(y, m, 1).getDay();
    var len = daysInMonth(y, m);
    var prevLen = daysInMonth(y, m - 1 < 0 ? 11 : m - 1);
    var prevY = m === 0 ? y - 1 : y, prevM = m === 0 ? 11 : m - 1;
    var nextY = m === 11 ? y + 1 : y, nextM = m === 11 ? 0 : m + 1;

    var cells = [];
    for (var i = 0; i < first; i++) {
      var pd = prevLen - first + i + 1;
      cells.push({ date: ymd(prevY, prevM, pd), day: pd, out: true });
    }
    for (var d = 1; d <= len; d++) cells.push({ date: ymd(y, m, d), day: d, out: false });
    var nd = 1;
    while (cells.length % 7 !== 0 || cells.length < 42) {
      cells.push({ date: ymd(nextY, nextM, nd), day: nd, out: true });
      nd++;
    }
    return cells;
  }

  function weekCells(dstr) {
    var start = weekStart(dstr);
    var out = [];
    for (var i = 0; i < 7; i++) out.push({ date: addDaysYmd(start, i), out: false });
    return out;
  }

  // The visible range to fetch, for whichever mode is active — always at
  // least the full month grid so switching modes never needs a re-fetch.
  function visibleRange() {
    var cells = monthGrid(schedView.year, schedView.month);
    return { from: cells[0].date, to: cells[cells.length - 1].date, cells: cells };
  }

  function renderSchedule() {
    app.innerHTML = '<p class="muted">' + t('Loading the schedule…') + '</p>';

    var t = todayParts();
    if (!schedView) schedView = { year: t.y, month: t.m };
    if (!schedSelected) schedSelected = ymd(t.y, t.m, t.d);

    var range = visibleRange();

    Promise.all([
      sb.from('schedule').select('*').gte('work_date', range.from).lte('work_date', range.to)
        .order('work_date').order('created_at'),
      sb.from('jobs').select('id,name,status').order('name'),
      sb.from('memberships').select('email,full_name').order('created_at')
    ]).then(function (r) {
      if (r[0].error) return renderError(r[0].error.message);

      var rows = r[0].data || [];
      var jobs = r[1].data || [];
      var crew = r[2].data || [];
      var owner = org.role === 'owner';

      var byJob = {};
      jobs.forEach(function (j) { byJob[j.id] = j; });

      var byDate = {};
      rows.forEach(function (it) { (byDate[it.work_date] = byDate[it.work_date] || []).push(it); });
      Object.keys(byDate).forEach(function (d) {
        byDate[d].sort(function (a, b) {
          if (!a.work_time && !b.work_time) return 0;
          if (!a.work_time) return 1;
          if (!b.work_time) return -1;
          return a.work_time < b.work_time ? -1 : 1;
        });
      });

      var todayStr = ymd(t.y, t.m, t.d);
      var thisMonthCount = rows.filter(function (it) {
        return it.work_date.slice(0, 7) === schedView.year + '-' + pad(schedView.month + 1);
      }).length;

      app.innerHTML =
        '<div class="jobhead">' +
          '<h1>' + t('Schedule') + '</h1>' +
          '<div class="jobhead-meta">' +
            (thisMonthCount === 1 ? tf('{0} thing planned this month', thisMonthCount) : tf('{0} things planned this month', thisMonthCount)) + '</div>' +
        '</div>' +

        '<div class="viewswitch">' +
          ['day', 'week', 'month'].map(function (m) {
            return '<button type="button" class="viewswitch-btn' + (schedMode === m ? ' is-on' : '') +
              '" data-mode="' + m + '">' + t(m.charAt(0).toUpperCase() + m.slice(1)) + '</button>';
          }).join('') +
        '</div>' +

        '<div class="cal">' +
          calHeaderHtml() +
          (schedMode === 'month' ? calMonthHtml(range.cells, byDate, todayStr) : '') +
          (schedMode === 'week' ? calWeekHtml(byDate, todayStr, byJob) : '') +
          (schedMode === 'day' ? '' : '') +
        '</div>' +

        (schedMode === 'day' || schedMode === 'week'
          ? dayListHtml(schedSelected, byDate[schedSelected] || [], byJob, todayStr, true)
          : schedMode === 'month'
            ? dayListHtml(schedSelected, byDate[schedSelected] || [], byJob, todayStr, false)
            : '') +

        (owner
          ? (schedNew
              ? addFormHtml(jobs, crew)
              : '<div class="dock"><div class="dock-inner">' +
                  '<button id="sc-new" class="btn btn-block">' + t('Add to the schedule') + '</button>' +
                '</div></div>')
          : '');

      wireSchedule(rows, jobs, crew, byJob, byDate, todayStr);
    }).catch(function (err) { fatal('Loading the schedule', err); });
  }

  function calHeaderHtml() {
    var title;
    if (schedMode === 'day') title = weekday(schedSelected) + ', ' + longDate(schedSelected);
    else if (schedMode === 'week') {
      var start = weekStart(schedSelected), end = addDaysYmd(start, 6);
      title = longDate(start) + ' – ' + longDate(end);
    } else {
      title = monthLabel(schedView.year, schedView.month);
    }

    return '<div class="cal-head">' +
      '<button id="cal-prev" class="cal-nav" aria-label="' + t('Previous') + '">&lsaquo;</button>' +
      '<span class="cal-title">' + esc(title) + '</span>' +
      '<button id="cal-next" class="cal-nav" aria-label="' + t('Next') + '">&rsaquo;</button>' +
    '</div>';
  }

  function calMonthHtml(cells, byDate, todayStr) {
    return '<div class="cal-dow">' +
        ['S0','M1','T2','W3','T4','F5','S6'].map(function (d) { return '<span>' + t(d) + '</span>'; }).join('') +
      '</div>' +
      '<div class="cal-grid">' +
        cells.map(function (c) {
          var items = byDate[c.date] || [];
          var cls = 'cal-cell' +
            (c.out ? ' cal-out' : '') +
            (c.date === todayStr ? ' cal-today' : '') +
            (c.date === schedSelected ? ' cal-sel' : '');
          return '<button type="button" class="' + cls + '" data-date="' + c.date + '">' +
            '<span class="cal-daynum">' + c.day + '</span>' +
            (items.length
              ? '<span class="cal-dots">' +
                  items.slice(0, 3).map(function () { return '<span class="cal-dot"></span>'; }).join('') +
                '</span>'
              : '') +
          '</button>';
        }).join('') +
      '</div>' +
      '<div class="row" style="margin-top:10px">' +
        '<button id="cal-today-btn" class="btn-plain">' + t('Today') + '</button>' +
      '</div>';
  }

  // Seven day-rows. Full item text wraps rather than truncating, empty
  // days say so explicitly, and only ever one row reads as selected.
  function calWeekHtml(byDate, todayStr, byJob) {
    var cells = weekCells(schedSelected);
    return '<div class="cal-week">' +
      cells.map(function (c) {
        var items = byDate[c.date] || [];
        var isToday = c.date === todayStr;
        var isSel = c.date === schedSelected;
        var cls = 'cal-weekrow' + (isToday ? ' cal-today' : '') + (isSel ? ' cal-rowsel' : '');

        return '<button type="button" class="' + cls + '" data-date="' + c.date + '">' +
          '<span class="cal-weekleft">' +
            '<span class="cal-weekdow">' + weekdayShort(c.date) + (isToday ? t(' · today') : '') + '</span>' +
            '<span class="cal-weeknum">' + parseYmd(c.date).getDate() + '</span>' +
          '</span>' +
          '<span class="cal-weekitems">' +
            (items.length
              ? items.slice(0, 4).map(function (it) {
                  var job = byJob[it.job_id];
                  var label = job ? job.name : (it.note || t('Planned'));
                  return '<span class="cal-weekbar">' +
                    '<span class="cal-weekbar-top">' +
                      (it.work_time ? '<span class="sc-time">' + esc(formatTime(it.work_time)) + '</span> ' : '') +
                      '<strong>' + esc(label) + '</strong>' +
                    '</span>' +
                    (job && it.note ? '<span class="cal-weekbar-note">' + esc(it.note) + '</span>' : '') +
                    '<span class="cal-weekwho">' + esc(it.assignee_name || t('Whole crew')) + '</span>' +
                  '</span>';
                }).join('') +
                (items.length > 4 ? '<span class="cal-weekmore">' + tf('+{0} more', items.length - 4) + '</span>' : '')
              : '<span class="cal-weeknone">' + t('Nothing planned') + '</span>') +
          '</span>' +
        '</button>';
      }).join('') +
      '<div class="row" style="margin-top:10px">' +
        '<button id="cal-today-btn" class="btn-plain">' + t('Today') + '</button>' +
      '</div>' +
    '</div>';
  }

  function dayListHtml(dstr, items, byJob, todayStr, withHeading) {
    return (withHeading
      ? '<div class="section-head"><h2>' + (dstr === todayStr ? t('Today') : esc(weekday(dstr))) +
          '</h2><span class="small muted">' + esc(longDate(dstr)) + '</span></div>'
      : '<div class="section-head"><h2>' +
          (dstr === todayStr ? t('Today') : esc(weekday(dstr))) +
        '</h2><span class="small muted">' + esc(longDate(dstr)) + '</span></div>') +

      (items.length
        ? '<ul class="joblist">' + items.map(function (it) {
            var job = byJob[it.job_id];
            return '<li class="jobitem"><div class="jobrow">' +
              '<div class="jobrow-top">' +
                '<span class="jobrow-name">' +
                  (it.work_time ? '<span class="sc-time">' + esc(formatTime(it.work_time)) + '</span> ' : '') +
                  esc(job ? job.name : t('No job set')) + '</span>' +
                '<span class="jobrow-when">' + esc(it.assignee_name || t('whole crew')) + '</span>' +
              '</div>' +
              (it.note ? '<div class="jobrow-meta" style="white-space:pre-wrap">' + esc(it.note) + '</div>' : '') +
            '</div>' +
            '<button type="button" class="jobact jobdel js-sc-del" data-id="' + esc(it.id) +
              '" aria-label="' + t('Remove from schedule') + '" title="' + t('Remove') + '">' + TRASH_SVG + '</button>' +
            '</li>';
          }).join('') + '</ul>'
        : '<div class="empty" style="padding:20px"><p style="margin:0">' + t('Nothing planned this day.') + '</p></div>');
  }

  function addFormHtml(jobs, crew) {
    return '<div class="panel" style="margin-top:14px">' +
        '<h2 style="font-size:22px;margin-bottom:12px">' + t('Plan some work') + '</h2>' +
        '<div class="row">' +
          '<div class="grow"><label for="sc-date">' + t('Day') + '</label>' +
            '<input id="sc-date" type="date" value="' + esc(schedSelected) + '"></div>' +
          '<div class="grow"><label for="sc-time">' + tf('Time {0}', '<span class="muted">' + t('(optional)') + '</span>') + '</label>' +
            '<input id="sc-time" type="time"></div>' +
        '</div>' +
        '<div class="row">' +
          '<div class="grow"><label for="sc-job">' + t('Job') + '</label>' +
            '<select id="sc-job">' +
              '<option value="">' + t('No particular job') + '</option>' +
              jobs.filter(function (j) { return j.status === 'Active'; }).map(function (j) {
                return '<option value="' + esc(j.id) + '">' + esc(j.name) + '</option>';
              }).join('') +
            '</select></div>' +
        '</div>' +
        '<div class="field"><label for="sc-who">' + t('Who') + '</label>' +
          '<select id="sc-who">' +
            '<option value="">' + t('Anyone / the whole crew') + '</option>' +
            crew.map(function (m) {
              return '<option value="' + esc(m.email) + '">' +
                esc(m.full_name || m.email.split('@')[0]) + '</option>';
            }).join('') +
          '</select></div>' +
        '<div class="field"><label for="sc-note">' + t('What is the plan?') + '</label>' +
          '<textarea id="sc-note" style="min-height:80px" ' +
            'placeholder="Hang second floor. Bring the lift and 40 sheets of 5/8."></textarea></div>' +
        '<div class="row" style="margin-top:14px">' +
          '<button id="sc-save" class="btn grow">' + t('Add to schedule') + '</button>' +
          '<button id="sc-cancel" class="btn btn-quiet">' + t('Cancel') + '</button>' +
        '</div>' +
      '</div>';
  }

  function shiftView(dir) {
    if (schedMode === 'day') {
      schedSelected = addDaysYmd(schedSelected, dir);
      var d = parseYmd(schedSelected);
      schedView = { year: d.getFullYear(), month: d.getMonth() };
    } else if (schedMode === 'week') {
      schedSelected = addDaysYmd(schedSelected, dir * 7);
      var d2 = parseYmd(schedSelected);
      schedView = { year: d2.getFullYear(), month: d2.getMonth() };
    } else {
      schedView.month += dir;
      if (schedView.month < 0) { schedView.month = 11; schedView.year--; }
      if (schedView.month > 11) { schedView.month = 0; schedView.year++; }
    }
  }

  function wireSchedule(rows, jobs, crew, byJob, byDate, todayStr) {
    Array.prototype.forEach.call(document.querySelectorAll('.viewswitch-btn'), function (b) {
      b.addEventListener('click', function () { schedMode = b.dataset.mode; renderSchedule(); });
    });

    Array.prototype.forEach.call(document.querySelectorAll('[data-date]'), function (b) {
      b.addEventListener('click', function () {
        schedSelected = b.dataset.date;
        renderSchedule();
      });
    });

    on('cal-prev', 'click', function () { shiftView(-1); renderSchedule(); });
    on('cal-next', 'click', function () { shiftView(1); renderSchedule(); });
    on('cal-today-btn', 'click', function () {
      var n = todayParts();
      schedView = { year: n.y, month: n.m };
      schedSelected = ymd(n.y, n.m, n.d);
      renderSchedule();
    });

    on('sc-new', 'click', function () { schedNew = true; renderSchedule(); });
    on('sc-cancel', 'click', function () { schedNew = false; renderSchedule(); });

    on('sc-save', 'click', function () {
      var date = document.getElementById('sc-date').value;
      var time = document.getElementById('sc-time').value;
      var jobId = document.getElementById('sc-job').value;
      var whoEmail = document.getElementById('sc-who').value;
      var note = document.getElementById('sc-note').value.trim();

      if (!date) return toast(t('Pick a day.'));
      if (!jobId && !note) return toast(t('Pick a job, or say what the plan is.'));

      var whoName = '';
      if (whoEmail) {
        var found = crew.filter(function (m) { return m.email === whoEmail; })[0];
        whoName = (found && found.full_name) || whoEmail.split('@')[0];
      }

      var btn = document.getElementById('sc-save');
      btn.disabled = true;
      btn.textContent = t('Adding…');

      sb.from('schedule').insert({
        company_id: org.company_id,
        job_id: jobId || null,
        work_date: date,
        work_time: time || null,
        assignee_email: whoEmail,
        assignee_name: whoName,
        note: note,
        created_by: me.email
      }).then(function (res) {
        btn.disabled = false;
        btn.textContent = t('Add to schedule');
        if (res.error) return toast(tf('Could not add that: {0}', res.error.message));
        schedNew = false;
        schedSelected = date;
        var d = parseYmd(date);
        schedView = { year: d.getFullYear(), month: d.getMonth() };
        toast(t('Added to the schedule'));
        renderSchedule();
      });
    });

    Array.prototype.forEach.call(document.querySelectorAll('.js-sc-del'), function (b) {
      b.addEventListener('click', function () {
        if (!confirm(t('Take this off the schedule?'))) return;
        sb.from('schedule').delete().eq('id', b.dataset.id).then(function (res) {
          if (res.error) return toast(tf('Could not remove that: {0}', res.error.message));
          toast(t('Removed'));
          renderSchedule();
        });
      });
    });
  }

  /* ---------------- dashboard ---------------- */

  function renderDashboard() {
    app.innerHTML = '<p class="muted">' + t('Loading jobs…') + '</p>';

    sb.from('jobs').select('*').order('updated_at', { ascending: false })
      .then(function (res) {
        if (res.error) return renderError(res.error.message);
        paintDashboard(res.data || []);
      });
  }

  var QUIET_DAYS = 3;      // no entry in this many days = worth a look
  var STALE_DAYS = 90;     // nothing for this long = time to archive it

  function daysSince(iso) {
    var t = new Date(iso).getTime();
    if (isNaN(t)) return 0;
    return Math.floor((Date.now() - t) / 86400000);
  }

  function paintDashboard(jobs) {
    var q = dash.q.toLowerCase();
    var shown = jobs.filter(function (j) {
      var okStatus = dash.status === 'All' || j.status === dash.status;
      var hay = (j.name + ' ' + (j.address || '') + ' ' + (j.client_name || '')).toLowerCase();
      return okStatus && (!q || hay.indexOf(q) > -1);
    });

    var counts = { active: 0, completed: 0 };
    jobs.forEach(function (j) { j.status === 'Completed' ? counts.completed++ : counts.active++; });

    // Three buckets. Quiet first because that is what needs a phone call,
    // then everything else newest first, then the ones worth clearing out.
    var stale = [], quiet = [], rest = [];
    shown.forEach(function (j) {
      var age = daysSince(j.updated_at);
      if (age >= STALE_DAYS) stale.push(j);
      else if (j.status === 'Active' && age >= QUIET_DAYS) quiet.push(j);
      else rest.push(j);
    });

    function group(list) {
      return '<ul class="joblist">' + list.map(jobRowHtml).join('') + '</ul>';
    }

    app.innerHTML =
      '<div class="row" style="margin-bottom:4px">' +
        '<div class="grow"><label for="dash-q">' + t('Search jobs') + '</label>' +
          '<input id="dash-q" type="text" value="' + esc(dash.q) + '" placeholder="' + t('Name, address or client') + '"></div>' +
        '<div style="flex:0 0 150px"><label for="dash-status">' + t('Show') + '</label>' +
          '<select id="dash-status">' +
            opt('Active', tf('Active ({0})', counts.active), dash.status) +
            opt('Completed', tf('Completed ({0})', counts.completed), dash.status) +

    var pos = document.getElementById(focusId).selectionStart;

  function saveNewJob() {
    var desc = document.getElementById('nj-name').value.trim();
    if (desc.length < 2) return toast(t('Say what the job is.'));

    var notes = document.getElementById('nj-notes').value.trim();
    var start = document.getElementById('nj-start').value || '';
    var btn = document.getElementById('nj-save');
    btn.disabled = true;
    btn.textContent = t('Saving…');

    sb.from('jobs').insert({
      company_id: org.company_id,
      name: desc,
      address: document.getElementById('nj-address').value.trim(),
      client_name: document.getElementById('nj-client').value.trim(),
      status: 'Active'
    }).select().single().then(function (res) {
      if (res.error) throw res.error;
      var job = res.data;
      return saveJobExtras(job.id, notes, start).then(function () {
        return start ? scheduleJobStart(job, start) : null;
      }).then(function () { return job; });
    }).then(function (job) {
      toast(t('Job saved'));
      location.hash = '#/job/' + job.id;
    }).catch(function (err) {
      btn.disabled = false;
      btn.textContent = t('Save job');
      toast(tf('Could not save: {0}', (err && err.message) || err));
    });
  }

  // The notes and the start date are kept on the job itself. A database that
  // predates those two columns still gets a saved job and a scheduled start,
  // so creating work never fails over a column that is only for display.
  function saveJobExtras(id, notes, start) {
    var patch = {};
    if (notes) patch.notes = notes;
    if (start) patch.start_date = start;
    if (!notes && !start) return Promise.resolve();

    return sb.from('jobs').update(patch).eq('id', id).then(function (res) {
      if (res.error && window.console) {
        console.warn('[jobsite-logger] Job notes / start date were not stored — ' +
          'run add-job-details.sql in the Supabase SQL Editor. ' + res.error.message);
      }
    }, function () {});
  }

  // What the crew actually reads is the schedule, so the start date is written
  // there as a real planned day rather than only sitting on the job record.
  function scheduleJobStart(job, start) {
    return sb.from('schedule').insert({
      company_id: org.company_id,
      job_id: job.id,
      work_date: start,
      work_time: null,
      assignee_email: '',
      assignee_name: '',
      note: 'Job starts',
      created_by: me.email
    }).then(function (res) {
      if (res.error) {
        toast(tf('Job saved, but the start date did not reach the schedule: {0}', res.error.message));
      }
    });
  }

  function deleteJob(id, name) {
    if (!confirm(tf('Delete "{0}"?\n\nEvery entry and photo on this job goes with it, for the whole crew. This cannot be undone.', name))) return;

    toast(t('Deleting…'));

    sb.from('entries').select('entry_photos(storage_path)').eq('job_id', id)
      .then(function (res) {
        var paths = [];
        (res.data || []).forEach(function (en) {
          (en.entry_photos || []).forEach(function (p) { paths.push(p.storage_path); });
        });
        return paths.length ? sb.storage.from(BUCKET).remove(paths) : Promise.resolve({});
      })
      .then(function () {
        // Entries and photo rows are removed by the database itself.
        return sb.from('jobs').delete().eq('id', id);
      })
      .then(function (res) {
        if (res.error) return toast(tf('Could not delete: {0}', res.error.message));
        toast(t('Job deleted'));
        renderDashboard();
      })
      .catch(function (err) { toast(tf('Could not delete: {0}', err.message || err)); });
  }

  /* ---------------- job page ---------------- */

  function renderJob(id) {
    app.innerHTML = '<p class="muted">' + t('Loading job…') + '</p>';

    Promise.all([
      sb.from('jobs').select('*').eq('id', id).single(),
      sb.from('entries')
        .select('id,job_id,author_name,author_email,notes,tag,entry_date,created_at,issue_status,resolved_at,resolved_name,entry_photos(id,storage_path),issue_updates(id,status,note,author_name,created_at)')
        .eq('job_id', id)
        .order('entry_date', { ascending: false })
        .order('created_at', { ascending: false }),
      sb.from('schedule').select('work_date,assignee_name,assignee_email,note')
        .eq('job_id', id).gte('work_date', todayISO())
        .order('work_date').limit(6)
    ]).then(function (r) {
      if (r[0].error) return renderError(tf('That job could not be loaded. {0}', r[0].error.message));
      if (r[1].error) return renderError(r[1].error.message);
      view.job = r[0].data;
      view.entries = r[1].data || [];
      view.upcoming = (r[2] && r[2].data) || [];
      view.q = ''; view.date = '';
      signPhotos(view.entries).then(paintJob);
    });
  }

  function visibleEntries() {
    var q = view.q.toLowerCase();
    return view.entries.filter(function (en) {
      if (view.date && en.entry_date !== view.date) return false;
      if (!q) return true;
      return ((en.notes || '') + ' ' + (en.author_name || '')).toLowerCase().indexOf(q) > -1;
    });
  }

  function feedHtml() { return '<div id="feed-wrap">' + feedInner() + '</div>'; }

  function feedInner() {
    var list = visibleEntries();
    if (!list.length) {
      if (view.entries.length === 0) {
        return '<div class="empty"><h2>' + t('The log is empty') + '</h2>' +
          '<p>' + t('Post the first entry with the button at the bottom. Notes are dated automatically.') + '</p></div>';
      }
      return '<div class="empty"><h2>' + t('Nothing matches') + '</h2>' +
        '<p>' + t('Clear the search box or the date to see the whole log again.') + '</p></div>';
    }
    return '<ul class="feed">' + list.map(function (en) {
      if (view.editing === en.id) return entryEditHtml(en);
      if (view.issueEditing === en.id) return issueFormHtml(en);
      return entryHtml(en);
    }).join('') + '</ul>';
  }

  function entryHtml(en) {

    var photos = en.entry_photos || [];
    var mine = me && en.author_email === me.email;

    var cls = en.tag === 'issue'
      ? (en.issue_status === 'resolved' ? 't-fixed' : 't-issue')
      : 't-note';

    return '<li><article class="entry ' + cls + '">' +
      '<div class="entry-date"><span class="entry-day">' + esc(d.day) + '</span>' +
        '<span class="entry-mon">' + esc(d.mon) + '</span></div>' +

        '<div class="entry-head">' +
          '<span class="entry-who">' + esc(en.author_name) + '</span>' +

          tagChip(en) +

        (en.notes ? '<p class="entry-note">' + esc(en.notes) + '</p>' : '') +

        issueHistoryHtml(en) +
        (photos.length ? '<div class="gallery">' + photos.map(function (p) {

    var count = (en.issue_updates || []).length;

    return '<li><div class="panel editpanel">' +
      '<div class="editpanel-head">' + t('Add an update') + '</div>' +
      '<p class="small muted" style="margin:-6px 0 12px">' + tf('Logged by {0} on {1}', esc(en.author_name), esc(longDate(en.entry_date))) +
        (count ? (count === 1 ? tf(' · {0} update so far', count) : tf(' · {0} updates so far', count)) : '') +
        t('. Updates are added to the record — nothing gets overwritten.') + '</p>' +

      '<div class="field">' +
        '<div class="tagpick tagpick-3">' +
          '<input type="radio" name="istat" id="ist-open" value="open"' +
            (st === 'open' ? ' checked' : '') + '><label for="ist-open">' + t('Open') + '</label>' +
          '<input type="radio" name="istat" id="ist-working" value="working"' +
            (st === 'working' ? ' checked' : '') + '><label for="ist-working">' + t('Being fixed') + '</label>' +
          '<input type="radio" name="istat" id="ist-resolved" value="resolved"' +
            (st === 'resolved' ? ' checked' : '') + '><label for="ist-resolved">' + t('Fixed') + '</label>' +
        '</div></div>' +

      '<div class="field"><label for="ist-notes">' + t('What has happened?') + '</label>' +
        '<textarea id="ist-notes" placeholder="Called the plumber. He is back Wednesday to move the rough-in."></textarea></div>' +

      '<div class="row" style="margin-top:14px">' +
        '<button id="ist-save" class="btn grow" data-id="' + esc(en.id) + '">' + t('Add update') + '</button>' +
        '<button id="ist-cancel" class="btn btn-quiet">' + t('Cancel') + '</button>' +
      '</div>' +
    '</div></li>';
  }

  function saveIssueStatus(id) {
    var status = (document.querySelector('input[name=istat]:checked') || {}).value || 'open';
    var notes = document.getElementById('ist-notes').value.trim();

    if (!notes) {
      document.getElementById('ist-notes').focus();
      return toast(t('Say what has happened, so the history means something later.'));
    }

    var btn = document.getElementById('ist-save');
    btn.disabled = true;
    btn.textContent = t('Saving…');

    sb.rpc('update_issue', { p_entry: id, p_status: status, p_notes: notes }).then(function (res) {
      btn.disabled = false;
      btn.textContent = t('Add update');
      if (res.error) return toast(cleanRpcError(res.error));
      view.issueEditing = null;
      toast(status === 'resolved' ? t('Marked fixed') : t('Update added'));
      renderJob(view.job.id);
    });
  }

  function clearEditState() {
    view.editing = null;
    view.issueEditing = null;
    editStaged = [];
    editRemove = {};
  }

  function refreshFeed() {
    var wrap = document.getElementById('feed-wrap');
    if (!wrap) return;
    wrap.innerHTML = feedInner();
    wireFeed();
  }

  // An issue's updates are a record, so they all show, in the order they
  // happened. Nothing here is editable.
  function issueHistoryHtml(en) {
    if (en.tag !== 'issue') return '';

    var ups = (en.issue_updates || []).slice().sort(function (a, b) {
      return new Date(a.created_at) - new Date(b.created_at);
    });

    if (!ups.length) return '';

    return '<div class="history">' +
      '<div class="history-head">' + (ups.length === 1 ? tf('{0} update', ups.length) : tf('{0} updates', ups.length)) + '</div>' +
      ups.map(function (u) {
        var label = u.status === 'resolved' ? t('Fixed')
                  : u.status === 'working' ? t('Being fixed')
                  : t('Still open');
        return '<div class="history-item h-' + esc(u.status) + '">' +
          '<div class="history-meta">' +
            '<strong>' + esc(label) + '</strong> · ' + esc(u.author_name || '') +
            ' · ' + esc(longDate(u.created_at.slice(0, 10))) +
            ' ' + esc(clockTime(u.created_at)) +
          '</div>' +
          (u.note ? '<p class="history-note">' + esc(u.note) + '</p>' : '') +
        '</div>';
      }).join('') +
    '</div>';
  }

  function wireFeed() {
    Array.prototype.forEach.call(document.querySelectorAll('.js-zoom'), function (b) {
      b.addEventListener('click', function () { openLightbox(b.dataset.url, b.dataset.kind); });
    });
    Array.prototype.forEach.call(document.querySelectorAll('.js-del'), function (b) {
      b.addEventListener('click', function () { deleteEntry(b.dataset.id); });
    });
    Array.prototype.forEach.call(document.querySelectorAll('.js-edit'), function (b) {
      b.addEventListener('click', function () {
        clearEditState();
        view.editing = b.dataset.id;
        refreshFeed();
        var box = document.getElementById('e-notes');
        if (box) box.focus();
      });
    });
    Array.prototype.forEach.call(document.querySelectorAll('.js-issue'), function (b) {
      b.addEventListener('click', function () {
        clearEditState();
        view.issueEditing = b.dataset.id;
        refreshFeed();
        var box = document.getElementById('ist-notes');
        if (box) box.focus();
      });
    });

    on('ist-cancel', 'click', function () { clearEditState(); refreshFeed(); });

    var istSave = document.getElementById('ist-save');
    if (istSave) istSave.addEventListener('click', function () { saveIssueStatus(istSave.dataset.id); });

    Array.prototype.forEach.call(document.querySelectorAll('.js-photo-toggle'), function (b) {
      b.addEventListener('click', function () {
        var id = b.dataset.id;
        editRemove[id] = !editRemove[id];
        refreshFeed();
      });
    });

    on('e-cancel', 'click', function () { clearEditState(); refreshFeed(); });
    on('e-files', 'change', function (e) { collectFiles(e, editStaged, 'e-thumbs'); });
    on('e-camera', 'click', function () { openCamera(editStaged, 'e-thumbs'); });
    var save = document.getElementById('e-save');
    if (save) save.addEventListener('click', function () { saveEdit(save.dataset.id); });
  }

  /* ---------------- posting an entry ---------------- */

  function onPickFiles(e) { collectFiles(e, staged, 'c-thumbs'); }

  function collectFiles(e, into, thumbsId) {
    Array.prototype.slice.call(e.target.files || []).forEach(function (f) {
      var type = f.type || '';
      if (type.indexOf('image/') === 0) into.push(f);
      else if (type.indexOf('video/') === 0 || isVideoFile(f)) {
        if (f.size > MAX_VIDEO_BYTES) {
          toast(t('That video is too large. Keep clips under 50 MB, or record in the app.'));
          return;
        }
        into.push(f);
      }
    });
    e.target.value = '';
    paintThumbs(into, thumbsId);
  }

  function paintThumbs(into, thumbsId) {
    var wrap = document.getElementById(thumbsId);
    if (!wrap) return;
    wrap.innerHTML = into.map(function (f) {
      var url = URL.createObjectURL(f);
      return thumbTag(url, isVideoFile(f), t('Selected photo'));
    }).join('') + (into.length ? '<div class="small muted" style="width:100%">' + readyLabel(into) + '</div>' : '');
  }

  function postEntry() {
    var notes = document.getElementById('c-notes').value.trim();
    var tag = (document.querySelector('input[name=tag]:checked') || {}).value || 'note';
    var when = document.getElementById('c-date').value || todayISO();

    if (!notes && !staged.length) return toast(t('Add a note, a photo, or a video first.'));

    var btn = document.getElementById('c-save');
    btn.disabled = true;
    btn.textContent = t('Posting…');

    // No signal: shrink the photos now and keep the lot on the phone.
    if (!navigator.onLine) return queueEntry(notes, tag, when, btn);

    sb.from('entries').insert({
      job_id: view.job.id,
      author_name: me.name,
      author_email: me.email,
      notes: notes,
      tag: tag,
      entry_date: when
    }).select().single().then(function (res) {
      if (res.error) throw res.error;
      var entry = res.data;
      return uploadPhotos(entry, staged, btn).then(function () { return entry; });
    }).then(function (entry) {
      toast(t('Entry posted'));
      staged = [];
      notifyEntry(entry && entry.id);
      renderJob(view.job.id);
    }).catch(function (err) {
      // A network failure mid-post is exactly what the queue is for.
      if (!navigator.onLine || /fetch|network|Failed to send/i.test(err.message || '')) {
        return queueEntry(notes, tag, when, btn);
      }
      btn.disabled = false;
      btn.textContent = t('Post entry');
      toast(tf('Could not post: {0}', err.message || err));
    });
  }

  function queueEntry(notes, tag, when, btn) {
    if (btn) btn.textContent = t('Saving on this phone…');

    // Shrink before storing, so a queued entry takes the same room it would
    // have taken uploaded.
    return staged.reduce(function (chain, file) {
      return chain.then(function (out) {
        return prepareMedia(file).then(function (blob) { out.push(blob); return out; },
                                 function (err) {
                                   if (isVideoFile(file)) throw err;
                                   out.push(file); return out;
                                 });
      });
    }, Promise.resolve([])).then(function (blobs) {
      return qAdd({
        job_id: view.job.id,
        company_id: org.company_id,
        author_name: me.name,
        author_email: me.email,
        notes: notes,
        tag: tag,
        entry_date: when,
        photos: blobs,
        saved_at: new Date().toISOString()
      });
    }).then(function () {
      staged = [];
      toast(navigator.onLine
        ? t('Saved on this phone — it will post shortly.')
        : t('Saved on this phone. It posts as soon as you have signal.'));
      paintQueueBanner();
      renderJob(view.job.id);
    }).catch(function (err) {
      if (btn) { btn.disabled = false; btn.textContent = t('Post entry'); }
      toast(tf('Could not save that entry: {0}', err.message || err));
    });
  }

  // Fire and forget: an alert failing must never fail the entry.
  // Fire and forget for the person posting — a failed alert must never
  // block or roll back their entry. But "forget" should not mean "and
  // nobody can ever find out why", so failures are still logged.
  function notifyEntry(entryId) {
    if (!entryId) return Promise.resolve();
    if (!navigator.onLine) {
      if (window.console) console.warn('[jobsite-logger] Skipped entry alert: offline.');
      return Promise.resolve();
    }
    return sb.functions.invoke('notify-entry', { body: { entry_id: entryId } })
      .then(function (res) {
        if (res && res.error) {
          console.error('[jobsite-logger] notify-entry call failed:', res.error);
        } else if (res && res.data && res.data.error) {
          console.error('[jobsite-logger] notify-entry rejected:', res.data.error);
        } else if (window.console && res && res.data) {
          console.info('[jobsite-logger] notify-entry:', res.data);
        }
      }, function (err) {
        console.error('[jobsite-logger] notify-entry request never completed:', err);
      });
  }

  function uploadPhotos(entry, files, btn) {
    if (!files.length) return Promise.resolve();
    var done = 0;
    var rows = [];

    return files.reduce(function (chain, file, i) {
      return chain.then(function () {
        return prepareMedia(file).then(function (blob) {
          var ext = mediaExt(blob.type ? blob : file);
          var path = org.company_id + '/' + view.job.id + '/' + entry.id + '/' + Date.now() + '-' + i + '.' + ext;
          return sb.storage.from(BUCKET).upload(path, blob, { contentType: mediaContentType(blob.type ? blob : file) })
            .then(function (up) {
              if (up.error) throw up.error;
              rows.push({ entry_id: entry.id, storage_path: path });
              done++;
              if (btn) btn.textContent = tf('Uploading {0} of {1}…', done, files.length);
            });
        });
      });
    }, Promise.resolve()).then(function () {
      return sb.from('entry_photos').insert(rows).then(function (res) {
        if (res.error) throw res.error;
      });
    });
  }

  // Phone photos are 4-8 MB each. Shrinking in the browser keeps uploads fast
  // on a weak site signal and keeps you well inside the free storage tier.
  function shrink(file) {
    return new Promise(function (resolve, reject) {
      var url = URL.createObjectURL(file);
      var img = new Image();
      img.onload = function () {
        var scale = Math.min(1, MAX_PX / Math.max(img.width, img.height));
        var w = Math.round(img.width * scale), h = Math.round(img.height * scale);
        var canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        URL.revokeObjectURL(url);
        canvas.toBlob(function (blob) {
          resolve(blob || file);
        }, 'image/jpeg', JPEG_Q);
      };
        img.onerror = function () { URL.revokeObjectURL(url); reject(new Error(t('That photo could not be read.'))); };
      img.src = url;
    });
  }

  function saveEdit(id) {
    var en = view.entries.filter(function (x) { return x.id === id; })[0];
    if (!en) return;

    var notes = document.getElementById('e-notes').value.trim();
    var tag = (document.querySelector('input[name=etag]:checked') || {}).value || 'note';
    var when = document.getElementById('e-date').value || en.entry_date;

    var photos = en.entry_photos || [];
    var dropping = photos.filter(function (p) { return editRemove[p.id]; });
    var keeping = photos.length - dropping.length;

    if (!notes && !editStaged.length && keeping === 0) {
      return toast(t('An entry needs a note, a photo, or a video.'));
    }

    var btn = document.getElementById('e-save');
    btn.disabled = true;
    btn.textContent = t('Saving…');

    sb.from('entries')
      .update({ notes: notes, tag: tag, entry_date: when })
      .eq('id', id).eq('author_email', me.email)
      .then(function (res) {
        if (res.error) throw res.error;
        if (!dropping.length) return;
        var paths = dropping.map(function (p) { return p.storage_path; });
        var ids = dropping.map(function (p) { return p.id; });
        return sb.storage.from(BUCKET).remove(paths).then(function () {
          return sb.from('entry_photos').delete().in('id', ids).then(function (r) {
            if (r.error) throw r.error;
          });
        });
      })
      .then(function () { return uploadPhotos(en, editStaged, btn); })
      .then(function () {
        toast(t('Entry updated'));
        clearEditState();
        renderJob(view.job.id);
      })
      .catch(function (err) {
        btn.disabled = false;
        btn.textContent = t('Save changes');
        toast(tf('Could not save: {0}', err.message || err));
      });
  }

  function deleteEntry(id) {
    var en = view.entries.filter(function (x) { return x.id === id; })[0];
    if (!en) return;
    if (!confirm(t('Delete this entry and its photos? This cannot be undone.'))) return;

    var paths = (en.entry_photos || []).map(function (p) { return p.storage_path; });
    var first = paths.length ? sb.storage.from(BUCKET).remove(paths) : Promise.resolve({});

    first.then(function () {
      return sb.from('entries').delete().eq('id', id).eq('author_email', me.email);
    }).then(function (res) {
      if (res.error) return toast(tf('Could not delete: {0}', res.error.message));
      toast(t('Entry deleted'));
      renderJob(view.job.id);
    });
  }

  function toggleStatus() {
    var next = view.job.status === 'Completed' ? 'Active' : 'Completed';
    sb.from('jobs').update({ status: next, updated_at: new Date().toISOString() })
      .eq('id', view.job.id).select().single()
      .then(function (res) {
        if (res.error) return toast(tf('Could not update: {0}', res.error.message));
        view.job = res.data;
        toast(next === 'Completed' ? t('Job marked completed') : t('Job reopened'));
        paintJob();
      });
  }

  /* ---------------- lightbox ---------------- */

  function openLightbox(url, kind) {
    if (kind === 'video') {
      lightboxImg.hidden = true;
      lightboxImg.removeAttribute('src');
      lightboxVid.hidden = false;
      lightboxVid.src = url || '';
      var playing = lightboxVid.play();
      if (playing && playing.catch) playing.catch(function () {});
    } else {
      if (lightboxVid) {
        lightboxVid.pause();
        lightboxVid.removeAttribute('src');
        lightboxVid.hidden = true;
      }
      lightboxImg.hidden = false;
      lightboxImg.src = url || '';
    }
    lightbox.hidden = false;
    document.getElementById('lightbox-close').focus();
  }

  function closeLightbox() {
    lightbox.hidden = true;
    lightboxImg.src = '';
    if (lightboxVid) {
      lightboxVid.pause();
      lightboxVid.removeAttribute('src');
      lightboxVid.hidden = true;
    }
    lightboxImg.hidden = false;
  }

  /* ---------------- in-app camera ---------------- */

  // The file picker's camera hands back one shot and closes itself, which is
  // wrong for a walkaround: you want the whole run of photos in one go. This
  // holds a live preview open and drops every shot straight into the staged
  // list, so the shutter is the only button you touch until you are done.
  // Video uses the same overlay: Photo / Video at the top, and the shutter
  // starts and stops a clip without leaving the preview.
  var camStream = null;
  var camFacing = 'environment';
  var camInto = null;
  var camThumbs = '';
  var camBaseline = 0;
  var camMode = 'photo';
  var camRecorder = null;
  var camChunks = [];
  var camKeepRec = true;
  var camRecTimer = null;
  var camRecStarted = 0;
  var camRecWait = null;
  var camRecBytes = 0;
  var camRecSize = null;
  var camNativeOpen = false;

  function cameraSupported() {
    return !!(camEl && navigator.mediaDevices && navigator.mediaDevices.getUserMedia);
  }

  function videoRecSupported() {
    return cameraSupported() && typeof MediaRecorder === 'function';
  }

  // An iPhone will not give a web page the camera its Camera app uses. A
  // getUserMedia stream comes off a low capture preset with none of the
  // processing or stabilisation, so anything recorded in-page looks soft next
  // to a clip shot natively, and no bitrate makes that back. So on iOS we hand
  // recording to the system camera and take the finished file back.
  function isIOS() {
    var ua = navigator.userAgent || '';
    return /iPad|iPhone|iPod/.test(ua) ||
      (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  }

  function useNativeVideo() {
    if (!camNative) return false;
    return isIOS() || !videoRecSupported();
  }

  // Never name an H.264 level here. Asking for avc1.42E01E (Baseline 3.0) caps
  // the encoder at about 720x480, so the browser quietly shrinks a 1080p frame
  // to fit it — the exact thing that made the first recordings mush. Plain
  // video/mp4 lets it pick a profile that suits the frame; High 4.0 is only a
  // named fallback because it covers 1080p30.
  function recMime() {
    if (typeof MediaRecorder === 'undefined' || !MediaRecorder.isTypeSupported) return '';
    var types = [
      'video/mp4',
      'video/mp4;codecs=avc1.640028,mp4a.40.2',
      'video/webm;codecs=h264,opus',
      'video/webm;codecs=vp9,opus',
      'video/webm;codecs=vp8,opus',
      'video/webm'
    ];
    var i;
    for (i = 0; i < types.length; i++) {
      if (MediaRecorder.isTypeSupported(types[i])) return types[i];
    }
    return '';
  }

  function camTrackSize() {
    var out = { w: 0, h: 0 };
    if (camStream && camStream.getVideoTracks) {
      var track = camStream.getVideoTracks()[0];
      var set = track && track.getSettings ? track.getSettings() : null;
      if (set) { out.w = set.width || 0; out.h = set.height || 0; }
    }
    if (!out.h && camVideo) { out.w = camVideo.videoWidth || 0; out.h = camVideo.videoHeight || 0; }
    return out;
  }

  // Left to itself a browser picks a bitrate that turns drywall seams, framing
  // and anything with text on it into mush. These are sized to the frame the
  // camera actually gave us.
  function recBitrate() {
    var h = camTrackSize().h || 720;
    if (h >= 1080) return 8000000;
    if (h >= 720) return 5000000;
    return 3000000;
  }

  function paintCamMode() {
    var photo = document.getElementById('cam-mode-photo');
    var video = document.getElementById('cam-mode-video');
    if (photo) photo.className = camMode === 'photo' ? 'is-on' : '';
    if (video) video.className = camMode === 'video' ? 'is-on' : '';
    var shoot = document.getElementById('cam-shoot');
    if (shoot) {
      shoot.setAttribute('aria-label', camMode === 'video'
        ? (camRecorder ? t('Stop recording') : t('Start recording'))
        : t('Take photo'));
      if (camRecorder) shoot.classList.add('is-rec');
      else shoot.classList.remove('is-rec');
    }
  }

  function setCamMode(next) {
    if (camRecorder) return;
    if (next === 'video' && useNativeVideo()) return shootNativeVideo();
    if (next === 'video' && !videoRecSupported()) {
      return toast(t('This browser cannot record video. Use Add photos or videos instead.'));
    }
    if (camMode === next) return;
    camMode = next;
    paintCamMode();
    startCamStream().catch(function () {});
  }

  function openCamera(into, thumbsId) {
    if (!cameraSupported()) {
      return toast(t('This browser will not open the camera. Use Add photos instead.'));
    }
    camInto = into;
    camThumbs = thumbsId;
    camBaseline = into.length;
    camMode = 'photo';
    clearCamStrip();
    paintCamMode();
    paintCamTimer(false, 0);
    camEl.hidden = false;
    paintCamCount();
    startCamStream().catch(function (err) {
      hideCamera();
      camInto = null;
      var blocked = err && (err.name === 'NotAllowedError' || err.name === 'SecurityError');
      toast(blocked
        ? t('Camera access was blocked. Allow the camera, or use Add photos.')
        : t('Could not open the camera. Use Add photos instead.'));
    });
  }

  // "floor" demands at least 720 on the short side. Plenty of cameras hand out
  // 640x480 when all you give them is an ideal, so ask for a minimum first and
  // drop the demand only if the camera cannot meet it. The minimum goes on
  // both dimensions rather than 1280x720, because a phone held upright reports
  // the frame the other way round and a landscape minimum just fails there.
  function camConstraints(withAudio, floor) {
    return {
      video: {
        facingMode: { ideal: camFacing },
        width: floor ? { min: 720, ideal: 1920 } : { ideal: 1920 },
        height: floor ? { min: 720, ideal: 1080 } : { ideal: 1080 },
        frameRate: { ideal: 30 }
      },
      audio: !!withAudio
    };
  }

  function startCamStream() {
    stopCamStream();
    var wantAudio = camMode === 'video';
    var tries = [camConstraints(wantAudio, true), camConstraints(wantAudio, false)];
    if (wantAudio) tries.push(camConstraints(false, false));

    return nextCamStream(tries, 0).then(function (stream) {
      camStream = stream;
      camVideo.srcObject = stream;
      var playing = camVideo.play();
      if (playing && playing.catch) playing.catch(function () {});
    });
  }

  function nextCamStream(tries, i) {
    return navigator.mediaDevices.getUserMedia(tries[i]).catch(function (err) {
      if (i + 1 >= tries.length) throw err;
      return nextCamStream(tries, i + 1);
    });
  }

  // The system camera wants the hardware to itself, so drop our stream while
  // it is up and take it back when the user returns.
  function shootNativeVideo() {
    if (!camNative || !camInto) return;
    stopCamStream();
    camNativeOpen = true;
    camNative.value = '';
    camNative.click();
    // The system camera enforces no limit of ours, and a long clip only fails
    // once it has been shot, so say it before they start.
    toast(t('Keep it under a minute — longer clips are too large to upload.'));
  }

  function tookNativeVideo(files) {
    camNativeOpen = false;
    var big = false;
    Array.prototype.slice.call(files || []).forEach(function (file) {
      if (!camInto) return;
      if (file.size > MAX_VIDEO_BYTES) { big = true; return; }
      camInto.push(file);
      addCamThumb(file);
    });
    paintCamCount();
    if (big) toast(t('That video is too large to upload.'));
    resumeCamStream();
  }

  function resumeCamStream() {
    if (!camEl || camEl.hidden || camStream) return;
    startCamStream().catch(function () {});
  }

  function stopCamStream() {
    if (camStream) {
      camStream.getTracks().forEach(function (track) { track.stop(); });
      camStream = null;
    }
    if (camVideo) camVideo.srcObject = null;
  }

  function clearCamStrip() {
    Array.prototype.slice.call(camStrip.children).forEach(function (el) {
      if (el.src) URL.revokeObjectURL(el.src);
    });
    camStrip.innerHTML = '';
  }

  function camShotCount() {
    return camInto ? Math.max(0, camInto.length - camBaseline) : 0;
  }

  function paintCamCount() {
    var done = document.getElementById('cam-done');
    if (!done) return;
    var n = camShotCount();
    done.textContent = n ? t('Done') + ' · ' + n : t('Done');
  }

  function paintCamTimer(on, ms) {
    var el = document.getElementById('cam-timer');
    if (!el) return;
    if (!on) { el.hidden = true; el.textContent = '0:00'; return; }
    var sec = Math.floor((ms || 0) / 1000);
    el.hidden = false;
    // The size is on the badge on purpose: if a clip looks soft, this says
    // straight away whether the camera or the recording was the limit.
    el.textContent = Math.floor(sec / 60) + ':' + pad(sec % 60) +
      (camRecSize && camRecSize.h ? ' · ' + camRecSize.h + 'p' : '');
  }

  function addCamThumb(blob) {
    var url = URL.createObjectURL(blob);
    var el;
    if (isVideoFile(blob)) {
      el = document.createElement('video');
      el.muted = true;
      el.setAttribute('playsinline', '');
      el.preload = 'metadata';
    } else {
      el = document.createElement('img');
      el.alt = t('Selected photo');
    }
    el.src = url;
    camStrip.appendChild(el);
    camStrip.scrollLeft = camStrip.scrollWidth;
  }

  function shutterClick() {
    if (camMode === 'video') {
      if (camRecorder) stopRec(true);
      else startRec();
      return;
    }
    shootPhoto();
  }

  function shootPhoto() {
    if (!camStream || !camInto || camRecorder) return;
    var w = camVideo.videoWidth, h = camVideo.videoHeight;
    if (!w || !h) return;

    var canvas = document.createElement('canvas');
    canvas.width = w;
    canvas.height = h;
    canvas.getContext('2d').drawImage(camVideo, 0, 0, w, h);

    var shoot = document.getElementById('cam-shoot');
    if (shoot) shoot.disabled = true;
    canvas.toBlob(function (blob) {
      if (shoot) shoot.disabled = false;
      if (!blob) return toast(t('That photo could not be saved.'));
      if (!camInto) return;
      camInto.push(blob);
      addCamThumb(blob);
      paintCamCount();
    }, 'image/jpeg', 0.92);
  }

  function startRec() {
    if (!camStream || !camInto || camRecorder) return;
    if (!videoRecSupported()) {
      return toast(t('This browser cannot record video. Use Add photos or videos instead.'));
    }
    var mime = recMime();
    var opts = { videoBitsPerSecond: recBitrate(), audioBitsPerSecond: 128000 };
    if (mime) opts.mimeType = mime;
    try {
      camRecorder = new MediaRecorder(camStream, opts);
    } catch (err) {
      // An old browser can reject the bitrate hints; recording at whatever it
      // picks beats not recording at all.
      try {
        camRecorder = mime ? new MediaRecorder(camStream, { mimeType: mime }) : new MediaRecorder(camStream);
      } catch (err2) {
        camRecorder = null;
        return toast(t('This browser cannot record video. Use Add photos or videos instead.'));
      }
    }
    camChunks = [];
    camRecBytes = 0;
    camRecSize = camTrackSize();
    camKeepRec = true;
    camRecStarted = Date.now();
    camRecorder.ondataavailable = function (e) {
      if (!e.data || !e.data.size) return;
      camChunks.push(e.data);
      camRecBytes += e.data.size;
      // Recording at a bitrate worth watching fills the upload budget in about
      // a minute, so stop and keep the clip rather than binning it at the end.
      if (camRecBytes >= REC_BYTE_GUARD && camRecorder) {
        stopRec(true);
        toast(t('Recording stopped — the clip reached the size limit.'));
      }
    };
    camRecorder.onstop = function () {
      var rec = camRecorder;
      camRecorder = null;
      if (camRecTimer) { clearInterval(camRecTimer); camRecTimer = null; }
      paintCamTimer(false, 0);
      paintCamMode();
      var keep = camKeepRec;
      var chunks = camChunks;
      camChunks = [];
      if (keep && chunks.length && camInto) {
        var blob = new Blob(chunks, { type: (rec && rec.mimeType) || 'video/webm' });
        if (!blob.size) toast(t('That video could not be saved.'));
        else if (blob.size > MAX_VIDEO_BYTES) toast(t('That video is too large to upload.'));
        else {
          camInto.push(blob);
          addCamThumb(blob);
          paintCamCount();
          if (window.console) {
            console.info('[jobsite-logger] clip ' +
              (camRecSize && camRecSize.h ? camRecSize.w + 'x' + camRecSize.h : 'size unknown') +
              ' · ' + ((rec && rec.mimeType) || 'type unknown') +
              ' · ' + Math.round(blob.size / 1024) + ' KB');
          }
          if (camRecSize && camRecSize.h && camRecSize.h < 720) {
            toast(tf('This camera only records {0}×{1} — that is its own limit.', camRecSize.w, camRecSize.h));
          }
        }
      }
      if (camRecWait) {
        var done = camRecWait;
        camRecWait = null;
        done();
      }
    };
    camRecorder.start(1000);
    camRecTimer = setInterval(function () {
      var elapsed = Date.now() - camRecStarted;
      paintCamTimer(true, elapsed);
      if (elapsed >= MAX_VIDEO_MS) {
        stopRec(true);
        toast(t('Recording stopped at two minutes.'));
      }
    }, 250);
    paintCamTimer(true, 0);
    paintCamMode();
  }

  function stopRec(keep) {
    camKeepRec = keep !== false;
    if (camRecTimer) { clearInterval(camRecTimer); camRecTimer = null; }
    if (camRecorder && camRecorder.state !== 'inactive') {
      try { camRecorder.stop(); } catch (e) { camRecorder = null; }
    }
  }

  function stopRecPromise(keep) {
    return new Promise(function (resolve) {
      if (!camRecorder || camRecorder.state === 'inactive') {
        stopRec(keep);
        return resolve();
      }
      camRecWait = resolve;
      stopRec(keep);
    });
  }

  function flipCamera() {
    if (camRecorder) return;
    var was = camFacing;
    camFacing = (camFacing === 'environment') ? 'user' : 'environment';
    startCamStream().catch(function () {
      camFacing = was;
      startCamStream().catch(function () {});
      toast(t('Only one camera on this phone.'));
    });
  }

  function hideCamera() {
    stopRec(false);
    stopCamStream();
    clearCamStrip();
    paintCamTimer(false, 0);
    camMode = 'photo';
    paintCamMode();
    camEl.hidden = true;
  }

  function finishCamera() {
    stopRecPromise(true).then(function () {
      var into = camInto, thumbs = camThumbs, from = camBaseline;
      var session = into ? into.slice(from) : [];
      hideCamera();
      camInto = null;
      if (into) paintThumbs(into, thumbs);
      toast(takenLabel(session));
    });
  }

  // Cancel means cancel: the shots from this session leave the staged list,
  // anything picked before the camera opened stays.
  function cancelCamera() {
    stopRecPromise(false).then(function () {
      var into = camInto, thumbs = camThumbs;
      if (into) into.splice(camBaseline);
      hideCamera();
      camInto = null;
      if (into) paintThumbs(into, thumbs);
    });
  }

  /* ---------------- plain text export ---------------- */

  // One file per job: notes only, oldest day first, no photos.
  function exportJobNotes(job, btn) {
    btn.disabled = true;
    toast(t('Building notes file…'));

    sb.from('entries')
      .select('id,author_name,notes,tag,entry_date,created_at,issue_status,issue_updates(status,note,author_name,created_at)')
      .eq('job_id', job.id)
      .order('entry_date', { ascending: true })
      .order('created_at', { ascending: true })
      .then(function (res) {
        if (res.error) throw res.error;
        var list = res.data || [];

        var L = [];
        L.push(job.name);
        L.push(new Array(job.name.length + 1).join('='));
        if (job.client_name) L.push('Client:  ' + job.client_name);
        if (job.address)     L.push('Address: ' + job.address);
        L.push('Status:  ' + job.status);
        L.push('Entries: ' + list.length);
        L.push('Saved:   ' + longDate(todayISO()) + ' by ' + companyName());
        L.push('');

        if (!list.length) {
          L.push('No entries yet.');
        } else {
          list.forEach(function (en) {
            L.push('----------------------------------------');
            L.push(longDate(en.entry_date) + '   ' + en.author_name + '   ' +
                   clockTime(en.created_at) +
                   (en.tag === 'issue'
                     ? '   [ISSUE - ' + String(en.issue_status || 'open').toUpperCase() + ']'
                     : ''));
            L.push('');
            if (en.notes) L.push(en.notes);

            var ups = (en.issue_updates || []).slice().sort(function (a, b) {
              return new Date(a.created_at) - new Date(b.created_at);
            });

            if (ups.length) {
              L.push('');
              ups.forEach(function (u) {
                var label = u.status === 'resolved' ? 'FIXED'
                          : u.status === 'working' ? 'BEING FIXED' : 'STILL OPEN';
                L.push('  [' + label + '] ' + longDate(u.created_at.slice(0, 10)) +
                       ', ' + (u.author_name || '') + ': ' + u.note);
              });
            }
            L.push('');
          });
        }

        var stem = job.name.replace(/[^a-z0-9]+/gi, '-').replace(/^-|-$/g, '').toLowerCase();
        downloadFile(stem + '-notes-' + todayISO() + '.txt',
                     L.join('\r\n'), 'text/plain;charset=utf-8');

        btn.disabled = false;
        toast(t('Notes saved'));
      })
      .catch(function (err) {
        btn.disabled = false;
        toast(tf('Could not build the file: {0}', err.message || err));
      });
  }

  function downloadFile(filename, text, type) {
    var url = URL.createObjectURL(new Blob([text], { type: type }));
    var a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    setTimeout(function () { URL.revokeObjectURL(url); a.remove(); }, 2000);
  }

  /* ---------------- saving the job photos to the computer ---------------- */

  function fileStem(name) {
    return String(name || 'job').replace(/[^a-z0-9]+/gi, '-').replace(/^-|-$/g, '').toLowerCase();
  }

  // Oldest first, numbered within each day. The same photo always lands on
  // the same filename, so saving twice updates rather than duplicates.
  function jobPhotoFiles() {
    var stem = fileStem(view.job.name);
    var seen = {};
    var out = [];

    view.entries.slice().reverse().forEach(function (en) {
      (en.entry_photos || []).forEach(function (p) {
        if (!p.url) return;
        seen[en.entry_date] = (seen[en.entry_date] || 0) + 1;
        var ext = ((p.storage_path || '').match(/\.([a-z0-9]+)$/i) || [])[1] || 'jpg';
        out.push({
          url: p.url,
          name: stem + '-' + en.entry_date + '-' + pad(seen[en.entry_date]) + '.' + ext.toLowerCase()
        });
      });
    });

    return out;
  }

  function pickPhotoFolder() {
    if (!window.showDirectoryPicker) return Promise.resolve(null);
    return window.showDirectoryPicker({ id: 'jobsite-photos', mode: 'readwrite', startIn: 'pictures' });
  }

  function writeIntoFolder(dir, name, blob) {
    return dir.getFileHandle(name, { create: true }).then(function (handle) {
      return handle.createWritable().then(function (out) {
        return out.write(blob).then(function () { return out.close(); });
      });
    });
  }

  function downloadBlob(filename, blob) {
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    setTimeout(function () { URL.revokeObjectURL(url); a.remove(); }, 2000);
    // A burst of downloads gets throttled; a beat between them keeps them all.
    return new Promise(function (resolve) { setTimeout(resolve, 350); });
  }

  function saveJobPhotos() {
    var btn = document.getElementById('do-photos');
    var files = jobPhotoFiles();

    if (!files.length) return toast(t('This job has no photos yet.'));

    btn.disabled = true;

    // The picker has to be opened from the click itself, before any waiting.
    pickPhotoFolder().then(function (dir) {
      return files.reduce(function (chain, file, i) {
        return chain.then(function () {
          btn.textContent = tf('Saving photo {0} of {1}…', i + 1, files.length);
          return fetch(file.url)
            .then(function (r) { return r.blob(); })
            .then(function (blob) {
              return dir ? writeIntoFolder(dir, file.name, blob) : downloadBlob(file.name, blob);
            });
        });
      }, Promise.resolve()).then(function () {
        toast(files.length === 1
          ? tf('{0} photo saved', files.length)
          : tf('{0} photos saved', files.length));
      });
    }).catch(function (err) {
      if (err && err.name === 'AbortError') return;   // they closed the folder picker
      toast(tf('Could not save the photos: {0}', err.message || err));
    }).then(function () {
      btn.disabled = false;
      btn.textContent = t('Save photos');
    });
  }

  /* ---------------- saving the job photos to Google Drive ---------------- */

  // drive.file only ever lets the app see files it created itself, so it
  // needs no Google review — but it also means the folder lookups below
  // only find folders this app made.
  var DRIVE_SCOPE = 'https://www.googleapis.com/auth/drive.file';
  var DRIVE_HOME_DEFAULT = 'Jobsite Logger';
  var driveToken = null;     // { value, expires } — Google hands these out for an hour
  var driveFolderIds = {};

  function driveClientId() {
    return ((window.CONFIG || {}).GOOGLE_CLIENT_ID || '').trim();
  }

  function driveFolderName() {
    try {
      var saved = (localStorage.getItem(DRIVE_FOLDER_KEY) || '').trim();
      if (saved) return saved;
    } catch (e) {}
    return DRIVE_HOME_DEFAULT;
  }

  function saveDriveFolderName(name) {
    try {
      if (name) localStorage.setItem(DRIVE_FOLDER_KEY, name);
      else localStorage.removeItem(DRIVE_FOLDER_KEY);
    } catch (e) {}
  }

  function driveConfigured() {
    return driveClientId().indexOf('.apps.googleusercontent.com') > -1;
  }

  function driveAccessToken() {
    if (driveToken && driveToken.expires > Date.now() + 60000) {
      return Promise.resolve(driveToken.value);
    }
    if (!window.google || !google.accounts || !google.accounts.oauth2) {
      return Promise.reject(new Error(t('Google sign-in did not load. Check the connection and try again.')));
    }

    return new Promise(function (resolve, reject) {
      google.accounts.oauth2.initTokenClient({
        client_id: driveClientId(),
        scope: DRIVE_SCOPE,
        callback: function (res) {
          if (res.error) return reject(new Error(res.error_description || res.error));
          driveToken = {
            value: res.access_token,
            expires: Date.now() + (Number(res.expires_in) || 3600) * 1000
          };
          resolve(driveToken.value);
        },
        error_callback: function (err) {
          var type = err && err.type;
          if (type === 'popup_closed') return reject({ name: 'AbortError' });
          if (type === 'popup_failed_to_open') {
            return reject(new Error(t('Google blocked the sign-in window — allow pop-ups for this site and try again.')));
          }
          reject(new Error((err && err.message) || t('Google sign-in failed.')));
        }
      }).requestAccessToken();
    });
  }

  function driveFetch(url, opts) {
    var o = opts || {};
    return driveAccessToken().then(function (token) {
      o.headers = o.headers || {};
      o.headers.Authorization = 'Bearer ' + token;
      return fetch(url, o);
    }).then(function (r) {
      return r.text().then(function (body) {
        var parsed = {};
        try { parsed = body ? JSON.parse(body) : {}; } catch (e) {}
        if (!r.ok) {
          // An expired or withdrawn token should ask for a new one next time.
          if (r.status === 401) driveToken = null;
          throw new Error((parsed.error && (parsed.error.message || parsed.error)) || ('Drive ' + r.status));
        }
        return parsed;
      });
    });
  }

  function driveFolder(name, parentId) {
    var parent = parentId || 'root';
    var key = parent + '/' + name;
    if (driveFolderIds[key]) return Promise.resolve(driveFolderIds[key]);

    var q = "mimeType='application/vnd.google-apps.folder' and trashed=false and name='" +
      String(name).replace(/\\/g, '\\\\').replace(/'/g, "\\'") + "' and '" + parent + "' in parents";

    return driveFetch('https://www.googleapis.com/drive/v3/files?fields=files(id)&q=' + encodeURIComponent(q))
      .then(function (body) {
        var found = (body.files || [])[0];
        if (found) return found.id;
        return driveFetch('https://www.googleapis.com/drive/v3/files?fields=id', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            name: name,
            mimeType: 'application/vnd.google-apps.folder',
            parents: [parent]
          })
        }).then(function (made) { return made.id; });
      })
      .then(function (id) { driveFolderIds[key] = id; return id; });
  }

  function driveNamesIn(folderId) {
    var q = "'" + folderId + "' in parents and trashed=false";
    return driveFetch('https://www.googleapis.com/drive/v3/files?pageSize=1000&fields=files(name)&q=' +
      encodeURIComponent(q)).then(function (body) {
      var have = {};
      (body.files || []).forEach(function (f) { have[f.name] = true; });
      return have;
    });
  }

  function driveUpload(folderId, name, blob) {
    var form = new FormData();
    form.append('metadata', new Blob([JSON.stringify({ name: name, parents: [folderId] })],
      { type: 'application/json' }));
    form.append('file', blob);

    return driveFetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id', {
      method: 'POST',
      body: form
    });
  }

  function savePhotosToDrive() {
    var btn = document.getElementById('do-drive');
    var files = jobPhotoFiles();

    if (!driveConfigured()) {
      return toast(t('Save to Drive is not set up on this site yet.'));
    }
    if (!files.length) return toast(t('This job has no photos yet.'));

    btn.disabled = true;
    btn.textContent = t('Opening Google…');

    // Asked for first and on the click itself, or the browser eats the popup.
    driveAccessToken()
      .then(function () { return driveFolder(driveFolderName()); })
      .then(function (homeId) { return driveFolder(view.job.name, homeId); })
      .then(function (folderId) {
        return driveNamesIn(folderId).then(function (have) {
          var todo = files.filter(function (f) { return !have[f.name]; });
          if (!todo.length) return 0;

          return todo.reduce(function (chain, file, i) {
            return chain.then(function () {
              btn.textContent = tf('Saving photo {0} of {1}…', i + 1, todo.length);
              return fetch(file.url)
                .then(function (r) { return r.blob(); })
                .then(function (blob) { return driveUpload(folderId, file.name, blob); });
            });
          }, Promise.resolve()).then(function () { return todo.length; });
        });
      })
      .then(function (n) {
        if (!n) return toast(t('Google Drive already has these photos.'));
        toast(n === 1
          ? tf('{0} photo saved to Google Drive', n)
          : tf('{0} photos saved to Google Drive', n));
      })
      .catch(function (err) {
        if (err && err.name === 'AbortError') return;
        toast(tf('Could not save to Google Drive: {0}', err.message || err));
      })
      .then(function () {
        btn.disabled = false;
        btn.textContent = t('Save to Drive');
      });
  }

  /* ---------------- PDF report ---------------- */

  function exportPdf() {
    var btn = document.getElementById('do-pdf');
    btn.disabled = true;
    btn.textContent = t('Building…');

    var list = visibleEntries().slice().reverse();   // oldest first reads better for a client
    var doc = new window.jspdf.jsPDF({ unit: 'pt', format: 'letter' });
    var M = 48, PW = 612, PH = 792, CW = PW - M * 2;
    var y = M;

    function space(need) {
      if (y + need > PH - M) { doc.addPage(); y = M; }
    }

    doc.setFont('helvetica', 'bold'); doc.setFontSize(22);
    doc.text(view.job.name, M, y); y += 26;

    doc.setFont('helvetica', 'normal'); doc.setFontSize(11);
    [
      view.job.client_name ? t('Client: {0}').replace('{0}', view.job.client_name) : '',
      view.job.address || '',
      tf('Status: {0}', view.job.status === 'Completed' ? t('Completed') : view.job.status),
      tf('Report prepared by {0} on {1}', companyName(), longDate(todayISO())),
      list.length === 1 ? tf('{0} entry', list.length) : tf('{0} entries', list.length)
    ].filter(Boolean).forEach(function (line) {
      doc.text(line, M, y); y += 15;
    });

    y += 6;
    doc.setDrawColor(120); doc.line(M, y, PW - M, y); y += 20;

    var step = list.reduce(function (chain, en) {
      return chain.then(function () {
        space(70);
        doc.setFont('helvetica', 'bold'); doc.setFontSize(13);
        doc.text(longDate(en.entry_date), M, y);
        doc.setFont('helvetica', 'normal'); doc.setFontSize(10);
        var right = en.author_name;
        if (en.tag === 'issue') {
          right += '  ·  ' + t('ISSUE') +
            (en.issue_status === 'resolved' ? t(' (FIXED)') :
             en.issue_status === 'working' ? t(' (BEING FIXED)') : t(' (OPEN)'));
        }
        doc.text(right, PW - M, y, { align: 'right' });
        y += 16;

        if (en.notes) {
          doc.setFontSize(11);
          var lines = doc.splitTextToSize(en.notes, CW);
          lines.forEach(function (ln) { space(16); doc.text(ln, M, y); y += 14; });
        }

        var ups = (en.issue_updates || []).slice().sort(function (a, b) {
          return new Date(a.created_at) - new Date(b.created_at);
        });

        if (ups.length) {
          doc.setFontSize(10);
          ups.forEach(function (u) {
            var label = u.status === 'resolved' ? t('Fixed')
                      : u.status === 'working' ? t('Being fixed') : t('Still open');
            space(16);
            doc.setFont('helvetica', 'bold');
            doc.text(label + ' — ' + (u.author_name || '') + ', ' +
                     longDate(u.created_at.slice(0, 10)) + ':', M + 14, y);
            y += 13;
            doc.setFont('helvetica', 'normal');
            doc.splitTextToSize(u.note, CW - 14).forEach(function (ln) {
              space(15); doc.text(ln, M + 14, y); y += 13;
            });
          });
          doc.setFontSize(11);
        }

        var photos = en.entry_photos || [];
        if (!photos.length) { y += 14; return; }
        y += 6;

        var stills = [];
        var vidCount = 0;
        photos.forEach(function (p) {
          if (isVideoPath(p.storage_path)) vidCount++;
          else stills.push(p);
        });
        if (vidCount) {
          space(16);
          doc.setFontSize(10);
          doc.text(vidCount === 1 ? t('Video — watch in the app') : t('Videos — watch in the app'), M, y);
          y += 16;
          doc.setFontSize(11);
        }
        if (!stills.length) { y += 8; return; }

        return stills.reduce(function (c2, p, i) {
          return c2.then(function () {
            return imageData(p.url || '').then(function (im) {
              if (!im) return;
              var boxW = (CW - 12) / 2;
              var w = boxW, h = boxW * (im.h / im.w);
              if (h > 200) { h = 200; w = 200 * (im.w / im.h); }
              var col = i % 2;
              if (col === 0) space(h + 12);
              var x = M + col * (boxW + 12);
              doc.addImage(im.data, 'JPEG', x, y, w, h);
              if (col === 1 || i === stills.length - 1) y += h + 12;
            });
          });
        }, Promise.resolve()).then(function () { y += 10; });
      });
    }, Promise.resolve());

    step.then(function () {
      var pages = doc.getNumberOfPages();
      for (var p = 1; p <= pages; p++) {
        doc.setPage(p);
        doc.setFont('helvetica', 'normal'); doc.setFontSize(9); doc.setTextColor(110);
        doc.text(companyName() + '  —  ' + view.job.name, M, PH - 26);
        doc.text(tf('Page {0} of {1}', p, pages), PW - M, PH - 26, { align: 'right' });
      }
      var safe = view.job.name.replace(/[^a-z0-9]+/gi, '-').toLowerCase();
      doc.save(safe + '-report-' + todayISO() + '.pdf');
      btn.disabled = false;
      btn.textContent = t('Client PDF');
    }).catch(function (err) {
      btn.disabled = false;
      btn.textContent = t('Client PDF');
      toast(tf('PDF failed: {0}', err.message || err));
    });
  }

  // Photos are re-drawn small so a 30-entry report stays a reasonable file size.
  function imageData(url) {
    return fetch(url).then(function (r) { return r.blob(); }).then(function (blob) {
      return new Promise(function (resolve) {
        var objUrl = URL.createObjectURL(blob);
        var img = new Image();
        img.onload = function () {
          var scale = Math.min(1, 900 / Math.max(img.width, img.height));
          var w = Math.round(img.width * scale), h = Math.round(img.height * scale);
          var canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          canvas.getContext('2d').drawImage(img, 0, 0, w, h);
          URL.revokeObjectURL(objUrl);
          resolve({ data: canvas.toDataURL('image/jpeg', 0.7), w: w, h: h });
        };
        img.onerror = function () { URL.revokeObjectURL(objUrl); resolve(null); };
        img.src = objUrl;
      });
    }).catch(function () { return null; });
  }

  /* ---------------- errors ---------------- */

  function renderError(msg) {
    app.innerHTML = '<div class="error"><h2 style="font-size:20px;margin-bottom:6px">' + t('Could not reach your data') + '</h2>' +
      '<p class="small" style="margin:0 0 10px">' + esc(msg) + '</p>' +
      '<p class="small muted" style="margin:0">' + t('If this mentions a missing table, relationship or column, one of the SQL files in db/ has not been run yet against this database — check which feature the error names and run the matching file.') + '</p>' +
      '<a class="backlink" href="#/">' + t('Back to jobs') + '</a></div>';
  }

  boot();

})();

</script>
