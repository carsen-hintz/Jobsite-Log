<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jobsite Logger</title>
<meta name="theme-color" content="#FFFFFF">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="favicon.png" type="image/png" sizes="64x64">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Jobsite Logger — field-first styling.
   Palette is drawn from the trade: drywall dust, gypsum board, blue chalk line,
   red keel crayon. Squared corners, hairline rules, very large touch targets. */

:root {
  --wall: #E7E9EB;
  --board: #FFFFFF;
  --ink: #17202A;
  --steel: #5F6C79;
  --rule: #CBD1D6;
  --chalk: #1F4FD8;
  --chalk-dark: #163BA6;
  --keel: #C2321B;
  --radius: 2px;
  --tap: 52px;
  --pad: 16px;
  --shell: 680px;
}

* { box-sizing: border-box; }

/* The app hides panels with the hidden attribute; class rules below set
   display, so this has to win. */
[hidden] { display: none !important; }

html, body {
  margin: 0;
  background: var(--wall);
  color: var(--ink);
  font-family: "IBM Plex Sans", system-ui, -apple-system, sans-serif;
  font-size: 17px;
  line-height: 1.5;
  -webkit-text-size-adjust: 100%;
}

h1, h2, h3, .cond {
  font-family: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  font-weight: 600;
  letter-spacing: 0.01em;
  margin: 0;
}

a { color: var(--chalk-dark); }

:focus-visible {
  outline: 3px solid var(--chalk);
  outline-offset: 2px;
}

/* ---------- Top bar ---------- */

.topbar {
  position: sticky;
  top: 0;
  z-index: 20;
  background: var(--board);
  color: var(--ink);
  border-bottom: 1px solid var(--rule);
  padding-top: env(safe-area-inset-top);
}

.topbar-inner {
  max-width: var(--shell);
  margin: 0 auto;
  min-height: 60px;
  padding: 0 var(--pad);
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  gap: 10px;
}

.topbar-left { justify-self: start; min-width: 0; }
.topbar-right { justify-self: end; min-width: 0; }

.backbtn {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  min-height: 38px;
  padding: 0 12px 0 9px;
  border: 1px solid var(--rule);
  border-radius: var(--radius);
  color: var(--ink);
  text-decoration: none;
  font-size: 15px;
  font-weight: 500;
  white-space: nowrap;
}

.backbtn::before {
  content: "‹";
  font-size: 21px;
  line-height: 1;
  margin-top: -2px;
}

.brand {
  display: flex;
  align-items: center;
  justify-self: center;
  text-decoration: none;
}

.brand img {
  display: block;
  height: 38px;
  width: auto;
  max-width: 190px;
  object-fit: contain;
}

#brand-text {
  font-family: "Barlow Condensed", sans-serif;
  font-weight: 700;
  font-size: 23px;
  line-height: 1.1;
  color: var(--ink);
  letter-spacing: 0.01em;
  max-width: 190px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.logopreview {
  display: flex;
  align-items: center;
  gap: 14px;
  flex-wrap: wrap;
  padding: 12px;
  background: #fff;
  border: 1px solid var(--rule);
  border-radius: var(--radius);
  margin-bottom: 12px;
}

.logopreview img { height: 44px; width: auto; max-width: 220px; object-fit: contain; display: block; }

.whoami {
  background: none;
  border: 1px solid var(--rule);
  color: var(--steel);
  border-radius: var(--radius);
  width: 44px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0;
  cursor: pointer;
}

.whoami:hover { color: var(--ink); border-color: var(--steel); }
.whoami:active { background: var(--wall); }

/* ---------- Shell ---------- */

.app {
  max-width: var(--shell);
  margin: 0 auto;
  padding: var(--pad) var(--pad) 120px;
}

.stack > * + * { margin-top: 14px; }

.muted { color: var(--steel); }
.small { font-size: 14px; }

.section-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 12px;
  margin: 22px 0 10px;
}

.section-head h2 { font-size: 22px; }

/* ---------- Panels, forms, buttons ---------- */

.panel {
  background: var(--board);
  border: 1px solid var(--rule);
  border-radius: var(--radius);
  padding: var(--pad);
}

label {
  display: block;
  font-size: 15px;
  font-weight: 500;
  margin-bottom: 5px;
}

input[type=text], input[type=email], input[type=date], input[type=password], select, textarea {
  width: 100%;
  font: inherit;
  color: var(--ink);
  background: #fff;
  border: 1px solid var(--steel);
  border-radius: var(--radius);
  padding: 13px 12px;
  min-height: var(--tap);
}

textarea { min-height: 120px; resize: vertical; }

.field + .field { margin-top: 13px; }

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: var(--tap);
  padding: 0 18px;
  font: inherit;
  font-weight: 600;
  border-radius: var(--radius);
  border: 1px solid transparent;
  background: var(--chalk);
  color: #fff;
  cursor: pointer;
  text-decoration: none;
}

.btn:active { background: var(--chalk-dark); }
.btn[disabled] { opacity: 0.55; cursor: default; }
.btn-block { width: 100%; }

.btn-quiet {
  background: var(--board);
  color: var(--ink);
  border-color: var(--steel);
}

.btn-plain {
  background: none;
  border: none;
  color: var(--chalk-dark);
  font: inherit;
  font-weight: 500;
  padding: 10px 0;
  min-height: 44px;
  cursor: pointer;
  text-align: left;
}

.btn-danger { background: none; border: none; color: var(--keel); font: inherit; font-size: 14px; cursor: pointer; padding: 8px 0; min-height: 40px; }

.row { display: flex; gap: 10px; flex-wrap: wrap; }
.row > .grow { flex: 1 1 180px; }

/* ---------- Tag chooser + chips ---------- */

.tagpick { display: flex; gap: 8px; }

.tagpick input { position: absolute; opacity: 0; pointer-events: none; }

.tagpick label {
  flex: 1;
  margin: 0;
  text-align: center;
  border: 1px solid var(--steel);
  border-radius: var(--radius);
  padding: 13px 4px;
  min-height: var(--tap);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  background: #fff;
  font-weight: 500;
}

.tagpick input:checked + label { background: var(--ink); color: #fff; border-color: var(--ink); }
.tagpick input#tag-issue:checked + label { background: var(--keel); border-color: var(--keel); }
.tagpick input:focus-visible + label { outline: 3px solid var(--chalk); outline-offset: 2px; }

.chip {
  display: inline-block;
  font-size: 13px;
  font-weight: 600;
  padding: 3px 8px;
  border-radius: var(--radius);
  border: 1px solid var(--rule);
  color: var(--steel);
  background: #fff;
}

.chip-issue { color: #fff; background: var(--keel); border-color: var(--keel); }
.chip-done { color: var(--steel); background: var(--wall); }

/* ---------- Job list ---------- */

.joblist { list-style: none; margin: 0; padding: 0; }
.joblist li + li { margin-top: 10px; }

.jobitem {
  display: flex;
  align-items: stretch;
  background: var(--board);
  border: 1px solid var(--rule);
  border-left: 4px solid var(--chalk);
  border-radius: var(--radius);
}

.jobitem.is-completed { border-left-color: var(--steel); }

.jobact {
  flex: 0 0 auto;
  width: 46px;
  align-self: stretch;
  border: none;
  background: none;
  color: #A6AEB6;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
}

.jobact[disabled] { opacity: 0.4; cursor: default; }

.jobtxt:hover { color: var(--chalk); }
.jobtxt:active { color: #fff; background: var(--chalk); }

.jobdel {
  border-radius: 0 var(--radius) var(--radius) 0;
}

.jobdel:hover { color: var(--keel); }
.jobdel:active { color: #fff; background: var(--keel); }

.jobrow {
  display: block;
  flex: 1 1 auto;
  min-width: 0;
  padding: 14px var(--pad);
  text-decoration: none;
  color: var(--ink);
}

.jobrow-top { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.jobrow-name { font-family: "Barlow Condensed", sans-serif; font-weight: 600; font-size: 24px; line-height: 1.15; }
.jobrow-meta { font-size: 15px; color: var(--steel); margin-top: 2px; }
.jobrow-when { font-size: 13px; color: var(--steel); white-space: nowrap; padding-left: 4px; }

/* ---------- Entry feed: the one bold move ----------
   Each entry is a wide band with a colored edge and an oversized date in the
   gutter, so a phone scan reads as date -> tag -> note. */

.feed { list-style: none; margin: 0; padding: 0; }
.feed > li + li { margin-top: 12px; }

.entry {
  display: grid;
  grid-template-columns: 62px 1fr;
  background: var(--board);
  border: 1px solid var(--rule);
  border-left: 5px solid var(--steel);
  border-radius: var(--radius);
}

.entry.t-issue { border-left-color: var(--keel); }

.entry-date {
  padding: 13px 0 13px 12px;
  font-family: "Barlow Condensed", sans-serif;
  line-height: 0.92;
  color: var(--ink);
}

.entry-day { display: block; font-size: 38px; font-weight: 700; }
.entry-mon { display: block; font-size: 15px; font-weight: 500; color: var(--steel); letter-spacing: 0.04em; }

.entry-body { padding: 13px var(--pad) 15px 12px; min-width: 0; }
.entry-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 6px; }
.entry-who { font-weight: 600; font-size: 15px; }
.entry-time { font-size: 13px; color: var(--steel); }
.entry-note { white-space: pre-wrap; overflow-wrap: anywhere; margin: 0; }

.gallery {
  margin-top: 11px;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(92px, 1fr));
  gap: 6px;
}

.gallery button {
  padding: 0;
  border: 1px solid var(--rule);
  border-radius: var(--radius);
  background: var(--wall);
  aspect-ratio: 1;
  overflow: hidden;
  cursor: pointer;
}

.gallery img { width: 100%; height: 100%; object-fit: cover; display: block; }

/* ---------- Job header ---------- */

.jobhead {
  background: var(--board);
  border: 1px solid var(--rule);
  border-radius: var(--radius);
  padding: var(--pad);
}

.jobhead h1 { font-size: 30px; line-height: 1.1; }
.jobhead .jobhead-meta { margin-top: 6px; color: var(--steel); font-size: 15px; }
.jobhead .row { margin-top: 14px; }

.backlink {
  display: inline-block;
  padding: 8px 0;
  font-size: 15px;
  font-weight: 500;
  color: var(--chalk-dark);
  text-decoration: none;
  min-height: 40px;
}

/* ---------- Sticky compose bar ---------- */

.dock {
  position: fixed;
  left: 0; right: 0; bottom: 0;
  z-index: 15;
  background: var(--wall);
  border-top: 1px solid var(--rule);
  padding: 10px var(--pad) calc(10px + env(safe-area-inset-bottom));
}

.dock-inner { max-width: var(--shell); margin: 0 auto; }

/* ---------- Photo staging ---------- */

.filedrop {
  border: 1px dashed var(--steel);
  border-radius: var(--radius);
  padding: 15px;
  text-align: center;
  background: #fff;
}

.filedrop input { position: absolute; width: 1px; height: 1px; opacity: 0; }

.filedrop-label {
  display: inline-flex;
  align-items: center;
  min-height: 44px;
  font-weight: 600;
  color: var(--chalk-dark);
  cursor: pointer;
  margin: 0;
}

.thumbs { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
.thumbs img { width: 64px; height: 64px; object-fit: cover; border: 1px solid var(--rule); border-radius: var(--radius); }

/* ---------- Empty + loading states ---------- */

.empty {
  background: var(--board);
  border: 1px solid var(--rule);
  border-radius: var(--radius);
  padding: 26px var(--pad);
  text-align: center;
}

.empty h2 { font-size: 22px; margin-bottom: 6px; }
.empty p { margin: 0 auto; max-width: 42ch; color: var(--steel); }

.error {
  border-left: 5px solid var(--keel);
  background: #fff;
  border-radius: var(--radius);
  border-top: 1px solid var(--rule);
  border-right: 1px solid var(--rule);
  border-bottom: 1px solid var(--rule);
  padding: 14px var(--pad);
}

/* ---------- Toast ---------- */

.toast {
  position: fixed;
  left: 50%;
  bottom: calc(84px + env(safe-area-inset-bottom));
  transform: translateX(-50%);
  z-index: 40;
  background: var(--ink);
  color: #fff;
  padding: 12px 16px;
  border-radius: var(--radius);
  font-size: 15px;
  max-width: calc(100% - 32px);
  box-shadow: 0 6px 20px rgba(23, 32, 42, 0.28);
}

/* ---------- Lightbox ---------- */

.lightbox {
  position: fixed;
  inset: 0;
  z-index: 50;
  background: rgba(23, 32, 42, 0.94);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
}

.lightbox img { max-width: 100%; max-height: 88vh; }

.lightbox-close {
  position: absolute;
  top: calc(12px + env(safe-area-inset-top));
  right: 12px;
  min-height: 44px;
  padding: 0 16px;
  font: inherit;
  font-weight: 600;
  color: var(--ink);
  background: #fff;
  border: none;
  border-radius: var(--radius);
  cursor: pointer;
}

/* ---------- Sign-in / setup ---------- */

.gate { max-width: 420px; margin: 8vh auto 0; }
.gate h1 { font-size: 32px; margin-bottom: 4px; }
.gate p { color: var(--steel); margin: 0 0 18px; }

.setup ol { padding-left: 22px; }
.setup li { margin-bottom: 8px; }
.setup code { background: var(--wall); padding: 1px 5px; border-radius: var(--radius); font-size: 15px; overflow-wrap: anywhere; }

/* ---------- Entry author actions + edit form ---------- */

.entry-actions {
  display: flex;
  gap: 8px;
  margin-top: 10px;
}

.btn-mini {
  background: none;
  border: 1px solid var(--rule);
  border-radius: var(--radius);
  color: var(--ink);
  font: inherit;
  font-size: 14px;
  font-weight: 500;
  padding: 0 12px;
  min-height: 38px;
  cursor: pointer;
}

.btn-mini-danger { color: var(--keel); }
.btn-mini:active { background: var(--wall); }

.editpanel { border-left: 5px solid var(--chalk); }

.editpanel-head {
  font-family: "Barlow Condensed", sans-serif;
  font-size: 22px;
  font-weight: 600;
  margin-bottom: 12px;
}

.photochip {
  position: relative;
  padding: 0;
  border: 1px solid var(--rule);
  border-radius: var(--radius);
  background: var(--wall);
  width: 64px;
  height: 64px;
  overflow: hidden;
  cursor: pointer;
}

.photochip img { width: 100%; height: 100%; object-fit: cover; display: block; }

.photochip.marked { border-color: var(--keel); border-width: 2px; }
.photochip.marked img { opacity: 0.32; }

.photochip-x {
  position: absolute;
  inset: auto 0 0 0;
  background: var(--keel);
  color: #fff;
  font-size: 10px;
  font-weight: 600;
  padding: 2px 0;
  text-align: center;
}

@media (min-width: 620px) {
  .entry { grid-template-columns: 76px 1fr; }
  .entry-day { font-size: 44px; }
}

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
}

/* ---------- Company join + team screens ---------- */

.joinsplit {
  display: flex;
  align-items: center;
  gap: 12px;
  margin: 18px 0;
  color: var(--steel);
  font-size: 14px;
}

.joinsplit::before,
.joinsplit::after {
  content: "";
  flex: 1;
  height: 1px;
  background: var(--rule);
}

.codelist { list-style: none; margin: 0; padding: 0; }

.codelist li {
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
  padding: 9px 0;
  border-bottom: 1px solid var(--rule);
}

.codelist li:last-child { border-bottom: none; }

.joincode {
  font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  font-size: 20px;
  font-weight: 600;
  letter-spacing: 0.08em;
  background: var(--wall);
  border: 1px solid var(--rule);
  border-radius: var(--radius);
  padding: 4px 10px;
}

.codelist .grow { flex: 1 1 auto; }

/* ---------- Admin console ---------- */

.adminrow {
  background: var(--board);
  border: 1px solid var(--rule);
  border-left: 4px solid var(--chalk);
  border-radius: var(--radius);
  margin-bottom: 10px;
  padding: 0;
}

.adminrow.is-off { border-left-color: var(--keel); }

.adminrow > summary {
  cursor: pointer;
  list-style: none;
  padding: 13px var(--pad);
  display: grid;
  gap: 3px;
}

.adminrow > summary::-webkit-details-marker { display: none; }
.adminrow > summary:hover { background: #FAFBFB; }

.adminrow-name {
  font-family: "Barlow Condensed", sans-serif;
  font-weight: 600;
  font-size: 23px;
  line-height: 1.15;
}

.adminrow-tags { display: flex; gap: 6px; flex-wrap: wrap; }
.adminrow-meta { font-size: 14px; color: var(--steel); }

.adminrow-body {
  padding: 4px var(--pad) var(--pad);
  border-top: 1px solid var(--rule);
}

.adminrow-body .field { margin-top: 13px; }

/* ---------- Admin: people list ---------- */

.peoplelist { list-style: none; margin: 0; padding: 0; }

.peoplerow {
  padding: 14px 0;
  border-bottom: 1px solid var(--rule);
}

.peoplerow:last-child { border-bottom: none; }
.peoplerow.is-new { border-left: 3px solid var(--keel); padding-left: 11px; }

.peoplerow-top { display: flex; align-items: baseline; gap: 9px; flex-wrap: wrap; }

.peoplerow-name {
  font-family: "Barlow Condensed", sans-serif;
  font-weight: 600;
  font-size: 21px;
}

.peoplerow-tags { display: flex; gap: 5px; flex-wrap: wrap; }
.peoplerow-meta { font-size: 14px; color: var(--steel); margin-top: 2px; }

</style>
</head>

      <a id="back" class="backbtn" href="#/" hidden>Back</a>

</header>

<main id="app" class="app"></main>

(function () {

  var BUCKET = 'jobsite-photos';
  var NOTES_SVG =
    '<svg viewBox="0 0 24 24" width="19" height="19" aria-hidden="true" focusable="false" ' +
      'fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">' +
      '<path d="M12 4v9m0 0 3.4-3.4M12 13 8.6 9.6M5 15.5v3A1.5 1.5 0 0 0 6.5 20h11a1.5 1.5 0 0 0 1.5-1.5v-3"/>' +
    '</svg>';
  var TRASH_SVG =
    '<svg viewBox="0 0 24 24" width="19" height="19" aria-hidden="true" focusable="false" ' +
      'fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">' +
      '<path d="M4 7h16M9 7V4.5h6V7M6.5 7l1 12.5h9l1-12.5M10.5 10.5v6M13.5 10.5v6"/>' +
    '</svg>';
  var MAX_PX = 1600;        // photos are shrunk to this on the long edge before upload
  var JPEG_Q = 0.72;
  var app = document.getElementById('app');
  var toastEl = document.getElementById('toast');
  var whoamiBtn = document.getElementById('whoami');
  var backBtn = document.getElementById('back');
  var brandLogo = document.getElementById('brand-logo');
  var brandText = document.getElementById('brand-text');
  var LOGO_BUCKET = 'company-logos';
  var lightbox = document.getElementById('lightbox');
  var lightboxImg = document.getElementById('lightbox-img');

  var sb = null;
  var me = null;
  var org = null;   // { company_id, company_name, role, active }
  var isAdmin = false;   // platform admin: the vendor, not a customer
  var pendingAuth = null;   // set when arriving from an invite or reset link
  var staged = [];                       // photos picked but not yet uploaded
  var editStaged = [];                   // photos added while editing an entry
  var editRemove = {};                   // existing photo ids marked for removal
  var dash = { q: '', status: 'Active' };
  var view = { entries: [], job: null, q: '', date: '', editing: null };
  var toastTimer = null;

  /* ---------------- small helpers ---------------- */

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.hidden = true; }, 3200);
  }

  function todayISO() {
    var d = new Date();
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  }

  function pad(n) { return (n < 10 ? '0' : '') + n; }

  var MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

  function dateParts(ymd) {
    var p = String(ymd || '').split('-');
    var mon = MONTHS[Number(p[1]) - 1] || '';
    return { day: String(Number(p[2]) || ''), mon: mon, year: p[0] || '' };
  }

  function longDate(ymd) {
    var d = dateParts(ymd);
    return d.mon + ' ' + d.day + ', ' + d.year;
  }

  function clockTime(iso) {
    var d = new Date(iso);
    if (isNaN(d)) return '';
    var h = d.getHours(), m = pad(d.getMinutes());
    var ap = h >= 12 ? 'pm' : 'am';
    h = h % 12; if (h === 0) h = 12;
    return h + ':' + m + ' ' + ap;
  }

  function relTime(iso) {
    var then = new Date(iso).getTime();
    if (isNaN(then)) return '';
    var mins = Math.round((Date.now() - then) / 60000);
    if (mins < 1) return 'just now';
    if (mins < 60) return mins + ' min ago';
    var hrs = Math.round(mins / 60);
    if (hrs < 24) return hrs + (hrs === 1 ? ' hour ago' : ' hours ago');
    var days = Math.round(hrs / 24);
    if (days < 7) return days + (days === 1 ? ' day ago' : ' days ago');
    var wks = Math.round(days / 7);
    if (wks < 5) return wks + (wks === 1 ? ' week ago' : ' weeks ago');
    return longDate(iso.slice(0, 10));
  }

  function companyName() {
    return (org && org.company_name) || window.CONFIG.COMPANY_NAME || '';
  }

  // The bucket is private, so each photo gets a temporary signed link.
  // Links are attached to the photo rows once, when a job is loaded.
  var SIGNED_FOR = 60 * 60 * 4;   // 4 hours

  function signPhotos(entries) {
    var photos = [];
    (entries || []).forEach(function (en) {
      (en.entry_photos || []).forEach(function (p) { photos.push(p); });
    });
    if (!photos.length) return Promise.resolve(entries);

    var paths = photos.map(function (p) { return p.storage_path; });

    return sb.storage.from(BUCKET).createSignedUrls(paths, SIGNED_FOR)
      .then(function (res) {
        var byPath = {};
        (res.data || []).forEach(function (r) {
          if (r && r.path && r.signedUrl) byPath[r.path] = r.signedUrl;
        });
        photos.forEach(function (p) { p.url = byPath[p.storage_path] || ''; });
        return entries;
      })
      .catch(function () { return entries; });
  }

  function tagChip(tag) {
    return tag === 'issue' ? '<span class="chip chip-issue">Issue</span>' : '';
  }

  function on(id, evt, fn) {
    var node = document.getElementById(id);
    if (node) node.addEventListener(evt, fn);
  }

  /* ---------------- boot ---------------- */

  function configured() {
    var c = window.CONFIG || {};
    return c.SUPABASE_URL && c.SUPABASE_URL.indexOf('supabase.co') > -1 &&
           c.SUPABASE_ANON_KEY && c.SUPABASE_ANON_KEY.length > 30;
  }

  function boot() {
    if (!configured()) return renderSetupNeeded();

    // Invite and reset links arrive as #access_token=...&type=invite. Read that
    // before creating the client, because the client consumes and clears it.
    pendingAuth = readAuthHash();

    sb = window.supabase.createClient(window.CONFIG.SUPABASE_URL, window.CONFIG.SUPABASE_ANON_KEY, {
      auth: { detectSessionInUrl: true, flowType: 'implicit', persistSession: true }
    });

    whoamiBtn.addEventListener('click', function () {
      location.hash = (isAdmin && !org) ? '#/admin' : '#/team';
    });

    document.getElementById('lightbox-close').addEventListener('click', closeLightbox);
    lightbox.addEventListener('click', function (e) { if (e.target === lightbox) closeLightbox(); });
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeLightbox(); });

    startSession();
  }

  // Identity comes from the login token, not from anything typed in.
  // Pulls type and any error out of the fragment an email link lands on.
  function readAuthHash() {
    var h = (location.hash || '').replace(/^#\/?/, '');
    if (h.indexOf('access_token=') === -1 && h.indexOf('error') === -1) return null;

    var out = {};
    h.split('&').forEach(function (pair) {
      var bits = pair.split('=');
      if (bits.length === 2) out[bits[0]] = decodeURIComponent(bits[1].replace(/\+/g, ' '));
    });

    return {
      type: out.type || '',
      error: out.error_description || out.error || ''
    };
  }

  function meFromSession(session) {
    if (!session || !session.user) return null;
    var u = session.user;
    var meta = u.user_metadata || {};
    return {
      email: u.email,
      name: meta.full_name || meta.name || (u.email || '').split('@')[0]
    };
  }

  function startSession() {
    sb.auth.onAuthStateChange(function (event, session) {
      var next = meFromSession(session);
      var was = me && me.email;
      me = next;
      if (!next && was) { org = null; toast('Signed out'); route(); }
    });

    sb.auth.getSession().then(function (res) {
      me = meFromSession(res.data && res.data.session);
      window.addEventListener('hashchange', route);
      if (!me) return route();
      loadOrg().then(route);
    });
  }

  // The header shows the company's own logo, its name if there is no logo,
  // and the product name before anyone signs in.
  function paintBrand() {
    if (org && org.logo_url) {
      brandLogo.src = org.logo_url;
      brandLogo.alt = org.company_name || '';
      brandLogo.hidden = false;
      brandText.hidden = true;
      return;
    }
    brandLogo.hidden = true;
    brandLogo.removeAttribute('src');
    brandText.hidden = false;
    brandText.textContent = (org && org.company_name) || 'Jobsite Logger';
  }

  function loadOrg() {
    return Promise.all([
      sb.rpc('my_membership'),
      sb.rpc('is_platform_admin').then(function (r) { return r; }, function () { return {}; })
    ]).then(function (both) {
      var res = both[0];
      isAdmin = both[1] && both[1].data === true;
      var row = (res.data || [])[0];
      org = row ? {
        company_id: row.company_id,
        company_name: row.company_name,
        role: row.role,
        active: row.active,
        seat_limit: row.seat_limit,
        seats_used: row.seats_used,
        access_until: row.access_until || null,
        logo_path: row.logo_path || null,
        logo_url: row.logo_path
          ? sb.storage.from(LOGO_BUCKET).getPublicUrl(row.logo_path).data.publicUrl
          : null
      } : null;
    }).catch(function () { org = null; isAdmin = false; });
  }

  function route() {
    staged = [];
    clearEditState();
    whoamiBtn.hidden = !me;

    var hash = location.hash || '#/';
    var m = hash.match(/^#\/job\/([0-9a-fA-F-]{6,})/);
    var isTeam = hash.indexOf('#/team') === 0;
    var isAdminPage = hash.indexOf('#/admin') === 0;

    paintBrand();

    // Back only appears where there is somewhere to go back to.
    backBtn.hidden = !me || (!m && !isTeam && !isAdminPage);

    if (pendingAuth && pendingAuth.error) {
      var msg = pendingAuth.error;
      pendingAuth = null;
      return renderLinkProblem(msg);
    }

    // An invite or reset link signs them in, then they must set a password.
    if (me && pendingAuth && (pendingAuth.type === 'invite' || pendingAuth.type === 'recovery')) {
      return renderSetPassword();
    }

    if (!me) return renderAuth();
    if (isAdminPage && isAdmin) return renderAdmin();
    // The vendor has no company of their own, so the console is home.
    if (isAdmin && !org) return renderAdmin();
    if (!org) return renderJoin();
    if (!org.active) return renderSuspended();
    if (isTeam) return renderTeam();
    if (m) return renderJob(m[1]);
    renderDashboard();
  }

  /* ---------------- setup screen ---------------- */

  function renderSetupNeeded() {
    app.innerHTML =
      '<div class="panel setup" style="margin-top:18px">' +
        '<h1 style="font-size:28px">Finish the setup</h1>' +
        '<p class="muted">The app is running, but it does not know where to store your notes yet.</p>' +
        '<ol>' +
          '<li>Open this <code>index.html</code> file in Notepad — right-click it, choose Open with, then Notepad.</li>' +
          '<li>Paste your Supabase <strong>Project URL</strong> and <strong>anon key</strong> between the quote marks.</li>' +
          '<li>Save the file, then refresh this page. If the file is on GitHub, commit the change and wait about a minute.</li>' +
        '</ol>' +
        '<p class="muted small">Step 2 of README.md shows exactly where those two values live in Supabase.</p>' +
      '</div>';
  }

  /* ---------------- sign in ---------------- */

  function renderAuth() {
    app.innerHTML =
      '<div class="gate panel">' +
        '<h1>Sign in</h1>' +
        '<p>Use the email and password you were given.</p>' +
        '<div class="field"><label for="in-email">Email</label>' +
          '<input id="in-email" type="email" autocomplete="username" inputmode="email" ' +
            'autocapitalize="off" spellcheck="false" placeholder="dave@example.com"></div>' +
        '<div class="field"><label for="in-pass">Password</label>' +
          '<input id="in-pass" type="password" autocomplete="current-password" placeholder="••••••••"></div>' +
        '<div class="field"><button id="do-auth" class="btn btn-block">Sign in</button></div>' +
        '<button id="do-forgot" class="btn-plain">Forgot your password?</button>' +
        '<p class="small muted" style="margin:0">Accounts are set up for you — there is no sign-up here. ' +
          'Need a login? Ask whoever set up your crew.</p>' +
      '</div>';

    on('do-forgot', 'click', doForgot);
    on('do-auth', 'click', doSignIn);
    on('in-pass', 'keydown', function (e) { if (e.key === 'Enter') doSignIn(); });
    document.getElementById('in-email').focus();
  }

  function doSignIn() {
    var email = document.getElementById('in-email').value.trim().toLowerCase();
    var pass = document.getElementById('in-pass').value;

    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return toast('Enter your email address.');
    if (!pass) return toast('Enter your password.');

    var btn = document.getElementById('do-auth');
    btn.disabled = true;
    btn.textContent = 'Signing in…';

    sb.auth.signInWithPassword({ email: email, password: pass }).then(function (res) {
      if (res.error) {
        btn.disabled = false;
        btn.textContent = 'Sign in';
        var m = res.error.message || '';
        if (/invalid login/i.test(m)) return toast('That email and password do not match.');
        if (/not confirmed/i.test(m)) return toast('This account is not confirmed yet — ask the office.');
        return toast(m);
      }
      me = meFromSession(res.data.session);
      loadOrg().then(function () { location.hash = '#/'; route(); });
    });
  }

  function doForgot() {
    var email = document.getElementById('in-email').value.trim().toLowerCase();
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
      document.getElementById('in-email').focus();
      return toast('Type your email address above first, then tap this.');
    }

    var btn = document.getElementById('do-forgot');
    btn.disabled = true;
    btn.textContent = 'Sending…';

    sb.auth.resetPasswordForEmail(email, {
      redirectTo: location.origin + location.pathname
    }).then(function (res) {
      btn.disabled = false;
      btn.textContent = 'Forgot your password?';
      if (res.error) return toast(res.error.message);
      // Deliberately vague: confirming which addresses exist would leak them.
      toast('If that address has an account, a reset link is on its way. Check your junk folder too.');
    });
  }

  /* ---------------- setting a password from an invite or reset ---------------- */

  function renderSetPassword() {
    var invited = pendingAuth && pendingAuth.type === 'invite';
    var needName = !me.name || me.name === (me.email || '').split('@')[0];

    app.innerHTML =
      '<div class="gate panel">' +
        '<h1>' + (invited ? 'Set your password' : 'Choose a new password') + '</h1>' +
        '<p>' + (invited
          ? 'Welcome. Pick a password and you are in.'
          : 'Pick a new password for your account.') + '</p>' +
        '<p class="small muted">' + esc(me.email) + '</p>' +

        (needName
          ? '<div class="field"><label for="sp-name">Your name</label>' +
              '<input id="sp-name" type="text" autocomplete="name" placeholder="Dave Kruger">' +
              '<p class="small muted" style="margin:6px 0 0">This shows on everything you post.</p></div>'
          : '') +

        '<div class="field"><label for="sp-pass">Password</label>' +
          '<input id="sp-pass" type="password" autocomplete="new-password" placeholder="••••••••"></div>' +
        '<p class="small muted" style="margin:-4px 0 12px">At least 8 characters.</p>' +
        '<div class="field"><label for="sp-pass2">Confirm password</label>' +
          '<input id="sp-pass2" type="password" autocomplete="new-password" placeholder="••••••••"></div>' +

        '<div class="field"><button id="sp-save" class="btn btn-block">Save and continue</button></div>' +
        '<button id="sp-out" class="btn-plain">Sign out instead</button>' +
      '</div>';

    on('sp-save', 'click', saveNewPassword);
    on('sp-pass2', 'keydown', function (e) {
      if (e.key === 'Enter') document.getElementById('sp-save').click();
    });
    document.getElementById(needName ? 'sp-name' : 'sp-pass').focus();
  }

  function saveNewPassword() {
    var nameBox = document.getElementById('sp-name');
    var name = nameBox ? nameBox.value.trim() : '';
    var pass = document.getElementById('sp-pass').value;
    var pass2 = document.getElementById('sp-pass2').value;

    if (nameBox && name.length < 2) return toast('Enter your name.');
    if (pass.length < 8) return toast('Use a password of at least 8 characters.');
    if (pass !== pass2) {
      document.getElementById('sp-pass2').focus();
      return toast('The two passwords do not match.');
    }

    var btn = document.getElementById('sp-save');
    btn.disabled = true;
    btn.textContent = 'Saving…';

    var payload = { password: pass };
    if (nameBox) payload.data = { full_name: name };

    sb.auth.updateUser(payload).then(function (res) {
      if (res.error) {
        btn.disabled = false;
        btn.textContent = 'Save and continue';
        var m = res.error.message || '';
        if (/same.*password/i.test(m)) return toast('That is already your password — pick a different one.');
        return toast(m);
      }

      pendingAuth = null;
      if (nameBox) me.name = name;
      toast('Password saved');

      loadOrg().then(function () {
        location.hash = '#/';
        route();
      });
    });
  }

  function renderLinkProblem(msg) {
    app.innerHTML =
      '<div class="gate panel">' +
        '<h1>That link did not work</h1>' +
        '<p>' + esc(msg) + '</p>' +
        '<p class="small muted">Invite and reset links expire after an hour and only work once. ' +
          'Ask for a fresh one.</p>' +
        '<div class="field"><button id="lp-back" class="btn btn-block">Back to sign in</button></div>' +
      '</div>';

    on('lp-back', 'click', function () { location.hash = '#/'; route(); });
  }

  /* ---------------- account not linked to a crew yet ---------------- */

  function renderJoin() {
    app.innerHTML =
      '<div class="gate panel">' +
        '<h1>Almost there</h1>' +
        '<p>Your login works, but it is not attached to a crew yet. ' +
          'Whoever set up your account needs to add you — that usually takes a minute.</p>' +
        '<p class="small muted">Signed in as ' + esc(me.email) + '</p>' +
        '<div class="field"><button id="do-recheck" class="btn btn-block">Check again</button></div>' +
        '<button id="do-signout" class="btn-plain">Sign out</button>' +
      '</div>';

    on('do-recheck', 'click', function () {
      var btn = document.getElementById('do-recheck');
      btn.disabled = true;
      btn.textContent = 'Checking…';
      loadOrg().then(function () {
        if (org) { location.hash = '#/'; return route(); }
        btn.disabled = false;
        btn.textContent = 'Check again';
        toast('Not yet — try again in a minute.');
      });
    });

    on('do-signout', 'click', signOut);
  }

  function renderSuspended() {
    var expired = org.access_until && new Date(org.access_until) <= new Date();

    app.innerHTML =
      '<div class="gate panel">' +
        '<h1>' + (expired ? 'Access has ended' : 'Account paused') + '</h1>' +
        '<p>' + esc(org.company_name) + (expired
          ? '\u2019s access ended on ' + esc(longDate(org.access_until.slice(0, 10))) + '.'
          : ' is paused.') +
        ' Every job, note and photo is exactly where you left it and nothing has been deleted. ' +
        'Get in touch to switch it back on.</p>' +
        '<button id="do-signout" class="btn-plain">Sign out</button>' +
      '</div>';
    on('do-signout', 'click', signOut);
  }

  function signOut() {
    sb.auth.signOut().then(function () {
      me = null; org = null; isAdmin = false;
      location.hash = '#/';
      route();
    });
  }

  // Postgres errors arrive prefixed and technical; the message we raised is the useful part.
  function cleanRpcError(err) {
    var m = (err && err.message) || 'Something went wrong.';
    return m.replace(/^.*?:\s*/, '').replace(/\s*CONTEXT:[\s\S]*$/, '');
  }

  /* ---------------- admin console (vendor only) ---------------- */

  var adminNew = false;   // is the "add a contractor" panel open

  function renderAdmin() {
    app.innerHTML = '<p class="muted">Loading customers…</p>';

    Promise.all([
      sb.rpc('admin_list_companies'),
      sb.rpc('admin_list_users'),
      sb.rpc('admin_company_options')
    ]).then(function (r) {
      if (r[0].error) {
        return renderError('Admin data could not be loaded. ' + r[0].error.message);
      }

      var list = r[0].data || [];
      var users = (r[1] && r[1].data) || [];
      var options = (r[2] && r[2].data) || [];
      var unassigned = users.filter(function (u) { return !u.company_id; });
      var now = new Date();

      var live = list.filter(adminHasAccess).length;
      var paying = list.filter(function (c) { return c.plan === 'paid'; }).length;
      var seats = list.reduce(function (n, c) { return n + (c.member_count || 0); }, 0);
      var jobs = list.reduce(function (n, c) { return n + (c.job_count || 0); }, 0);

      // Anything worth chasing this week.
      var soon = list.filter(function (c) {
        if (!c.access_until) return false;
        var d = new Date(c.access_until);
        return d > now && (d - now) / 86400000 <= 7;
      });
      var ended = list.filter(function (c) {
        return c.access_until && new Date(c.access_until) <= now;
      });

      app.innerHTML =
        '<div class="jobhead">' +
          '<h1>Customer accounts</h1>' +
          '<div class="jobhead-meta">' + list.length + (list.length === 1 ? ' contractor' : ' contractors') +
            ' · ' + live + ' with access · ' + paying + ' paying · ' +
            seats + ' people · ' + jobs + ' jobs</div>' +
          '<div class="row">' +
            '<button id="adm-new" class="btn">Add a contractor</button>' +
            '<button id="adm-refresh" class="btn btn-quiet">Refresh</button>' +
          '</div>' +
        '</div>' +

        ((soon.length || ended.length)
          ? '<div class="panel" style="margin-top:14px;border-left:5px solid var(--keel)">' +
              '<strong>Needs attention</strong>' +
              (ended.length ? '<p class="small" style="margin:6px 0 0">' + ended.length +
                ' with access ended: ' + ended.map(function (c) { return esc(c.name); }).join(', ') + '</p>' : '') +
              (soon.length ? '<p class="small" style="margin:6px 0 0">' + soon.length +
                ' ending within 7 days: ' + soon.map(function (c) {
                  return esc(c.name) + ' (' + esc(longDate(c.access_until.slice(0, 10))) + ')';
                }).join(', ') + '</p>' : '') +
            '</div>'
          : '') +

        (adminNew
          ? '<div class="panel" style="margin-top:14px">' +
              '<h2 style="font-size:22px;margin-bottom:12px">Add a contractor</h2>' +
              '<div class="field"><label for="nc-name">Company name</label>' +
                '<input id="nc-name" type="text" placeholder="Drywall Business LLC"></div>' +
              '<div class="row" style="margin-top:13px">' +
                '<div class="grow"><label for="nc-seats">Seats</label>' +
                  '<input id="nc-seats" type="text" inputmode="numeric" value="5"></div>' +
                '<div class="grow"><label for="nc-days">Access for (days)</label>' +
                  '<input id="nc-days" type="text" inputmode="numeric" value="14"></div>' +
              '</div>' +
              '<div class="row" style="margin-top:14px">' +
                '<button id="nc-save" class="btn grow">Create and get owner code</button>' +
                '<button id="nc-cancel" class="btn btn-quiet">Cancel</button>' +
              '</div>' +
            '</div>'
          : '') +

        '<div class="section-head"><h2>Contractors</h2>' +
          '<span class="small muted">Newest first</span></div>' +

        (list.length
          ? list.map(adminRowHtml).join('')
          : '<div class="empty"><h2>No contractors yet</h2>' +
            '<p>Use “Add a contractor” to set one up and get a code to send them.</p></div>') +

        '<div class="section-head"><h2>People</h2>' +
          '<span class="small muted">' + users.length + ' accounts · ' +

  function wireAdmin() {
    on('adm-refresh', 'click', renderAdmin);

    Array.prototype.forEach.call(document.querySelectorAll('.js-assign'), function (b) {
      b.addEventListener('click', function () {
        var id = b.dataset.id;
        var company = document.getElementById('uc-' + id).value;
        var role = document.getElementById('ur-' + id).value;
        if (!company) return toast('Choose which crew they belong to.');

        b.disabled = true;
        b.textContent = 'Saving…';

        sb.rpc('admin_assign_user', { p_user: id, p_company: company, p_role: role })
          .then(function (res) {
            b.disabled = false;
            if (res.error) { b.textContent = 'Assign'; return toast(cleanRpcError(res.error)); }
            toast('Access granted');
            renderAdmin();
          });
      });
    });

    Array.prototype.forEach.call(document.querySelectorAll('.js-unassign'), function (b) {
      b.addEventListener('click', function () {
        if (!confirm('Remove ' + b.dataset.name + ' from their crew?\n\nThey lose access immediately. Their past entries and photos stay in the log.')) return;
        sb.rpc('admin_unassign_user', { p_user: b.dataset.id }).then(function (res) {
          if (res.error) return toast(cleanRpcError(res.error));
          toast('Access removed');
          renderAdmin();
        });
      });

    on('adm-new', 'click', function () { adminNew = !adminNew; renderAdmin(); });
    on('nc-cancel', 'click', function () { adminNew = false; renderAdmin(); });

    on('nc-save', 'click', function () {
      var name = document.getElementById('nc-name').value.trim();
      var seats = parseInt(document.getElementById('nc-seats').value, 10);
      var days = parseInt(document.getElementById('nc-days').value, 10);
      if (name.length < 2) return toast('Enter the company name.');

      var btn = document.getElementById('nc-save');
      btn.disabled = true; btn.textContent = 'Creating…';

      sb.rpc('admin_create_company', {
        p_name: name,
        p_seats: isNaN(seats) ? 5 : seats,
        p_days: isNaN(days) ? 14 : days
      }).then(function (res) {
        btn.disabled = false; btn.textContent = 'Create and get owner code';

        adminNew = false;
        renderAdmin();
        alert('Created "' + name + '".\n\nNext: add their login in Supabase under ' +
              'Authentication \u2192 Users \u2192 Add user (tick Auto Confirm), then assign it to ' +
              'this crew as owner in the People section below.');
      });

    Array.prototype.forEach.call(document.querySelectorAll('.js-adm-save'), function (b) {
      b.addEventListener('click', function () {
        var id = b.dataset.id;

        var n = parseInt(seats, 10);

        if (seats !== '' && (isNaN(n) || n < 1)) return toast('Seats must be a number, 1 or more.');

        b.disabled = true; b.textContent = 'Saving…';

        sb.rpc('admin_update_company', {
          p_id: id,
          p_active: null,
          p_plan: document.getElementById('ap-' + id).value,
          p_trial: null,
          p_notes: document.getElementById('an-' + id).value,
          p_seats: seats === '' ? null : n,
          p_access: access ? access + 'T23:59:00Z' : null,
          p_clear_access: !access
        }).then(function (res) {
          b.disabled = false; b.textContent = 'Save changes';
          if (res.error) return toast(cleanRpcError(res.error));
          toast('Saved');
          renderAdmin();
        });
      });
    });

    Array.prototype.forEach.call(document.querySelectorAll('.js-adm-extend'), function (b) {
      b.addEventListener('click', function () {
        var days = parseInt(b.dataset.days, 10);
        var d = new Date();

        var iso = d.toISOString().slice(0, 10);

        sb.rpc('admin_update_company', {
          p_id: b.dataset.id, p_active: true, p_plan: null, p_trial: null,
          p_notes: null, p_seats: null,
          p_access: iso + 'T23:59:00Z', p_clear_access: false
        }).then(function (res) {
          if (res.error) return toast(cleanRpcError(res.error));
          toast('Access extended to ' + longDate(iso));
          renderAdmin();
        });
      });
    });

    Array.prototype.forEach.call(document.querySelectorAll('.js-adm-toggle'), function (b) {
      b.addEventListener('click', function () {
        var on_ = b.dataset.active === '1';
        if (!confirm((on_ ? 'Pause ' : 'Unpause ') + b.dataset.name +
              '?\n\n' + (on_ ? 'Their crew loses access immediately. Nothing is deleted.'
                             : 'Their crew gets access back straight away.'))) return;

        sb.rpc('admin_update_company', {
          p_id: b.dataset.id, p_active: !on_, p_plan: null, p_trial: null,
          p_notes: null, p_seats: null, p_access: null, p_clear_access: false
        }).then(function (res) {
          if (res.error) return toast(cleanRpcError(res.error));
          toast(on_ ? 'Paused' : 'Unpaused');
          renderAdmin();
        });
      });
    });

    Array.prototype.forEach.call(document.querySelectorAll('.js-adm-crew'), function (b) {
      b.addEventListener('click', function () {
        var box = document.getElementById('crew-' + b.dataset.id);
        if (box.innerHTML) { box.innerHTML = ''; b.textContent = 'Show crew'; return; }

        b.textContent = 'Loading…';
        sb.rpc('admin_list_members', { p_company: b.dataset.id }).then(function (res) {
          b.textContent = 'Hide crew';
          if (res.error) { box.innerHTML = ''; return toast(cleanRpcError(res.error)); }
          var rows = res.data || [];
          box.innerHTML = rows.length
            ? '<ul class="codelist">' + rows.map(function (m) {
                return '<li><span class="grow">' + esc(m.full_name || m.email.split('@')[0]) +
                  ' <span class="muted small">' + esc(m.email) + '</span></span>' +
                  '<span class="chip">' + esc(m.role) + '</span></li>';
              }).join('') + '</ul>'
            : '<p class="small muted">Nobody has joined yet.</p>';
        });
      });
    });
  }

  function uploadLogo(file) {
    if (file.type && file.type.indexOf('image/') !== 0) {
      return toast('That is not an image file — try a PNG or JPG.');
    }
    if (file.size > 6 * 1024 * 1024) return toast('That image is very large — try one under 6 MB.');

    toast('Uploading logo…');
    var old = org.logo_path;

    shrinkLogo(file).then(function (out) {
      var path = org.company_id + '/logo-' + Date.now() + '.' + out.ext;
      return sb.storage.from(LOGO_BUCKET)
        .upload(path, out.blob, { contentType: out.type, upsert: false })
        .then(function (up) {
          if (up.error) throw up.error;
          return sb.rpc('set_company_logo', { p_path: path });
        })
        .then(function (res) {
          if (res.error) throw res.error;
          if (old && old !== path) sb.storage.from(LOGO_BUCKET).remove([old]);
          return loadOrg();
        });
    }).then(function () {
      paintBrand();
      toast('Logo updated');
      renderTeam();
    }).catch(function (err) {
      toast('Could not upload the logo: ' + (err.message || err));
    });
  }

  // Scaled to twice the header height so it stays sharp on phones.
  // PNG is kept as PNG so transparent backgrounds survive.
  function shrinkLogo(file) {
    return new Promise(function (resolve, reject) {
      var url = URL.createObjectURL(file);
      var img = new Image();
      img.onload = function () {
        var maxH = 96, maxW = 480;
        var scale = Math.min(1, maxH / img.height, maxW / img.width);
        var w = Math.max(1, Math.round(img.width * scale));
        var h = Math.max(1, Math.round(img.height * scale));

        var canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        URL.revokeObjectURL(url);

        var keepPng = /png|webp/i.test(file.type);
        var type = keepPng ? 'image/png' : 'image/jpeg';
        canvas.toBlob(function (blob) {
          if (!blob) return reject(new Error('That image could not be processed.'));
          resolve({ blob: blob, type: type, ext: keepPng ? 'png' : 'jpg' });
        }, type, keepPng ? undefined : 0.9);
      };
      img.onerror = function () {
        URL.revokeObjectURL(url);
        reject(new Error('That file did not look like an image.'));
      };
      img.src = url;
    });
  }

  function paintDashboard(jobs) {
    var q = dash.q.toLowerCase();
    var shown = jobs.filter(function (j) {
      var okStatus = dash.status === 'All' || j.status === dash.status;
      var hay = (j.name + ' ' + (j.address || '') + ' ' + (j.client_name || '')).toLowerCase();
      return okStatus && (!q || hay.indexOf(q) > -1);
    });

    var counts = { active: 0, completed: 0 };
    jobs.forEach(function (j) { j.status === 'Completed' ? counts.completed++ : counts.active++; });

    app.innerHTML =
      '<div class="row" style="margin-bottom:4px">' +
        '<div class="grow"><label for="dash-q">Search jobs</label>' +
          '<input id="dash-q" type="text" value="' + esc(dash.q) + '" placeholder="Name, address or client"></div>' +
        '<div style="flex:0 0 150px"><label for="dash-status">Show</label>' +
          '<select id="dash-status">' +
            opt('Active', 'Active (' + counts.active + ')', dash.status) +
            opt('Completed', 'Completed (' + counts.completed + ')', dash.status) +
            opt('All', 'All jobs (' + jobs.length + ')', dash.status) +
          '</select></div>' +
      '</div>' +

        var job = jobs.filter(function (j) { return j.id === b.dataset.id; })[0];
        if (job) exportJobNotes(job, b);

  function paintDashboardKeepFocus(jobs, focusId) {
    var pos = document.getElementById(focusId).selectionStart;

  function postEntry() {

    var tag = (document.querySelector('input[name=tag]:checked') || {}).value || 'note';
    var when = document.getElementById('c-date').value || todayISO();

  function uploadPhotos(entry, files, btn) {
    if (!files.length) return Promise.resolve();
    var done = 0;
    var rows = [];

    return files.reduce(function (chain, file, i) {
      return chain.then(function () {
        return shrink(file).then(function (blob) {
          var path = org.company_id + '/' + view.job.id + '/' + entry.id + '/' + Date.now() + '-' + i + '.jpg';
          return sb.storage.from(BUCKET).upload(path, blob, { contentType: 'image/jpeg' })
            .then(function (up) {
              if (up.error) throw up.error;
              rows.push({ entry_id: entry.id, storage_path: path });
              done++;
              if (btn) btn.textContent = 'Uploading photo ' + done + ' of ' + files.length + '…';
            });
        });
      });
    }, Promise.resolve()).then(function () {
      return sb.from('entry_photos').insert(rows).then(function (res) {
        if (res.error) throw res.error;
      });
    });
  }

  // Phone photos are 4-8 MB each. Shrinking in the browser keeps uploads fast
  // on a weak site signal and keeps you well inside the free storage tier.
  function shrink(file) {
    return new Promise(function (resolve, reject) {
      var url = URL.createObjectURL(file);
      var img = new Image();
      img.onload = function () {
        var scale = Math.min(1, MAX_PX / Math.max(img.width, img.height));
        var w = Math.round(img.width * scale), h = Math.round(img.height * scale);
        var canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        URL.revokeObjectURL(url);
        canvas.toBlob(function (blob) {
          resolve(blob || file);
        }, 'image/jpeg', JPEG_Q);
      };
      img.onerror = function () { URL.revokeObjectURL(url); reject(new Error('That photo could not be read.')); };
      img.src = url;
    });
  }

  function saveEdit(id) {
    var en = view.entries.filter(function (x) { return x.id === id; })[0];
    if (!en) return;

    var notes = document.getElementById('e-notes').value.trim();
    var tag = (document.querySelector('input[name=etag]:checked') || {}).value || 'note';
    var when = document.getElementById('e-date').value || en.entry_date;

    var photos = en.entry_photos || [];
    var dropping = photos.filter(function (p) { return editRemove[p.id]; });
    var keeping = photos.length - dropping.length;

    if (!notes && !editStaged.length && keeping === 0) {
      return toast('An entry needs a note or a photo.');
    }

    var btn = document.getElementById('e-save');
    btn.disabled = true;
    btn.textContent = 'Saving…';

    sb.from('entries')
      .update({ notes: notes, tag: tag, entry_date: when })
      .eq('id', id).eq('author_email', me.email)
      .then(function (res) {
        if (res.error) throw res.error;
        if (!dropping.length) return;
        var paths = dropping.map(function (p) { return p.storage_path; });
        var ids = dropping.map(function (p) { return p.id; });
        return sb.storage.from(BUCKET).remove(paths).then(function () {
          return sb.from('entry_photos').delete().in('id', ids).then(function (r) {
            if (r.error) throw r.error;
          });
        });
      })
      .then(function () { return uploadPhotos(en, editStaged, btn); })
      .then(function () {
        toast('Entry updated');
        clearEditState();
        renderJob(view.job.id);
      })
      .catch(function (err) {
        btn.disabled = false;
        btn.textContent = 'Save changes';
        toast('Could not save: ' + (err.message || err));
      });
  }

  function deleteEntry(id) {
    var en = view.entries.filter(function (x) { return x.id === id; })[0];
    if (!en) return;
    if (!confirm('Delete this entry and its photos? This cannot be undone.')) return;

    var paths = (en.entry_photos || []).map(function (p) { return p.storage_path; });
    var first = paths.length ? sb.storage.from(BUCKET).remove(paths) : Promise.resolve({});

    first.then(function () {
      return sb.from('entries').delete().eq('id', id).eq('author_email', me.email);
    }).then(function (res) {

    });

  /* ---------------- plain text export ---------------- */

  // One file per job: notes only, oldest day first, no photos.
  function exportJobNotes(job, btn) {
    btn.disabled = true;
    toast('Building notes file…');

    sb.from('entries')
      .select('author_name,notes,tag,entry_date,created_at')
      .eq('job_id', job.id)
      .order('entry_date', { ascending: true })
      .order('created_at', { ascending: true })
      .then(function (res) {
        if (res.error) throw res.error;
        var list = res.data || [];

        var L = [];
        L.push(job.name);
        L.push(new Array(job.name.length + 1).join('='));
        if (job.client_name) L.push('Client:  ' + job.client_name);
        if (job.address)     L.push('Address: ' + job.address);
        L.push('Status:  ' + job.status);
        L.push('Entries: ' + list.length);
        L.push('Saved:   ' + longDate(todayISO()) + ' by ' + companyName());
        L.push('');

        if (!list.length) {
          L.push('No entries yet.');
        } else {
          list.forEach(function (en) {
            L.push('----------------------------------------');
            L.push(longDate(en.entry_date) + '   ' + en.author_name + '   ' +
                   clockTime(en.created_at) + (en.tag === 'issue' ? '   [ISSUE]' : ''));
            L.push('');
            if (en.notes) L.push(en.notes);
            L.push('');
          });
        }

        var stem = job.name.replace(/[^a-z0-9]+/gi, '-').replace(/^-|-$/g, '').toLowerCase();
        downloadFile(stem + '-notes-' + todayISO() + '.txt',
                     L.join('\r\n'), 'text/plain;charset=utf-8');

        btn.disabled = false;
        toast('Notes saved');
      })
      .catch(function (err) {
        btn.disabled = false;
        toast('Could not build the file: ' + (err.message || err));
      });
  }

  function downloadFile(filename, text, type) {
    var url = URL.createObjectURL(new Blob([text], { type: type }));
    var a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    setTimeout(function () { URL.revokeObjectURL(url); a.remove(); }, 2000);
  }

  /* ---------------- PDF report ---------------- */

  function exportPdf() {
    var btn = document.getElementById('do-pdf');
    btn.disabled = true;
    btn.textContent = 'Building…';

    var list = visibleEntries().slice().reverse();   // oldest first reads better for a client
    var doc = new window.jspdf.jsPDF({ unit: 'pt', format: 'letter' });
    var M = 48, PW = 612, PH = 792, CW = PW - M * 2;
    var y = M;

    function space(need) {
      if (y + need > PH - M) { doc.addPage(); y = M; }
    }

    doc.setFont('helvetica', 'bold'); doc.setFontSize(22);
    doc.text(view.job.name, M, y); y += 26;

    doc.setFont('helvetica', 'normal'); doc.setFontSize(11);
    [
      view.job.client_name ? 'Client: ' + view.job.client_name : '',
      view.job.address || '',
      'Status: ' + view.job.status,
      'Report prepared by ' + companyName() + ' on ' + longDate(todayISO()),
      list.length + (list.length === 1 ? ' entry' : ' entries')
    ].filter(Boolean).forEach(function (line) {
      doc.text(line, M, y); y += 15;
    });

    y += 6;
    doc.setDrawColor(120); doc.line(M, y, PW - M, y); y += 20;

    var step = list.reduce(function (chain, en) {
      return chain.then(function () {
        space(70);
        doc.setFont('helvetica', 'bold'); doc.setFontSize(13);
        doc.text(longDate(en.entry_date), M, y);
        doc.setFont('helvetica', 'normal'); doc.setFontSize(10);
        var right = en.author_name + (en.tag && en.tag !== 'note' ? '  ·  ' + en.tag.toUpperCase() : '');
        doc.text(right, PW - M, y, { align: 'right' });
        y += 16;

        if (en.notes) {
          doc.setFontSize(11);
          var lines = doc.splitTextToSize(en.notes, CW);
          lines.forEach(function (ln) { space(16); doc.text(ln, M, y); y += 14; });
        }

        var photos = en.entry_photos || [];
        if (!photos.length) { y += 14; return; }
        y += 6;

        return photos.reduce(function (c2, p, i) {
          return c2.then(function () {
            return imageData(p.url || '').then(function (im) {
              if (!im) return;
              var boxW = (CW - 12) / 2;
              var w = boxW, h = boxW * (im.h / im.w);
              if (h > 200) { h = 200; w = 200 * (im.w / im.h); }
              var col = i % 2;
              if (col === 0) space(h + 12);
              var x = M + col * (boxW + 12);
              doc.addImage(im.data, 'JPEG', x, y, w, h);
              if (col === 1 || i === photos.length - 1) y += h + 12;
            });
          });
        }, Promise.resolve()).then(function () { y += 10; });
      });
    }, Promise.resolve());

    step.then(function () {
      var pages = doc.getNumberOfPages();
      for (var p = 1; p <= pages; p++) {
        doc.setPage(p);
        doc.setFont('helvetica', 'normal'); doc.setFontSize(9); doc.setTextColor(110);
        doc.text(companyName() + '  —  ' + view.job.name, M, PH - 26);
        doc.text('Page ' + p + ' of ' + pages, PW - M, PH - 26, { align: 'right' });
      }
      var safe = view.job.name.replace(/[^a-z0-9]+/gi, '-').toLowerCase();
      doc.save(safe + '-report-' + todayISO() + '.pdf');
      btn.disabled = false;
      btn.textContent = 'Client PDF';
    }).catch(function (err) {
      btn.disabled = false;
      btn.textContent = 'Client PDF';
      toast('PDF failed: ' + (err.message || err));
    });
  }

  // Photos are re-drawn small so a 30-entry report stays a reasonable file size.
  function imageData(url) {
    return fetch(url).then(function (r) { return r.blob(); }).then(function (blob) {
      return new Promise(function (resolve) {
        var objUrl = URL.createObjectURL(blob);
        var img = new Image();
        img.onload = function () {
          var scale = Math.min(1, 900 / Math.max(img.width, img.height));
          var w = Math.round(img.width * scale), h = Math.round(img.height * scale);
          var canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          canvas.getContext('2d').drawImage(img, 0, 0, w, h);
          URL.revokeObjectURL(objUrl);
          resolve({ data: canvas.toDataURL('image/jpeg', 0.7), w: w, h: h });
        };
        img.onerror = function () { URL.revokeObjectURL(objUrl); resolve(null); };
        img.src = objUrl;
      });
    }).catch(function () { return null; });
  }

  /* ---------------- errors ---------------- */

  function renderError(msg) {
    app.innerHTML = '<div class="error"><h2 style="font-size:20px;margin-bottom:6px">Could not reach your data</h2>' +
      '<p class="small" style="margin:0 0 10px">' + esc(msg) + '</p>' +
      '<p class="small muted" style="margin:0">If this says something about a table or policy, the database script in ' +
      '<code>db/schema.sql</code> has not been run yet. Step 4 of README.md covers it.</p>' +
      '<a class="backlink" href="#/">Back to jobs</a></div>';
  }

  boot();

})();

</script>
</body>
</html>
