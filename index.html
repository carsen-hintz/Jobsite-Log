<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jobsite Logger</title>
<meta name="theme-color" content="#FFFFFF">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="favicon.png" type="image/png" sizes="64x64">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Jobsite Logger — refined product styling.
   Same brand blue as the icon, emails and landing page throughout — that
   consistency matters more than any single hue. Everything else sits on a
   warm neutral paper tone rather than cool office grey, with generously
   rounded surfaces, soft elevation, small blue kicker labels for context,
   and smooth hover/focus states — considered software, not a job-site sign. */

:root {
  --wall: #F7F3E9;
  --board: #FFFFFF;
  --ink: #1A1815;
  --steel: #7A7263;
  --rule: #EAE3D3;
  --chalk: #1F4FD8;
  --chalk-dark: #15317E;
  --keel: #DC2626;
  --keel-soft-bg: #FDEAE8;
  --fixed: #059669;
  --working: #D97706;
  --radius: 16px;
  --radius-sm: 10px;
  --radius-pill: 999px;
  --shadow: 0 1px 2px rgba(26, 24, 21, 0.04), 0 1px 3px rgba(26, 24, 21, 0.06);
  --shadow-md: 0 4px 10px rgba(26, 24, 21, 0.10), 0 2px 4px rgba(26, 24, 21, 0.06);
  --ease: 150ms ease;
  --tap: 52px;
  --pad: 16px;
  --shell: 680px;
}

/* A small blue category label above a heading — "CREW", "JOB" — the kind
   of context tag that tells you what you're looking at before you've even
   read the name below it. */
.kicker {
  display: block;
  color: var(--chalk);
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.09em;
  text-transform: uppercase;
  margin-bottom: 6px;
}

* { box-sizing: border-box; }

/* Soft elevation on every card-like surface, on top of whatever border
   each already defines. A hairline border plus a quiet shadow is what
   separates "boxed with CSS" from "has a real surface". */
.panel, .jobitem, .jobhead, .empty, .entry, .adminrow, .editpanel, .cal,
.logopreview, .error {
  box-shadow: var(--shadow);
}

/* The app hides panels with the hidden attribute; class rules below set
   display, so this has to win. */
[hidden] { display: none !important; }

html, body {
  margin: 0;
  background: var(--wall);
  color: var(--ink);
  font-family: "IBM Plex Sans", system-ui, -apple-system, sans-serif;
  font-size: 17px;
  line-height: 1.5;
  -webkit-text-size-adjust: 100%;
}

h1, h2, h3, .cond {
  font-family: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  font-weight: 600;
  letter-spacing: 0.01em;
  margin: 0;
}

a { color: var(--chalk-dark); }

:focus-visible {
  outline: 3px solid var(--chalk);
  outline-offset: 2px;
}

/* ---------- Top bar ---------- */

.topbar {
  position: sticky;
  top: 0;
  z-index: 20;
  background: var(--board);
  color: var(--ink);
  border-bottom: 1px solid var(--rule);
  padding-top: env(safe-area-inset-top);
}

.topbar-inner {
  max-width: var(--shell);
  margin: 0 auto;
  min-height: 60px;
  padding: 0 var(--pad);
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  gap: 10px;
}

.topbar-left { justify-self: start; min-width: 0; }
.topbar-right { justify-self: end; min-width: 0; }

.backbtn {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  min-height: 38px;
  padding: 0 14px 0 10px;
  border: 1px solid var(--rule);
  border-radius: var(--radius-pill);
  color: var(--ink);
  text-decoration: none;
  font-size: 15px;
  font-weight: 500;
  white-space: nowrap;
  transition: background-color var(--ease), border-color var(--ease);
}

.backbtn:hover { background: var(--wall); border-color: var(--steel); }

.backbtn::before {
  content: "‹";
  font-size: 21px;
  line-height: 1;
  margin-top: -2px;
}

.brand {
  display: flex;
  align-items: center;
  justify-self: center;
  text-decoration: none;
}

.brand img {
  display: block;
  height: 38px;
  width: auto;
  max-width: 190px;
  object-fit: contain;
}

#brand-text {
  font-family: "Barlow Condensed", sans-serif;
  font-weight: 700;
  font-size: 23px;
  line-height: 1.1;
  color: var(--ink);
  letter-spacing: 0.01em;
  max-width: 190px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.logopreview {
  display: flex;
  align-items: center;
  gap: 14px;
  flex-wrap: wrap;
  padding: 12px;
  background: #fff;
  border: 1px solid var(--rule);
  border-radius: var(--radius);
  margin-bottom: 12px;
}

.logopreview img { height: 44px; width: auto; max-width: 220px; object-fit: contain; display: block; }

.whoami {
  background: none;
  border: 1px solid var(--rule);
  color: var(--steel);
  border-radius: var(--radius);
  width: 44px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0;
  cursor: pointer;
}

.whoami:hover { color: var(--ink); border-color: var(--steel); }
.whoami:active { background: var(--wall); }

/* ---------- Shell ---------- */

.app {
  max-width: var(--shell);
  margin: 0 auto;
  padding: var(--pad) var(--pad) 120px;
}

.stack > * + * { margin-top: 14px; }

.muted { color: var(--steel); }
.small { font-size: 14px; }

.section-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 12px;
  margin: 22px 0 10px;
}

.section-head h2 { font-size: 22px; }

/* ---------- Panels, forms, buttons ---------- */

.panel {
  background: var(--board);
  border: 1px solid var(--rule);
  border-radius: var(--radius);
  padding: var(--pad);
}

label {
  display: block;
  font-size: 15px;
  font-weight: 500;
  margin-bottom: 5px;
}

input[type=text], input[type=email], input[type=date], input[type=time],
input[type=password], select, textarea {
  width: 100%;
  font: inherit;
  color: var(--ink);
  background: #fff;
  border: 1px solid var(--rule);
  border-radius: var(--radius);
  padding: 13px 12px;
  min-height: var(--tap);
  transition: border-color var(--ease), box-shadow var(--ease);
}

input[type=text]:hover, input[type=email]:hover, input[type=date]:hover,
input[type=time]:hover, input[type=password]:hover, select:hover, textarea:hover {
  border-color: var(--steel);
}

input[type=text]:focus, input[type=email]:focus, input[type=date]:focus,
input[type=time]:focus, input[type=password]:focus, select:focus, textarea:focus {
  border-color: var(--chalk);
  box-shadow: 0 0 0 3px rgba(31, 79, 216, 0.12);
  outline: none;
}

textarea { min-height: 120px; resize: vertical; }

.field + .field { margin-top: 13px; }

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: var(--tap);
  padding: 0 18px;
  font: inherit;
  font-weight: 600;
  border-radius: var(--radius);
  border: 1px solid transparent;
  background: var(--chalk);
  color: #fff;
  cursor: pointer;
  text-decoration: none;
  box-shadow: 0 1px 2px rgba(26, 24, 21, 0.08);
  transition: background-color var(--ease), border-color var(--ease),
              box-shadow var(--ease), transform 80ms ease;
}

.btn:hover { background: var(--chalk-dark); }
.btn:active { background: var(--chalk-dark); transform: translateY(1px); box-shadow: none; }
.btn[disabled] { opacity: 0.55; cursor: default; transform: none; }
.btn-block { width: 100%; }

.btn-quiet {
  background: var(--board);
  color: var(--ink);
  border-color: var(--rule);
  box-shadow: none;
}

.btn-quiet:hover { background: var(--wall); border-color: var(--steel); }
.btn-quiet:active { background: var(--rule); }

.btn-plain {
  background: none;
  border: none;
  color: var(--chalk-dark);
  font: inherit;
  font-weight: 500;
  padding: 10px 0;
  min-height: 44px;
  cursor: pointer;
  text-align: left;
  border-radius: var(--radius-sm);
  transition: color var(--ease);
}

.btn-plain:hover { color: var(--chalk); }

.btn-danger { background: none; border: none; color: var(--keel); font: inherit; font-size: 14px; cursor: pointer; padding: 8px 0; min-height: 40px; }

.row { display: flex; gap: 10px; flex-wrap: wrap; }
.row > .grow { flex: 1 1 180px; }

/* ---------- Tag chooser + chips ---------- */

.tagpick { display: flex; gap: 8px; }

.tagpick input { position: absolute; opacity: 0; pointer-events: none; }

.tagpick label {
  flex: 1;
  margin: 0;
  text-align: center;
  border: 1px solid var(--steel);
  border-radius: var(--radius);
  padding: 13px 4px;
  min-height: var(--tap);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  background: #fff;
  font-weight: 500;
}

.tagpick input:checked + label { background: var(--ink); color: #fff; border-color: var(--ink); }
.tagpick input#tag-issue:checked + label { background: var(--keel); border-color: var(--keel); }
.tagpick input:focus-visible + label { outline: 3px solid var(--chalk); outline-offset: 2px; }

.chip {
  display: inline-block;
  font-size: 13px;
  font-weight: 600;
  padding: 3px 8px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--rule);
  color: var(--steel);
  background: #fff;
}

.chip-issue { color: #fff; background: var(--keel); border-color: var(--keel); }
.chip-done { color: var(--steel); background: var(--wall); }

/* ---------- Job list ---------- */

.joblist { list-style: none; margin: 0; padding: 0; }
.joblist li + li { margin-top: 10px; }

.jobitem {
  display: flex;
  align-items: stretch;
  background: var(--board);
  border: 1px solid var(--rule);
  border-left: 4px solid var(--chalk);
  border-radius: var(--radius);
  transition: box-shadow var(--ease);
}

.jobitem:hover { box-shadow: var(--shadow-md); }

.jobitem.is-completed { border-left-color: var(--steel); }

.jobact {
  flex: 0 0 auto;
  width: 46px;
  align-self: stretch;
  border: none;
  background: none;
  color: #ADA495;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
}

.jobact[disabled] { opacity: 0.4; cursor: default; }

.jobtxt:hover { color: var(--chalk); }
.jobtxt:active { color: #fff; background: var(--chalk); }

.jobdel {
  border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
}

.jobdel:hover { color: var(--keel); }
.jobdel:active { color: #fff; background: var(--keel); }

.jobrow {
  display: block;
  flex: 1 1 auto;
  min-width: 0;
  padding: 14px var(--pad);
  text-decoration: none;
  color: var(--ink);
}

.jobrow-top { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.jobrow-name { font-family: "Barlow Condensed", sans-serif; font-weight: 600; font-size: 24px; line-height: 1.15; }
.jobrow-meta { font-size: 15px; color: var(--steel); margin-top: 2px; }
.jobrow-when { font-size: 13px; color: var(--steel); white-space: nowrap; padding-left: 4px; }

/* ---------- Entry feed: the one bold move ----------
   Each entry is a wide band with a colored edge and an oversized date in the
   gutter, so a phone scan reads as date -> tag -> note. */

.feed { list-style: none; margin: 0; padding: 0; }
.feed > li + li { margin-top: 12px; }

.entry {
  display: grid;
  grid-template-columns: 62px 1fr;
  background: var(--board);
  border: 1px solid var(--rule);
  border-left: 5px solid var(--steel);
  border-radius: var(--radius);
}

.entry.t-issue { border-left-color: var(--keel); }

.entry-date {
  padding: 13px 0 13px 12px;
  font-family: "Barlow Condensed", sans-serif;
  line-height: 0.92;
  color: var(--ink);
}

.entry-day { display: block; font-size: 38px; font-weight: 700; }
.entry-mon { display: block; font-size: 15px; font-weight: 500; color: var(--steel); letter-spacing: 0.04em; }

.entry-body { padding: 13px var(--pad) 15px 12px; min-width: 0; }
.entry-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 6px; }
.entry-who { font-weight: 600; font-size: 15px; }
.entry-time { font-size: 13px; color: var(--steel); }
.entry-note { white-space: pre-wrap; overflow-wrap: anywhere; margin: 0; }

.gallery {
  margin-top: 11px;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(92px, 1fr));
  gap: 6px;
}

.gallery button {
  padding: 0;
  border: 1px solid var(--rule);
  border-radius: var(--radius-sm);
  background: var(--wall);
  aspect-ratio: 1;
  overflow: hidden;
  cursor: pointer;
  transition: box-shadow var(--ease);
}

.gallery button:hover { box-shadow: 0 0 0 2px var(--chalk); }

.gallery img,
.gallery video { width: 100%; height: 100%; object-fit: cover; display: block; }

.media-thumb { position: relative; display: block; width: 100%; height: 100%; }
.play-badge {
  position: absolute;
  left: 4px;
  bottom: 4px;
  padding: 1px 6px;
  border-radius: 4px;
  background: rgba(26, 24, 21, 0.72);
  color: #fff;
  font-size: 11px;
  font-weight: 700;
  line-height: 1.4;
  pointer-events: none;
}

/* ---------- Job header ---------- */

.jobhead {
  background: var(--board);
  border: 1px solid var(--rule);
  border-radius: var(--radius);
  padding: var(--pad);
}

.jobhead h1 { font-size: 30px; line-height: 1.1; }
.jobhead .jobhead-meta { margin-top: 6px; color: var(--steel); font-size: 15px; }
.jobhead .row { margin-top: 14px; }

.backlink {
  display: inline-block;
  padding: 8px 0;
  font-size: 15px;
  font-weight: 500;
  color: var(--chalk-dark);
  text-decoration: none;
  min-height: 40px;
}

/* ---------- Sticky compose bar ---------- */

.dock {
  position: fixed;
  left: 0; right: 0; bottom: 0;
  z-index: 15;
  background: var(--wall);
  border-top: 1px solid var(--rule);
  padding: 10px var(--pad) calc(10px + env(safe-area-inset-bottom));
}

.dock-inner { max-width: var(--shell); margin: 0 auto; }

/* ---------- Photo staging ---------- */

.filedrop {
  border: 1px dashed var(--steel);
  border-radius: var(--radius);
  padding: 15px;
  text-align: center;
  background: #fff;
}

.filedrop input { position: absolute; width: 1px; height: 1px; opacity: 0; }

.filedrop-label {
  display: inline-flex;
  align-items: center;
  min-height: 44px;
  font-weight: 600;
  color: var(--chalk-dark);
  cursor: pointer;
  margin: 0;
}

.thumbs { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
.thumbs img,
.thumbs video { width: 64px; height: 64px; object-fit: cover; border: 1px solid var(--rule); border-radius: var(--radius-sm); background: #111; }

/* ---------- Empty + loading states ---------- */

.empty {
  background: var(--board);
  border: 1px solid var(--rule);
  border-radius: var(--radius);
  padding: 26px var(--pad);
  text-align: center;
}

.empty h2 { font-size: 22px; margin-bottom: 6px; }
.empty p { margin: 0 auto; max-width: 42ch; color: var(--steel); }

.error {
  border-left: 5px solid var(--keel);
  background: #fff;
  border-radius: var(--radius);
  border-top: 1px solid var(--rule);
  border-right: 1px solid var(--rule);
  border-bottom: 1px solid var(--rule);
  padding: 14px var(--pad);
}

/* ---------- Toast ---------- */

.toast {
  position: fixed;
  left: 50%;
  bottom: calc(84px + env(safe-area-inset-bottom));
  transform: translateX(-50%);
  z-index: 40;
  background: var(--ink);
  color: #fff;
  padding: 12px 16px;
  border-radius: var(--radius);
  font-size: 15px;
  max-width: calc(100% - 32px);
  box-shadow: var(--shadow-md);
}

/* ---------- Lightbox ---------- */

.lightbox {
  position: fixed;
  inset: 0;
  z-index: 50;
  background: rgba(26, 24, 21, 0.94);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
}

.lightbox img,
.lightbox video { max-width: 100%; max-height: 88vh; }

.lightbox-close {
  position: absolute;
  top: calc(12px + env(safe-area-inset-top));
  right: 12px;
  min-height: 44px;
  padding: 0 16px;
  font: inherit;
  font-weight: 600;
  color: var(--ink);
  background: #fff;
  border: none;
  border-radius: var(--radius);
  cursor: pointer;
}

/* ---------- In-app camera ---------- */

.camera {
  position: fixed;
  inset: 0;
  z-index: 60;
  background: #000;
  display: flex;
  flex-direction: column;
}

.camera-stage { position: relative; flex: 1; min-height: 0; }
.camera-view { display: block; width: 100%; height: 100%; object-fit: cover; background: #000; }

.camera-strip {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 10px;
  display: flex;
  gap: 6px;
  overflow-x: auto;
  padding: 0 12px;
}

.camera-strip img,
.camera-strip video {
  flex: 0 0 auto;
  width: 56px;
  height: 56px;
  object-fit: cover;
  border: 2px solid #fff;
  border-radius: var(--radius-sm);
  background: #111;
}

.camera-modes {
  position: absolute;
  top: calc(12px + env(safe-area-inset-top));
  left: 12px;
  display: flex;
  padding: 3px;
  background: rgba(0, 0, 0, 0.45);
  border-radius: 999px;
}

.camera-modes button {
  min-height: 36px;
  padding: 0 14px;
  font: inherit;
  font-weight: 600;
  color: #fff;
  background: none;
  border: none;
  border-radius: 999px;
  cursor: pointer;
}

.camera-modes button.is-on { background: #fff; color: #111; }

.camera-timer {
  position: absolute;
  top: calc(16px + env(safe-area-inset-top));
  left: 50%;
  transform: translateX(-50%);
  padding: 4px 10px;
  border-radius: 999px;
  background: #c0392b;
  color: #fff;
  font-weight: 700;
  letter-spacing: 0.04em;
}

.camera-shutter.is-rec {
  background: #c0392b;
  border-color: #fff;
}

.camera-done {
  position: absolute;
  top: calc(12px + env(safe-area-inset-top));
  right: 12px;
  min-height: 44px;
  padding: 0 16px;
  font: inherit;
  font-weight: 600;
  color: var(--ink);
  background: #fff;
  border: none;
  border-radius: var(--radius);
  cursor: pointer;
}

.camera-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 14px 16px calc(14px + env(safe-area-inset-bottom));
  background: #000;
}

/* A shutter you can hit with a glove on, and that keeps the preview open so the
   next shot is one tap away. */
.camera-shutter {
  width: 68px;
  height: 68px;
  flex: 0 0 auto;
  border: 4px solid #fff;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.28);
  cursor: pointer;
}

.camera-shutter:active { background: #fff; }
.camera-shutter[disabled] { opacity: 0.5; }

.camera-text {
  min-height: 44px;
  padding: 0 14px;
  font: inherit;
  font-weight: 600;
  color: #fff;
  background: none;
  border: none;
  cursor: pointer;
}

.filedrop-actions {
  display: flex;
  gap: 10px;
  align-items: center;
  justify-content: center;
  flex-wrap: wrap;
}

/* ---------- Sign-in / setup ---------- */

.gate {
  max-width: 420px;
  margin: 8vh auto 0;
  border-top: 4px solid var(--chalk);
}

/* A quieter, tinted way to offer a destructive action than a bare red
   text link — used where removing something is routine, not alarming
   (swapping out a logo), as opposed to the plain-text .btn-mini-danger
   used inline in dense lists like the daily feed. */
.btn-soft-danger {
  background: var(--keel-soft-bg);
  border: 1px solid transparent;
  color: var(--keel);
  border-radius: var(--radius-pill);
  font: inherit;
  font-size: 14px;
  font-weight: 600;
  padding: 0 16px;
  min-height: 38px;
  cursor: pointer;
  transition: background-color var(--ease);
}

.btn-soft-danger:hover { background: #FBDAD7; }

.langpick { margin-bottom: 16px; }
.langseg {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}
.langseg button {
  min-height: 44px;
  border: 1px solid var(--rule);
  border-radius: var(--radius-sm);
  background: var(--wall);
  color: var(--ink);
  font: inherit;
  font-weight: 600;
  cursor: pointer;
}
.langseg button.is-on {
  background: var(--chalk);
  border-color: var(--chalk);
  color: #fff;
}

.gate h1 { font-size: 32px; margin-bottom: 4px; }
.gate p { color: var(--steel); margin: 0 0 18px; }

.setup ol { padding-left: 22px; }
.setup li { margin-bottom: 8px; }
.setup code { background: var(--wall); padding: 1px 5px; border-radius: var(--radius-sm); font-size: 15px; overflow-wrap: anywhere; }

/* ---------- Entry author actions + edit form ---------- */

.entry-actions {
  display: flex;
  gap: 8px;
  margin-top: 10px;
}

.btn-mini {
  background: none;
  border: 1px solid var(--rule);
  border-radius: var(--radius-sm);
  color: var(--ink);
  font: inherit;
  font-size: 14px;
  font-weight: 500;
  padding: 0 12px;
  min-height: 38px;
  cursor: pointer;
  transition: background-color var(--ease), border-color var(--ease);
}

.btn-mini:hover { background: var(--wall); border-color: var(--steel); }
.btn-mini-danger { color: var(--keel); }
.btn-mini-danger:hover { background: #FEF2F2; border-color: var(--keel); }
.btn-mini:active { background: var(--rule); }

.editpanel { border-left: 5px solid var(--chalk); }

.editpanel-head {
  font-family: "Barlow Condensed", sans-serif;
  font-size: 22px;
  font-weight: 600;
  margin-bottom: 12px;
}

.photochip {
  position: relative;
  padding: 0;
  border: 1px solid var(--rule);
  border-radius: var(--radius-sm);
  background: var(--wall);
  width: 64px;
  height: 64px;
  overflow: hidden;
  cursor: pointer;
}

.photochip img,
.photochip video { width: 100%; height: 100%; object-fit: cover; display: block; }

.photochip.marked { border-color: var(--keel); border-width: 2px; }
.photochip.marked img,
.photochip.marked video { opacity: 0.32; }

.photochip-x {
  position: absolute;
  inset: auto 0 0 0;
  background: var(--keel);
  color: #fff;
  font-size: 10px;
  font-weight: 600;
  padding: 2px 0;
  text-align: center;
}

@media (min-width: 620px) {
  .entry { grid-template-columns: 76px 1fr; }
  .entry-day { font-size: 44px; }
}

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
}

/* ---------- Company join + team screens ---------- */

.joinsplit {
  display: flex;
  align-items: center;
  gap: 12px;
  margin: 18px 0;
  color: var(--steel);
  font-size: 14px;
}

.joinsplit::before,
.joinsplit::after {
  content: "";
  flex: 1;
  height: 1px;
  background: var(--rule);
}

.codelist { list-style: none; margin: 0; padding: 0; }

.codelist li {
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
  padding: 9px 0;
  border-bottom: 1px solid var(--rule);
}

.codelist li:last-child { border-bottom: none; }

.joincode {
  font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  font-size: 20px;
  font-weight: 600;
  letter-spacing: 0.08em;
  background: var(--wall);
  border: 1px solid var(--rule);
  border-radius: var(--radius-sm);
  padding: 4px 10px;
}

.codelist .grow { flex: 1 1 auto; }

/* ---------- Admin console ---------- */

.adminrow {
  background: var(--board);
  border: 1px solid var(--rule);
  border-left: 4px solid var(--chalk);
  border-radius: var(--radius);
  margin-bottom: 10px;
  padding: 0;
}

.adminrow.is-off { border-left-color: var(--keel); }

.adminrow > summary {
  cursor: pointer;
  list-style: none;
  padding: 13px var(--pad);
  display: grid;
  gap: 3px;
}

.adminrow > summary::-webkit-details-marker { display: none; }
.adminrow > summary { transition: background-color var(--ease); }
.adminrow > summary:hover { background: var(--wall); }

.adminrow-name {
  font-family: "Barlow Condensed", sans-serif;
  font-weight: 600;
  font-size: 23px;
  line-height: 1.15;
}

.adminrow-tags { display: flex; gap: 6px; flex-wrap: wrap; }
.adminrow-meta { font-size: 14px; color: var(--steel); }

.adminrow-body {
  padding: 4px var(--pad) var(--pad);
  border-top: 1px solid var(--rule);
}

.adminrow-body .field { margin-top: 13px; }

/* ---------- Admin: people list ---------- */

.peoplelist { list-style: none; margin: 0; padding: 0; }

.peoplerow {
  padding: 14px 0;
  border-bottom: 1px solid var(--rule);
}

.peoplerow:last-child { border-bottom: none; }
.peoplerow.is-new { border-left: 3px solid var(--keel); padding-left: 11px; }

.peoplerow-top { display: flex; align-items: baseline; gap: 9px; flex-wrap: wrap; }

.peoplerow-name {
  font-family: "Barlow Condensed", sans-serif;
  font-weight: 600;
  font-size: 21px;
}

.peoplerow-tags { display: flex; gap: 5px; flex-wrap: wrap; }
.peoplerow-meta { font-size: 14px; color: var(--steel); margin-top: 2px; }

/* ---------- Offline / queued entries banner ---------- */

.offbar {
  background: #FFF4E5;
  border-bottom: 1px solid #E0C89A;
  color: #4A3A1B;
  font-size: 15px;
}

.offbar-in {
  max-width: var(--shell);
  margin: 0 auto;
  padding: 11px var(--pad);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}

.offbar-in .btn-mini { border-color: #C9A96B; white-space: nowrap; }

/* ---------- Tappable address ---------- */

.maplink {
  color: var(--chalk-dark);
  text-decoration: underline;
  text-underline-offset: 2px;
}

/* ---------- Settings switch row ---------- */

.switchrow {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  margin: 0;
  cursor: pointer;
  font-weight: 400;
}

.switchrow input {
  flex: 0 0 auto;
  width: 24px;
  height: 24px;
  margin: 1px 0 0;
  accent-color: var(--chalk);
}

/* ---------- Header dropdown menu ---------- */

.menu-wrap { position: relative; }

.menu {
  position: absolute;
  top: calc(100% + 6px);
  right: 0;
  z-index: 30;
  min-width: 184px;
  background: var(--board);
  border: 1px solid var(--rule);
  border-radius: var(--radius);
  box-shadow: var(--shadow-md);
  overflow: hidden;
}

.menu-item {
  display: block;
  width: 100%;
  text-align: left;
  background: none;
  border: none;
  border-bottom: 1px solid var(--rule);
  font: inherit;
  font-size: 16px;
  font-weight: 500;
  color: var(--ink);
  padding: 0 16px;
  min-height: 50px;
  cursor: pointer;
}

.menu-item:last-child { border-bottom: none; }
.menu-item:hover { background: var(--wall); }
.menu-item:active { background: var(--rule); }
.menu-item-danger { color: var(--keel); }

/* ---------- Issue states ---------- */

.entry.t-fixed { border-left-color: var(--fixed); }
.chip-fixed   { color: #fff; background: var(--fixed); border-color: var(--fixed); }
.chip-working { color: #fff; background: var(--working); border-color: var(--working); }

.fixbox {
  margin-top: 11px;
  padding: 11px 13px;
  background: var(--wall);
  border-left: 3px solid var(--fixed);
  border-radius: var(--radius);
  font-size: 15px;
}

.tagpick-3 label { font-size: 15px; padding: 13px 2px; }

/* ---------- Issue update history ---------- */

.history {
  margin-top: 12px;
  border-top: 1px solid var(--rule);
  padding-top: 4px;
}

.history-head {
  font-family: "Barlow Condensed", sans-serif;
  font-weight: 600;
  font-size: 15px;
  letter-spacing: 0.04em;
  color: var(--steel);
  padding: 7px 0 3px;
}

.history-item {
  border-left: 3px solid var(--rule);
  padding: 7px 0 7px 11px;
  margin-bottom: 3px;
}

.history-item.h-open     { border-left-color: var(--keel); }
.history-item.h-working  { border-left-color: var(--working); }
.history-item.h-resolved { border-left-color: var(--fixed); }

.history-meta { font-size: 13px; color: var(--steel); }
.history-note { margin: 3px 0 0; font-size: 15px; white-space: pre-wrap; overflow-wrap: anywhere; }

/* ---------- View switcher ---------- */

.viewswitch {
  display: flex;
  background: var(--wall);
  border: 1px solid var(--rule);
  border-radius: var(--radius);
  padding: 3px;
  margin-bottom: 14px;
}

.viewswitch-btn {
  flex: 1;
  border: none;
  background: none;
  font: inherit;
  font-weight: 600;
  font-size: 15px;
  color: var(--steel);
  padding: 9px 0;
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: background-color var(--ease), color var(--ease), box-shadow var(--ease);
}

.viewswitch-btn.is-on {
  background: #fff;
  color: var(--ink);
  box-shadow: 0 1px 3px rgba(26, 24, 21, 0.14);
}

/* ---------- Calendar shell ---------- */

.cal {
  background: var(--board);
  border: 1px solid var(--rule);
  border-radius: var(--radius);
  padding: 16px;
}

.cal-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 12px;
}

.cal-title {
  font-family: "Barlow Condensed", sans-serif;
  font-weight: 600;
  font-size: 21px;
  text-align: center;
  flex: 1;
}

.cal-nav {
  flex: 0 0 auto;
  width: 40px;
  height: 40px;
  border: 1px solid var(--rule);
  border-radius: var(--radius);
  background: #fff;
  font-size: 21px;
  line-height: 1;
  cursor: pointer;
  color: var(--ink);
}

.cal-nav:active { background: var(--wall); }

/* ---------- Month grid ---------- */

.cal-dow {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  text-align: center;
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.03em;
  color: var(--steel);
  padding: 0 0 6px;
}

.cal-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 3px;
}

.cal-cell {
  aspect-ratio: 1;
  min-height: 42px;
  border: 1px solid transparent;
  border-radius: var(--radius-sm);
  background: var(--wall);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
  cursor: pointer;
  padding: 0;
  font: inherit;
  transition: background-color var(--ease);
}

.cal-cell:not(.cal-sel):not(.cal-out):hover { background: var(--rule); }

.cal-daynum { font-size: 14px; color: var(--ink); }
.cal-out { background: none; }
.cal-out .cal-daynum { color: #D6CFBE; }

.cal-today:not(.cal-sel) { background: #E9EEFB; }
.cal-today .cal-daynum { font-weight: 700; color: var(--chalk-dark); }

.cal-sel { background: var(--ink) !important; }
.cal-sel .cal-daynum { color: #fff; font-weight: 600; }

.cal-dots { display: flex; gap: 3px; }
.cal-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--chalk); }
.cal-sel .cal-dot { background: #fff; }

/* ---------- Week view ---------- */

.cal-week {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.cal-weekrow {
  display: flex;
  align-items: flex-start;
  gap: 14px;
  width: 100%;
  border: 1px solid var(--rule);
  border-radius: var(--radius);
  background: #fff;
  padding: 12px;
  text-align: left;
  cursor: pointer;
  font: inherit;
  min-height: 58px;
  transition: background-color var(--ease), border-color var(--ease), box-shadow var(--ease);
}

.cal-weekrow:hover { box-shadow: var(--shadow); }

.cal-weekrow.cal-today { border-color: var(--chalk); border-width: 2px; }

/* Its own class, deliberately not .cal-sel — the month grid uses that name
   with !important for its dark-fill selected day, and class names collide
   across unrelated components if they are not kept distinct. Selection here
   reads as a left accent bar, not an inverted block, so it never competes
   visually with the "today" outline on the same row. */
.cal-weekrow.cal-rowsel {
  background: var(--wall);
  box-shadow: inset 4px 0 0 var(--ink);
}

.cal-weekleft {
  flex: 0 0 52px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
}

.cal-weekdow {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.02em;
  color: var(--steel);
  white-space: nowrap;
}

.cal-today .cal-weekdow { color: var(--chalk-dark); }

.cal-weeknum {
  font-family: "Barlow Condensed", sans-serif;
  font-weight: 700;
  font-size: 24px;
  color: var(--ink);
  line-height: 1;
}

.cal-weekitems {
  flex: 1 1 auto;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 5px;
  padding-top: 2px;
}

.cal-weekbar {
  display: flex;
  flex-direction: column;
  gap: 2px;
  background: var(--wall);
  border-radius: var(--radius-sm);
  padding: 7px 9px;
  font-size: 14px;
  color: var(--ink);
}

.cal-weekbar-top { white-space: normal; word-break: break-word; line-height: 1.35; }
.cal-weekbar-note {
  font-size: 13px;
  color: var(--steel);
  white-space: pre-wrap;
  word-break: break-word;
  line-height: 1.35;
}

.cal-weekwho {
  color: var(--steel);
  font-weight: 500;
  font-size: 12px;
  letter-spacing: 0.01em;
}
.cal-weekmore { font-size: 12px; color: var(--steel); padding-left: 2px; }
.cal-weeknone { font-size: 14px; color: #ADA495; padding: 6px 2px; }

@media (min-width: 500px) {
  .cal-cell { min-height: 54px; }
  .cal-daynum { font-size: 15px; }
}

/* ---------- Scheduled time ---------- */

.sc-time {
  font-family: "Barlow Condensed", sans-serif;
  font-weight: 600;
  color: var(--chalk-dark);
}

.cal-sel .sc-time,
.cal-weekrow.cal-rowsel .sc-time { color: inherit; }

</style>
</head>

      var n = document.getElementById(id);
      if (n) n.value = keep[id];
    });
  }

  function applyChromeLang() {
    document.documentElement.lang = lang === 'es' ? 'es' : 'en';
    document.title = t('Jobsite Logger');
    if (backBtn) backBtn.textContent = t('Back');
    if (whoamiBtn) {
      whoamiBtn.setAttribute('aria-label', t('Settings and account'));
      whoamiBtn.setAttribute('title', t('Settings'));
    }
    var close = document.getElementById('lightbox-close');
    if (close) {
      close.textContent = t('Close');
      close.setAttribute('aria-label', t('Close photo'));
    }
    if (lightboxImg) lightboxImg.alt = t('Jobsite photo, full size');

    var camDone = document.getElementById('cam-done');
    if (camDone) camDone.textContent = t('Done');
    var camCancelBtn = document.getElementById('cam-cancel');
    if (camCancelBtn) camCancelBtn.textContent = t('Cancel');
    var camFlipBtn = document.getElementById('cam-flip');
    if (camFlipBtn) {
      camFlipBtn.textContent = t('Flip');
      camFlipBtn.setAttribute('aria-label', t('Switch camera'));
    }
    var camShootBtn = document.getElementById('cam-shoot');
    if (camShootBtn) camShootBtn.setAttribute('aria-label', t('Take photo'));
    var camModePhoto = document.getElementById('cam-mode-photo');
    if (camModePhoto) camModePhoto.textContent = t('Photo');
    var camModeVideo = document.getElementById('cam-mode-video');
    if (camModeVideo) camModeVideo.textContent = t('Video');
  }

  function langPickerHtml(id) {
    return '<div class="field langpick"><span class="kicker">' + t('Language') + '</span>' +
      '<div class="langseg" role="group" aria-label="' + t('Language') + '">' +
        '<button type="button" class="' + (lang === 'en' ? 'is-on' : '') + '" id="' + id + '-en">' + t('English') + '</button>' +
        '<button type="button" class="' + (lang === 'es' ? 'is-on' : '') + '" id="' + id + '-es">' + t('Spanish') + '</button>' +
      '</div></div>';
  }

  function bindLangPicker(id) {
    on(id + '-en', 'click', function () { setLang('en'); });
    on(id + '-es', 'click', function () { setLang('es'); });
  }

  function roleLabel(role) {
    if (role === 'owner') return t('owner');
    if (role === 'crew') return t('crew');
    return role || '';

  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.hidden = true; }, 3200);
  }

  function todayISO() {
    var d = new Date();
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  }

  function pad(n) { return (n < 10 ? '0' : '') + n; }

  function isVideoFile(file) {
    var type = (file && file.type) || '';
    if (type.indexOf('video/') === 0) return true;
    return isVideoPath((file && (file.name || file.storage_path)) || '');
  }

  function isVideoPath(path) {
    return /\.(mp4|webm|mov|m4v|3gp)$/i.test(path || '');
  }

  function mediaExt(file) {
    if (!isVideoFile(file)) return 'jpg';
    var type = (file && file.type) || '';
    if (/mp4|quicktime/i.test(type)) return 'mp4';
    if (/webm/i.test(type)) return 'webm';
    var name = (file && (file.name || file.storage_path)) || '';
    var m = name.match(/\.([a-z0-9]+)$/i);
    return m ? m[1].toLowerCase() : 'webm';
  }

  function mediaContentType(file) {
    if (isVideoFile(file)) {
      // A recorder reports "video/mp4;codecs=avc1…". Storage matches its
      // allowed types on the bare type, so send that. An iPhone hands back
      // video/quicktime, which is H.264 in a near-identical container and
      // plays everywhere as mp4 — call it that so it matches the .mp4 name we
      // store it under and clears the usual bucket allow-list.
      var type = ((file && file.type) || '').split(';')[0].trim();
      if (/quicktime/i.test(type)) return 'video/mp4';
      return type || (mediaExt(file) === 'mp4' ? 'video/mp4' : 'video/webm');
    }
    return 'image/jpeg';
  }

  function mediaCounts(list) {
    var v = 0, p = 0, i;
    for (i = 0; i < (list || []).length; i++) {
      if (isVideoFile(list[i]) || isVideoPath(list[i] && list[i].storage_path)) v++;
      else p++;
    }
    return { v: v, p: p, n: (list || []).length };
  }

  function readyLabel(list) {
    var c = mediaCounts(list);
    if (!c.n) return '';
    if (c.v && c.p) return tf('{0} photos and videos ready', c.n);
    if (c.v) return c.v === 1 ? tf('{0} video ready', c.v) : tf('{0} videos ready', c.v);
    return c.p === 1 ? tf('{0} photo ready', c.p) : tf('{0} photos ready', c.p);
  }

  function takenLabel(list) {
    var c = mediaCounts(list);
    if (!c.n) return t('No photos taken.');
    if (c.v && c.p) return tf('{0} photos and videos taken', c.n);
    if (c.v) return c.v === 1 ? tf('{0} video taken', c.v) : tf('{0} videos taken', c.v);
    return c.p === 1 ? tf('{0} photo taken', c.p) : tf('{0} photos taken', c.p);
  }

  function thumbTag(url, video, alt) {
    return '<span class="media-thumb">' +
      (video
        ? '<video src="' + esc(url) + '" muted playsinline preload="metadata"></video><span class="play-badge">▶</span>'
        : '<img loading="lazy" src="' + esc(url) + '" alt="' + alt + '">') +
      '</span>';
  }

  function prepareMedia(file) {
    if (isVideoFile(file)) {
      if (file.size > MAX_VIDEO_BYTES) {
        return Promise.reject(new Error(t('That video is too large to upload.')));
      }
      return Promise.resolve(file);
    }
    return shrink(file);
  }

  var MONTHS_EN = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

  function dateParts(ymd) {
    var p = String(ymd || '').split('-');
    var mon = t(MONTHS_EN[Number(p[1]) - 1] || '');
    return { day: String(Number(p[2]) || ''), mon: mon, year: p[0] || '' };
  }

  function longDate(ymd) {
    var d = dateParts(ymd);
    return d.mon + ' ' + d.day + ', ' + d.year;
  }

  function clockTime(iso) {
    var d = new Date(iso);
    if (isNaN(d)) return '';
    var h = d.getHours(), m = pad(d.getMinutes());
    var ap = h >= 12 ? t('pm') : t('am');
    h = h % 12; if (h === 0) h = 12;
    return h + ':' + m + ' ' + ap;
  }

  function relTime(iso) {
    var then = new Date(iso).getTime();
    if (isNaN(then)) return '';
    var mins = Math.round((Date.now() - then) / 60000);
    if (mins < 1) return t('just now');
    if (mins < 60) return tf('{0} min ago', mins);
    var hrs = Math.round(mins / 60);
    if (hrs < 24) return hrs === 1 ? tf('{0} hour ago', hrs) : tf('{0} hours ago', hrs);
    var days = Math.round(hrs / 24);
    if (days < 7) return days === 1 ? tf('{0} day ago', days) : tf('{0} days ago', days);
    var wks = Math.round(days / 7);
    if (wks < 5) return wks === 1 ? tf('{0} week ago', wks) : tf('{0} weeks ago', wks);
    return longDate(iso.slice(0, 10));
  }

  function companyName() {
    return (org && org.company_name) || window.CONFIG.COMPANY_NAME || '';
  }

  // The bucket is private, so each photo gets a temporary signed link.
  // Links are attached to the photo rows once, when a job is loaded.
  var SIGNED_FOR = 60 * 60 * 4;   // 4 hours

  function signPhotos(entries) {
    var photos = [];
    (entries || []).forEach(function (en) {
      (en.entry_photos || []).forEach(function (p) { photos.push(p); });
    });
    if (!photos.length) return Promise.resolve(entries);

    var paths = photos.map(function (p) { return p.storage_path; });

    return sb.storage.from(BUCKET).createSignedUrls(paths, SIGNED_FOR)
      .then(function (res) {
        var byPath = {};
        (res.data || []).forEach(function (r) {
          if (r && r.path && r.signedUrl) byPath[r.path] = r.signedUrl;
        });
        photos.forEach(function (p) { p.url = byPath[p.storage_path] || ''; });
        return entries;
      })
      .catch(function () { return entries; });
  }

  // Opens in whichever maps app the phone prefers.
  function mapsUrl(address) {
    return 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(address);
  }

  function tagChip(en) {
    if (en.tag !== 'issue') return '';
    var st = en.issue_status || 'open';
    if (st === 'resolved') return '<span class="chip chip-fixed">' + t('Issue · fixed') + '</span>';
    if (st === 'working') return '<span class="chip chip-working">' + t('Issue · being fixed') + '</span>';
    return '<span class="chip chip-issue">' + t('Issue · open') + '</span>';
  }

  function on(id, evt, fn) {
    var node = document.getElementById(id);
    if (node) node.addEventListener(evt, fn);
  }

  /* ---------------- offline queue ---------------- */

  // Entries posted with no signal are kept on the phone, photos and all,
  // and sent as soon as there is a connection. Photos are Blobs, which is
  // why this uses IndexedDB rather than localStorage.

  var QDB = 'jobsite-logger-offline';
  var QSTORE = 'queue';
  var flushing = false;

  function qOpen() {
    return new Promise(function (resolve, reject) {
      if (!window.indexedDB) return reject(new Error('This browser cannot store offline entries.'));
      var req = indexedDB.open(QDB, 1);
      req.onupgradeneeded = function () {
        var db = req.result;
        if (!db.objectStoreNames.contains(QSTORE)) {
          db.createObjectStore(QSTORE, { keyPath: 'id', autoIncrement: true });
        }
      };
      req.onsuccess = function () { resolve(req.result); };
      req.onerror = function () { reject(req.error); };
    });
  }

  function qRun(mode, fn) {
    return qOpen().then(function (db) {
      return new Promise(function (resolve, reject) {
        var tx = db.transaction(QSTORE, mode);
        var store = tx.objectStore(QSTORE);
        var out = fn(store);
        tx.oncomplete = function () { resolve(out && out.result !== undefined ? out.result : out); };
        tx.onerror = function () { reject(tx.error); };
      });
    });
  }

  function qAdd(item) { return qRun('readwrite', function (st) { return st.add(item); }); }
  function qAll()     { return qRun('readonly',  function (st) { return st.getAll(); }); }
  function qDrop(id)  { return qRun('readwrite', function (st) { return st.delete(id); }); }

  function qCount() {
    return qAll().then(function (rows) { return (rows || []).length; }, function () { return 0; });
  }

  // Sends anything waiting. Stops at the first failure so nothing is lost
  // and nothing gets posted twice.
  function flushQueue(quiet) {
    if (flushing || !navigator.onLine || !me || !org) return Promise.resolve(0);
    flushing = true;

    return qAll().then(function (rows) {
      rows = rows || [];
      if (!rows.length) { flushing = false; return 0; }

      if (!quiet) toast('Sending ' + rows.length + (rows.length === 1 ? ' saved entry…' : ' saved entries…'));

      var done = 0;

      return rows.reduce(function (chain, row) {
        return chain.then(function (stop) {
          if (stop) return true;

          return sb.from('entries').insert({
            job_id: row.job_id,
            author_name: row.author_name,
            author_email: row.author_email,
            notes: row.notes,
            tag: row.tag,
            entry_date: row.entry_date
          }).select().single().then(function (res) {
            if (res.error) throw res.error;
            var entry = res.data;

            return uploadPhotos(entry, row.photos || [], null)
              .then(function () { return notifyEntry(entry.id); })
              .then(function () { return qDrop(row.id); })
              .then(function () { done++; return false; });
          }).catch(function () {
            return true;   // leave this one and everything after it queued
          });
        });
      }, Promise.resolve(false)).then(function () {
        flushing = false;
        if (done && !quiet) toast(done === 1 ? tf('{0} entry posted', done) : tf('{0} entries posted', done));
        return done;
      });
    }).catch(function () { flushing = false; return 0; });
  }

  function paintQueueBanner() {
    var bar = document.getElementById('offbar');
    if (!bar) return;

    qCount().then(function (n) {
      var off = !navigator.onLine;
      if (!n && !off) { bar.hidden = true; bar.innerHTML = ''; return; }

      bar.hidden = false;
      bar.innerHTML =
        '<div class="offbar-in">' +
          '<span>' +
            (off ? t('No connection. ') : '') +
            (n
              ? (n === 1 ? tf('{0} entry saved on this phone', n) : tf('{0} entries saved on this phone', n)) +
                (off ? t(' — they post when you have signal.') : '')
              : t('Entries you post now are saved here and sent when you are back online.')) +
          '</span>' +
          (n && !off ? '<button id="offbar-send" class="btn-mini">' + t('Send now') + '</button>' : '') +
        '</div>';

      var btn = document.getElementById('offbar-send');
      if (btn) btn.addEventListener('click', function () {
        flushQueue().then(function () { paintQueueBanner(); route(); });
      });
    });
  }

  /* ---------------- boot ---------------- */

  function configured() {
    var c = window.CONFIG || {};
    return c.SUPABASE_URL && c.SUPABASE_URL.indexOf('supabase.co') > -1 &&
           c.SUPABASE_ANON_KEY && c.SUPABASE_ANON_KEY.length > 30;
  }

  function fatal(where, err) {
    var msg = (err && (err.message || err.toString())) || String(err);
    if (app) {
      app.innerHTML =
        '<div class="error" style="margin-top:18px">' +
          '<h2 style="font-size:20px;margin-bottom:8px">' + t('The app could not start') + '</h2>' +
          '<p class="small" style="margin:0 0 10px"><strong>' + esc(where) + ':</strong> ' + esc(msg) + '</p>' +
          '<p class="small muted" style="margin:0">' + t('Send this message on and it can be fixed. A refresh sometimes clears it if the connection dropped mid-load.') + '</p>' +
        '</div>';
    }
    if (window.console && console.error) console.error('[jobsite-logger] ' + where, err);
  }

  window.addEventListener('error', function (e) {
    if (app && !app.innerHTML) fatal(t('Script error'), e.message || e.error);
  });

  function boot() {
    try {
      bootInner();
    } catch (err) {
      fatal(t('Startup'), err);
    }
  }

  function bootInner() {
    if (!configured()) return renderSetupNeeded();

    if (!window.supabase || typeof window.supabase.createClient !== 'function') {
      return fatal(t('Loading'), t('The Supabase library did not load. Check the connection, or whether something on this network blocks cdn.jsdelivr.net.'));
    }

    if (!window.jspdf) {
      // Not fatal — only the PDF export needs it.
      if (window.console) console.warn('[jobsite-logger] jsPDF did not load; PDF export will not work.');
    }

    // Invite and reset links arrive as #access_token=...&type=invite. Read that
    // before creating the client, because the client consumes and clears it.
    pendingAuth = readAuthHash();

    sb = window.supabase.createClient(window.CONFIG.SUPABASE_URL, window.CONFIG.SUPABASE_ANON_KEY, {
      auth: { detectSessionInUrl: true, flowType: 'implicit', persistSession: true }
    });

    whoamiBtn.addEventListener('click', function (e) {
      e.stopPropagation();
      menuEl.hidden ? openMenu() : closeMenu();
    });

    document.addEventListener('click', function (e) {
      if (!menuEl.hidden && !menuEl.contains(e.target) && e.target !== whoamiBtn) closeMenu();
    });

    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && !menuEl.hidden) { closeMenu(); whoamiBtn.focus(); }
    });

    document.getElementById('lightbox-close').addEventListener('click', closeLightbox);
    lightbox.addEventListener('click', function (e) { if (e.target === lightbox) closeLightbox(); });
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeLightbox(); });

    on('cam-shoot', 'click', shutterClick);
    on('cam-flip', 'click', flipCamera);
    on('cam-done', 'click', finishCamera);
    on('cam-cancel', 'click', cancelCamera);
    on('cam-mode-photo', 'click', function () { setCamMode('photo'); });
    on('cam-mode-video', 'click', function () { setCamMode('video'); });
    on('cam-native', 'change', function (e) {
      var files = e.target.files;
      tookNativeVideo(files);
      e.target.value = '';
    });
    // Backing out of the system camera fires no change event, so the preview
    // has to come back on its own.
    window.addEventListener('focus', function () {
      if (!camNativeOpen) return;
      setTimeout(function () {
        if (!camNativeOpen) return;
        camNativeOpen = false;
        resumeCamStream();
      }, 600);
    });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && camEl && !camEl.hidden) cancelCamera();
    });
    window.addEventListener('pagehide', function () {
      stopRec(false);
      stopCamStream();
    });

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(function () {
        // Offline opening is a bonus, not a requirement.
      });
    }

    window.addEventListener('online', function () {
      paintQueueBanner();
      flushQueue().then(function (n) { if (n) route(); });
    });
    window.addEventListener('offline', paintQueueBanner);

    applyChromeLang();
    startSession();
  }

  // Identity comes from the login token, not from anything typed in.
  // Pulls type and any error out of the fragment an email link lands on.
  function readAuthHash() {
    var h = (location.hash || '').replace(/^#\/?/, '');
    if (h.indexOf('access_token=') === -1 && h.indexOf('error') === -1) return null;

    var out = {};
    h.split('&').forEach(function (pair) {
      var bits = pair.split('=');
      if (bits.length === 2) out[bits[0]] = decodeURIComponent(bits[1].replace(/\+/g, ' '));
    });

    return {
      type: out.type || '',
      error: out.error_description || out.error || ''
    };
  }

  function meFromSession(session) {
    if (!session || !session.user) return null;
    var u = session.user;
    var meta = u.user_metadata || {};
    return {
      email: u.email,
      name: meta.full_name || meta.name || (u.email || '').split('@')[0]
    };
  }

  function startSession() {
    sb.auth.onAuthStateChange(function (event, session) {
      var next = meFromSession(session);
      var was = me && me.email;
      me = next;
      if (!next && was) { org = null; toast(t('Signed out')); route(); }
    });

    sb.auth.getSession().then(function (res) {
      me = meFromSession(res.data && res.data.session);
      window.addEventListener('hashchange', route);
      if (!me) return route();
      return loadOrg().then(function () {
        route();
        flushQueue(true).then(function (n) {
          paintQueueBanner();
          if (n) route();
        });
      });
    }).catch(function (err) {
      fatal(t('Signing in'), err);
    });
  }

  // The header shows the company's own logo, its name if there is no logo,
  // and the product name before anyone signs in.
  function paintBrand() {
    if (org && org.logo_url) {
      brandLogo.src = org.logo_url;
      brandLogo.alt = org.company_name || '';
      brandLogo.hidden = false;
      brandText.hidden = true;
      return;
    }
    brandLogo.hidden = true;
    brandLogo.removeAttribute('src');
    brandText.hidden = false;
    brandText.textContent = (org && org.company_name) || t('Jobsite Logger');
  }

  function loadOrg() {
    return Promise.all([
      sb.rpc('my_membership'),
      sb.rpc('is_platform_admin').then(function (r) { return r; }, function () { return {}; })
    ]).then(function (both) {
      var res = both[0];
      isAdmin = both[1] && both[1].data === true;
      var row = (res.data || [])[0];
      org = row ? {
        company_id: row.company_id,
        company_name: row.company_name,
        role: row.role,
        active: row.active,
        seat_limit: row.seat_limit,
        seats_used: row.seats_used,
        access_until: row.access_until || null,
        email_alerts: !!row.email_alerts,
        logo_path: row.logo_path || null,
        logo_url: row.logo_path
          ? sb.storage.from(LOGO_BUCKET).getPublicUrl(row.logo_path).data.publicUrl
          : null
      } : null;
    }).catch(function () { org = null; isAdmin = false; });
  }

  function route() {
    staged = [];
    clearEditState();
    applyChromeLang();
    whoamiBtn.hidden = !me;

    var hash = location.hash || '#/';
    var m = hash.match(/^#\/job\/([0-9a-fA-F-]{6,})/);
    var isCrew = hash.indexOf('#/crew') === 0 || hash.indexOf('#/team') === 0;
    var isProfile = hash.indexOf('#/profile') === 0;
    var isSched = hash.indexOf('#/schedule') === 0;
    var isAdminPage = hash.indexOf('#/admin') === 0;
    var isTeam = isCrew || isProfile || isSched;

    closeMenu();

    paintBrand();
    paintQueueBanner();

    // Back only appears where there is somewhere to go back to.
    backBtn.hidden = !me || (!m && !isTeam && !isAdminPage);

    if (pendingAuth && pendingAuth.error) {
      var msg = pendingAuth.error;
      pendingAuth = null;
      return renderLinkProblem(msg);
    }

    // An invite or reset link signs them in, then they must set a password.
    if (me && pendingAuth && (pendingAuth.type === 'invite' || pendingAuth.type === 'recovery')) {
      return renderSetPassword();
    }

    if (!me) return renderAuth();
    if (isAdminPage && isAdmin) return renderAdmin();
    // The vendor has no company of their own, so the console is home.
    if (isAdmin && !org) return renderAdmin();
    if (!org) return renderJoin();
    if (!org.active) return renderSuspended();
    if (isProfile) return renderProfile();
    if (isSched) return renderSchedule();
    if (isCrew) return renderCrew();
    if (m) return renderJob(m[1]);
    renderDashboard();
  }

  /* ---------------- header menu ---------------- */

  function openMenu() {
    var items = [];

    if (org) {
      items.push({ label: t('My profile'), hash: '#/profile' });
      items.push({ label: t('Schedule'), hash: '#/schedule' });
      items.push({ label: t('Crew'), hash: '#/crew' });
    }
    if (isAdmin) items.push({ label: t('Admin console'), hash: '#/admin' });
    items.push({ label: t('Sign out'), action: 'out', danger: true });

    menuEl.innerHTML = items.map(function (it, i) {
      return '<button type="button" role="menuitem" class="menu-item' +
        (it.danger ? ' menu-item-danger' : '') + '" data-i="' + i + '">' +
        esc(it.label) + '</button>';
    }).join('');

    Array.prototype.forEach.call(menuEl.querySelectorAll('.menu-item'), function (b) {
      b.addEventListener('click', function () {
        var it = items[Number(b.dataset.i)];
        closeMenu();
        if (it.action === 'out') return signOut();
        location.hash = it.hash;
        route();
      });
    });

    menuEl.hidden = false;
    whoamiBtn.setAttribute('aria-expanded', 'true');
    var first = menuEl.querySelector('.menu-item');
    if (first) first.focus();
  }

  function closeMenu() {
    menuEl.hidden = true;
    menuEl.innerHTML = '';
    whoamiBtn.setAttribute('aria-expanded', 'false');
  }

  /* ---------------- sign in ---------------- */

  function renderAuth() {
    app.innerHTML =
      '<div class="gate panel">' +
        langPickerHtml('auth-lang') +
        '<span class="kicker">' + t('Crew log') + '</span>' +
        '<h1>' + t('Sign in') + '</h1>' +
        '<p>' + t('Use the email and password you were given.') + '</p>' +
        '<div class="field"><label for="in-email">' + t('Email') + '</label>' +
          '<input id="in-email" type="email" autocomplete="username" inputmode="email" ' +
            'autocapitalize="off" spellcheck="false" placeholder="dave@example.com"></div>' +
        '<div class="field"><label for="in-pass">' + t('Password') + '</label>' +
          '<input id="in-pass" type="password" autocomplete="current-password" placeholder="••••••••"></div>' +
        '<div class="field"><button id="do-auth" class="btn btn-block">' + t('Sign in') + '</button></div>' +
        '<button id="do-forgot" class="btn-plain">' + t('Forgot your password?') + '</button>' +
        '<p class="small muted" style="margin:0">' + t('Accounts are set up for you — there is no sign-up here. Need a login? Ask whoever set up your crew.') + '</p>' +
      '</div>';

    bindLangPicker('auth-lang');
    on('do-forgot', 'click', doForgot);
    on('do-auth', 'click', doSignIn);
    on('in-pass', 'keydown', function (e) { if (e.key === 'Enter') doSignIn(); });
    document.getElementById('in-email').focus();
  }

  function doSignIn() {
    var email = document.getElementById('in-email').value.trim().toLowerCase();
    var pass = document.getElementById('in-pass').value;

    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return toast(t('Enter your email address.'));
    if (!pass) return toast(t('Enter your password.'));

    var btn = document.getElementById('do-auth');
    btn.disabled = true;
    btn.textContent = t('Signing in…');

    sb.auth.signInWithPassword({ email: email, password: pass }).then(function (res) {
      if (res.error) {
        btn.disabled = false;
        btn.textContent = t('Sign in');
        var m = res.error.message || '';
        if (/invalid login/i.test(m)) return toast(t('That email and password do not match.'));
        if (/not confirmed/i.test(m)) return toast(t('This account is not confirmed yet — ask the office.'));
        return toast(m);
      }
      me = meFromSession(res.data.session);
      loadOrg().then(function () { location.hash = '#/'; route(); });
    });
  }

  function doForgot() {
    var email = document.getElementById('in-email').value.trim().toLowerCase();
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
      document.getElementById('in-email').focus();
      return toast(t('Type your email address above first, then tap this.'));
    }

    var btn = document.getElementById('do-forgot');
    btn.disabled = true;
    btn.textContent = t('Sending…');

    sb.auth.resetPasswordForEmail(email, {
      redirectTo: location.origin + location.pathname
    }).then(function (res) {
      btn.disabled = false;
      btn.textContent = t('Forgot your password?');
      if (res.error) return toast(res.error.message);
      toast(t('If that address has an account, a reset link is on its way. Check your junk folder too.'));
    });
  }

  /* ---------------- setting a password from an invite or reset ---------------- */

  function renderSetPassword() {
    var invited = pendingAuth && pendingAuth.type === 'invite';
    var needName = !me.name || me.name === (me.email || '').split('@')[0];

    app.innerHTML =
      '<div class="gate panel">' +
        langPickerHtml('sp-lang') +
        '<h1>' + (invited ? t('Set your password') : t('Choose a new password')) + '</h1>' +
        '<p>' + (invited
          ? t('Welcome. Pick a password and you are in.')
          : t('Pick a new password for your account.')) + '</p>' +
        '<p class="small muted">' + esc(me.email) + '</p>' +

        (needName
          ? '<div class="field"><label for="sp-name">' + t('Your name') + '</label>' +
              '<input id="sp-name" type="text" autocomplete="name" placeholder="Dave Kruger">' +
              '<p class="small muted" style="margin:6px 0 0">' + t('This shows on everything you post.') + '</p></div>'
          : '') +

        '<div class="field"><label for="sp-pass">' + t('Password') + '</label>' +
          '<input id="sp-pass" type="password" autocomplete="new-password" placeholder="••••••••"></div>' +
        '<p class="small muted" style="margin:-4px 0 12px">' + t('At least 8 characters.') + '</p>' +
        '<div class="field"><label for="sp-pass2">' + t('Confirm password') + '</label>' +
          '<input id="sp-pass2" type="password" autocomplete="new-password" placeholder="••••••••"></div>' +

        '<div class="field"><button id="sp-save" class="btn btn-block">' + t('Save and continue') + '</button></div>' +
        '<button id="sp-out" class="btn-plain">' + t('Sign out instead') + '</button>' +
      '</div>';

    bindLangPicker('sp-lang');
    on('sp-save', 'click', saveNewPassword);
    on('sp-out', 'click', signOut);
    on('sp-pass2', 'keydown', function (e) {
      if (e.key === 'Enter') document.getElementById('sp-save').click();
    });
    document.getElementById(needName ? 'sp-name' : 'sp-pass').focus();
  }

  function saveNewPassword() {
    var nameBox = document.getElementById('sp-name');
    var name = nameBox ? nameBox.value.trim() : '';
    var pass = document.getElementById('sp-pass').value;
    var pass2 = document.getElementById('sp-pass2').value;

    if (nameBox && name.length < 2) return toast(t('Enter your name.'));
    if (pass.length < 8) return toast(t('Use a password of at least 8 characters.'));
    if (pass !== pass2) {
      document.getElementById('sp-pass2').focus();
      return toast(t('The two passwords do not match.'));
    }

    var btn = document.getElementById('sp-save');
    btn.disabled = true;
    btn.textContent = t('Saving…');

    var payload = { password: pass };
    if (nameBox) payload.data = { full_name: name };

    sb.auth.updateUser(payload).then(function (res) {
      if (res.error) {
        btn.disabled = false;
        btn.textContent = t('Save and continue');
        var m = res.error.message || '';
        if (/same.*password/i.test(m)) return toast(t('That is already your password — pick a different one.'));
        return toast(m);
      }

      pendingAuth = null;
      if (nameBox) me.name = name;
      toast(t('Password saved'));

      loadOrg().then(function () {
        location.hash = '#/';
        route();
      });
    });
  }

  function renderLinkProblem(msg) {
    app.innerHTML =
      '<div class="gate panel">' +
        '<h1>' + t('That link did not work') + '</h1>' +
        '<p>' + esc(msg) + '</p>' +
        '<p class="small muted">' + t('Invite and reset links expire after an hour and only work once. Ask for a fresh one.') + '</p>' +
        '<div class="field"><button id="lp-back" class="btn btn-block">' + t('Back to sign in') + '</button></div>' +
      '</div>';

    on('lp-back', 'click', function () { location.hash = '#/'; route(); });
  }

    app.innerHTML =
      '<div class="gate panel">' +
        '<h1>' + t('Almost there') + '</h1>' +
        '<p>' + t('Your login works, but it is not attached to a crew yet. Whoever set up your account needs to add you — that usually takes a minute.') + '</p>' +
        '<p class="small muted">' + tf('Signed in as {0}', esc(me.email)) + '</p>' +
        '<div class="field"><button id="do-recheck" class="btn btn-block">' + t('Check again') + '</button></div>' +

      '</div>';

    on('do-recheck', 'click', function () {

  function renderSuspended() {
    var expired = org.access_until && new Date(org.access_until) <= new Date();

    app.innerHTML =
      '<div class="gate panel">' +
        '<h1>' + (expired ? t('Access has ended') : t('Account paused')) + '</h1>' +
        '<p>' + (expired
          ? tf("{0}'s access ended on {1}.", esc(org.company_name), esc(longDate(org.access_until.slice(0, 10))))
          : tf('{0} is paused.', esc(org.company_name))) +
        t(' Every job, note and photo is exactly where you left it and nothing has been deleted. Get in touch to switch it back on.') + '</p>' +
        '<button id="do-signout" class="btn-plain">' + t('Sign out') + '</button>' +
      '</div>';
    on('do-signout', 'click', signOut);

  function signOut() {
    sb.auth.signOut().then(function () {
      me = null; org = null; isAdmin = false;
      location.hash = '#/';
      route();
    });
  }

  // Postgres errors arrive prefixed and technical; the message we raised is the useful part.
  function cleanRpcError(err) {
    var m = (err && err.message) || t('Something went wrong.');
    return m.replace(/^.*?:\s*/, '').replace(/\s*CONTEXT:[\s\S]*$/, '');
  }

  /* ---------------- admin console (vendor only) ---------------- */

  var adminNew = false;   // is the "add a contractor" panel open

  function renderAdmin() {
    app.innerHTML = '<p class="muted">' + t('Loading customers…') + '</p>';

    Promise.all([
      sb.rpc('admin_list_companies'),
      sb.rpc('admin_list_users'),
      sb.rpc('admin_company_options'),
      sb.rpc('admin_list_admins')
    ]).then(function (r) {
      if (r[0].error) {
        return renderError(tf('Admin data could not be loaded. {0}', r[0].error.message));
      }

      var list = r[0].data || [];
      var users = (r[1] && r[1].data) || [];
      var options = (r[2] && r[2].data) || [];
      var admins = (r[3] && r[3].data) || [];
      var unassigned = users.filter(function (u) { return !u.company_id; });
      var now = new Date();

      var live = list.filter(adminHasAccess).length;
      var paying = list.filter(function (c) { return c.plan === 'paid'; }).length;
      var seats = list.reduce(function (n, c) { return n + (c.member_count || 0); }, 0);
      var jobs = list.reduce(function (n, c) { return n + (c.job_count || 0); }, 0);

      // Anything worth chasing this week.
      var soon = list.filter(function (c) {
        if (!c.access_until) return false;
        var d = new Date(c.access_until);
        return d > now && (d - now) / 86400000 <= 7;
      });
      var ended = list.filter(function (c) {
        return c.access_until && new Date(c.access_until) <= now;
      });

      app.innerHTML =
        '<div class="jobhead">' +
          '<h1>Customer accounts</h1>' +
          '<div class="jobhead-meta">' + list.length + (list.length === 1 ? ' contractor' : ' contractors') +
            ' · ' + live + ' with access · ' + paying + ' paying · ' +
            seats + ' people · ' + jobs + ' jobs</div>' +
          '<div class="row">' +
            '<button id="adm-new" class="btn">Add a contractor</button>' +
            '<button id="adm-refresh" class="btn btn-quiet">Refresh</button>' +
          '</div>' +
        '</div>' +

        ((soon.length || ended.length)
          ? '<div class="panel" style="margin-top:14px;border-left:5px solid var(--keel)">' +
              '<strong>Needs attention</strong>' +
              (ended.length ? '<p class="small" style="margin:6px 0 0">' + ended.length +
                ' with access ended: ' + ended.map(function (c) { return esc(c.name); }).join(', ') + '</p>' : '') +
              (soon.length ? '<p class="small" style="margin:6px 0 0">' + soon.length +
                ' ending within 7 days: ' + soon.map(function (c) {
                  return esc(c.name) + ' (' + esc(longDate(c.access_until.slice(0, 10))) + ')';
                }).join(', ') + '</p>' : '') +
            '</div>'
          : '') +

        (adminNew
          ? '<div class="panel" style="margin-top:14px">' +
              '<h2 style="font-size:22px;margin-bottom:12px">Add a contractor</h2>' +
              '<div class="field"><label for="nc-name">Company name</label>' +
                '<input id="nc-name" type="text" placeholder="Drywall Business LLC"></div>' +
              '<div class="row" style="margin-top:13px">' +
                '<div class="grow"><label for="nc-seats">Seats</label>' +
                  '<input id="nc-seats" type="text" inputmode="numeric" value="5"></div>' +
                '<div class="grow"><label for="nc-days">Access for (days)</label>' +
                  '<input id="nc-days" type="text" inputmode="numeric" value="14"></div>' +
              '</div>' +
              '<div class="row" style="margin-top:14px">' +
                '<button id="nc-save" class="btn grow">Create and get owner code</button>' +
                '<button id="nc-cancel" class="btn btn-quiet">Cancel</button>' +
              '</div>' +
            '</div>'
          : '') +

        '<div class="section-head"><h2>Contractors</h2>' +
          '<span class="small muted">Newest first</span></div>' +

        (list.length
          ? list.map(adminRowHtml).join('')
          : '<div class="empty"><h2>No contractors yet</h2>' +
            '<p>Use “Add a contractor” to set one up and get a code to send them.</p></div>') +

        '<div class="section-head"><h2>People</h2>' +
          '<span class="small muted">' + users.length + ' accounts · ' +
            unassigned.length + ' unassigned</span></div>' +

        '<div class="panel">' +
          '<p class="small muted" style="margin:0 0 12px">Create the login in Supabase under ' +
            'Authentication → Users → Add user (tick Auto Confirm), then assign it to a crew here.</p>' +
          (users.length
            ? '<ul class="peoplelist">' + users.map(function (u) {
                return peopleRowHtml(u, options);
              }).join('') + '</ul>'
            : '<p class="small muted" style="margin:0">No accounts yet.</p>') +
        '</div>' +

        '<div class="section-head"><h2>Admins</h2>' +
          '<span class="small muted">' + admins.length +
            (admins.length === 1 ? ' person' : ' people') + ' can reach this console</span></div>' +

        (admins.length <= 1
          ? '<div class="panel" style="border-left:5px solid var(--keel)">' +
              '<p style="margin:0 0 6px"><strong>Only one admin.</strong></p>' +

                'into this console. Add a second admin below.</p>' +
            '</div>'
          : '') +

        '<div class="panel" style="margin-top:10px">' +
          '<ul class="peoplelist">' + admins.map(function (a) {
            var isMe = a.email.toLowerCase() === (me && me.email || '').toLowerCase();
            return '<li class="peoplerow">' +
              '<div class="peoplerow-top">' +
                '<span class="peoplerow-name">' + esc(a.email) + (isMe ? ' (you)' : '') + '</span>' +

              (admins.length > 1
                ? '<div class="row" style="margin-top:9px">' +
                    '<button class="btn-mini btn-mini-danger js-admin-remove" data-id="' + esc(a.user_id) +
                      '" data-email="' + esc(a.email) + '">Remove admin access</button>' +
                  '</div>'
                : '') +
            '</li>';
          }).join('') + '</ul>' +

          '<div class="field" style="margin-top:14px"><label for="adm-email">Add an admin</label>' +
            '<input id="adm-email" type="email" inputmode="email" autocapitalize="off" ' +

          '<p class="small muted" style="margin:6px 0 12px">The account has to already exist in ' +
            'Supabase under Authentication \u2192 Users. This does not create one.</p>' +
          '<button id="adm-add" class="btn btn-quiet">Add admin</button>' +
        '</div>';

      wireAdmin();
    });
  }

  function adminHasAccess(c) {
    return c.active && (!c.access_until || new Date(c.access_until) > new Date());
  }

  function adminRowHtml(c) {
    var access = c.access_until ? c.access_until.slice(0, 10) : '';
    var ok = adminHasAccess(c);
    var expired = c.access_until && new Date(c.access_until) <= new Date();
    var full = c.seat_limit != null && c.member_count >= c.seat_limit;

    return '<details class="adminrow' + (ok ? '' : ' is-off') + '">' +
      '<summary>' +
        '<span class="adminrow-name">' + esc(c.name) + '</span>' +
        '<span class="adminrow-tags">' +
          '<span class="chip">' + esc(c.plan) + '</span>' +
          (expired ? '<span class="chip chip-issue">Access ended</span>'
                   : (!c.active ? '<span class="chip chip-issue">Paused</span>' : '')) +
          (full ? '<span class="chip chip-issue">Seats full</span>' : '') +
        '</span>' +
        '<span class="adminrow-meta">' +
          c.member_count + ' of ' + (c.seat_limit == null ? '∞' : c.seat_limit) + ' seats · ' +
          c.job_count + ' jobs · ' +
          (c.access_until ? 'until ' + esc(longDate(access)) : 'no expiry') + ' · ' +
          (c.last_activity ? esc(relTime(c.last_activity)) : 'never posted') +
        '</span>' +
      '</summary>' +

      '<div class="adminrow-body">' +
        '<p class="small muted" style="margin:0 0 12px">Owner: ' +
          (c.owner_email
            ? '<a href="mailto:' + esc(c.owner_email) + '">' + esc(c.owner_email) + '</a>'
            : 'has not signed up yet') +
          ' · started ' + esc(longDate(c.created_at.slice(0, 10))) +
          ' · ' + c.entry_count + ' entries</p>' +

        '<div class="field"><label for="cnm-' + esc(c.id) + '">Company name</label>' +
          '<input id="cnm-' + esc(c.id) + '" type="text" value="' + esc(c.name) + '"></div>' +

        '<div class="row">' +
          '<div class="grow"><label for="as-' + esc(c.id) + '">Seats</label>' +
            '<input id="as-' + esc(c.id) + '" type="text" inputmode="numeric" value="' +
              (c.seat_limit == null ? '' : c.seat_limit) + '"></div>' +
          '<div class="grow"><label for="ap-' + esc(c.id) + '">Plan</label>' +
            '<select id="ap-' + esc(c.id) + '">' +
              ['trial', 'paid', 'internal', 'cancelled'].map(function (p) {
                return '<option value="' + p + '"' + (c.plan === p ? ' selected' : '') + '>' + p + '</option>';
              }).join('') +
            '</select></div>' +

  function uploadLogo(file) {
    if (file.type && file.type.indexOf('image/') !== 0) {
      return toast(t('That is not an image file — try a PNG or JPG.'));
    }
    if (file.size > 6 * 1024 * 1024) return toast(t('That image is very large — try one under 6 MB.'));

    toast(t('Uploading logo…'));
    var old = org.logo_path;

    shrinkLogo(file).then(function (out) {
      var path = org.company_id + '/logo-' + Date.now() + '.' + out.ext;
      return sb.storage.from(LOGO_BUCKET)
        .upload(path, out.blob, { contentType: out.type, upsert: false })
        .then(function (up) {
          if (up.error) throw up.error;
          return sb.rpc('set_company_logo', { p_path: path });
        })
        .then(function (res) {
          if (res.error) throw res.error;
          if (old && old !== path) sb.storage.from(LOGO_BUCKET).remove([old]);
          return loadOrg();
        });
    }).then(function () {
      paintBrand();
      toast(t('Logo updated'));
      renderCrew();
    }).catch(function (err) {
      toast(tf('Could not upload the logo: {0}', err.message || err));
    });
  }

  // Scaled to twice the header height so it stays sharp on phones.
  // PNG is kept as PNG so transparent backgrounds survive.
  function shrinkLogo(file) {
    return new Promise(function (resolve, reject) {
      var url = URL.createObjectURL(file);
      var img = new Image();
      img.onload = function () {
        var maxH = 96, maxW = 480;
        var scale = Math.min(1, maxH / img.height, maxW / img.width);
        var w = Math.max(1, Math.round(img.width * scale));
        var h = Math.max(1, Math.round(img.height * scale));

        var canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        URL.revokeObjectURL(url);

        var keepPng = /png|webp/i.test(file.type);
        var type = keepPng ? 'image/png' : 'image/jpeg';
        canvas.toBlob(function (blob) {
          if (!blob) return reject(new Error(t('That image could not be processed.')));
          resolve({ blob: blob, type: type, ext: keepPng ? 'png' : 'jpg' });
        }, type, keepPng ? undefined : 0.9);
      };
      img.onerror = function () {
        URL.revokeObjectURL(url);
        reject(new Error(t('That file did not look like an image.')));
      };
      img.src = url;
    });
  }

  function sendCrewInvite() {
    var box = document.getElementById('inv-email');
    var email = box.value.trim().toLowerCase();

    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
      box.focus();
      return toast(t('Enter their email address.'));
    }

    var btn = document.getElementById('inv-send');
    btn.disabled = true;
    btn.textContent = t('Sending…');

    sb.functions.invoke('invite-crew', {
      body: { email: email, role: 'crew', redirectTo: location.origin + location.pathname }
    }).then(function (res) {
      btn.disabled = false;
      btn.textContent = t('Send invite');

      var data = res.data || {};

      // A non-200 reply arrives wrapped, with the useful message in the body.
      if (res.error) {
        var ctx = res.error.context;
        if (ctx && typeof ctx.json === 'function') {
          return ctx.json().then(function (b) {
            toast((b && b.error) || res.error.message);
          }, function () {
            toast(res.error.message);
          });
        }
        return toast(res.error.message);
      }

      if (data.error) return toast(data.error);
      if (!data.ok) return toast(t('That invite could not be sent.'));

      box.value = '';
      toast(data.emailed
        ? tf('Invite sent to {0}', email)
        : t('They already had an account — added to your crew.'));
      loadOrg().then(renderCrew);
    }).catch(function (err) {
      btn.disabled = false;
      btn.textContent = t('Send invite');
      toast(tf('That invite could not be sent: {0}', err.message || err));
    });
  }
