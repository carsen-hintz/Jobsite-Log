  /* ---------------- schedule ---------------- */

  var schedNew = false;
  var schedView = null;      // { year, month } — month is 0-11
  var schedSelected = null;  // the day the list below the calendar shows
  var schedMode = 'month';   // 'day' | 'week' | 'month'

  function formatTime(t) {
    if (!t) return '';
    var bits = t.split(':');
    var h = parseInt(bits[0], 10), m = bits[1];
    var ap = h >= 12 ? 'pm' : 'am';
    h = h % 12; if (h === 0) h = 12;
    return h + ':' + m + ' ' + ap;
  }

  function ymd(y, m, d) {
    return y + '-' + pad(m + 1) + '-' + pad(d);
  }

  function parseYmd(s) { return new Date(s + 'T12:00:00'); }

  function todayParts() {
    var d = new Date();
    return { y: d.getFullYear(), m: d.getMonth(), d: d.getDate() };
  }

  function daysInMonth(y, m) { return new Date(y, m + 1, 0).getDate(); }

  function weekday(ymdStr) {
    var names = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
    return names[parseYmd(ymdStr).getDay()];
  }

  function weekdayShort(ymdStr) {
    return ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][parseYmd(ymdStr).getDay()];
  }

  function monthLabel(y, m) {
    return ['January','February','March','April','May','June','July','August',
            'September','October','November','December'][m] + ' ' + y;
  }

  function addDaysYmd(dstr, n) {
    var d = parseYmd(dstr);
    d.setDate(d.getDate() + n);
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  }

  // Sunday of the week containing this date.
  function weekStart(dstr) {
    var d = parseYmd(dstr);
    return addDaysYmd(dstr, -d.getDay());
  }

  // Sunday-first 6-row grid, padded with the tail of the previous month and
  // the head of the next so every week is a full row.
  function monthGrid(y, m) {
    var first = new Date(y, m, 1).getDay();
    var len = daysInMonth(y, m);
    var prevLen = daysInMonth(y, m - 1 < 0 ? 11 : m - 1);
    var prevY = m === 0 ? y - 1 : y, prevM = m === 0 ? 11 : m - 1;
    var nextY = m === 11 ? y + 1 : y, nextM = m === 11 ? 0 : m + 1;

    var cells = [];
    for (var i = 0; i < first; i++) {
      var pd = prevLen - first + i + 1;
      cells.push({ date: ymd(prevY, prevM, pd), day: pd, out: true });
    }
    for (var d = 1; d <= len; d++) cells.push({ date: ymd(y, m, d), day: d, out: false });
    var nd = 1;
    while (cells.length % 7 !== 0 || cells.length < 42) {
      cells.push({ date: ymd(nextY, nextM, nd), day: nd, out: true });
      nd++;
    }
    return cells;
  }

  function weekCells(dstr) {
    var start = weekStart(dstr);
    var out = [];
    for (var i = 0; i < 7; i++) out.push({ date: addDaysYmd(start, i), out: false });
    return out;
  }

  // The visible range to fetch, for whichever mode is active — always at
  // least the full month grid so switching modes never needs a re-fetch.
  function visibleRange() {
    var cells = monthGrid(schedView.year, schedView.month);
    return { from: cells[0].date, to: cells[cells.length - 1].date, cells: cells };
  }

  function renderSchedule() {
    app.innerHTML = '<p class="muted">Loading the schedule…</p>';

    var t = todayParts();
    if (!schedView) schedView = { year: t.y, month: t.m };
    if (!schedSelected) schedSelected = ymd(t.y, t.m, t.d);

    var range = visibleRange();

    Promise.all([
      sb.from('schedule').select('*').gte('work_date', range.from).lte('work_date', range.to)
        .order('work_date').order('created_at'),
      sb.from('jobs').select('id,name,status').order('name'),
      sb.from('memberships').select('email,full_name').order('created_at')
    ]).then(function (r) {
      if (r[0].error) return renderError(r[0].error.message);

      var rows = r[0].data || [];
      var jobs = r[1].data || [];
      var crew = r[2].data || [];
      var owner = org.role === 'owner';

      var byJob = {};
      jobs.forEach(function (j) { byJob[j.id] = j; });

      var byDate = {};
      rows.forEach(function (it) { (byDate[it.work_date] = byDate[it.work_date] || []).push(it); });
      Object.keys(byDate).forEach(function (d) {
        byDate[d].sort(function (a, b) {
          if (!a.work_time && !b.work_time) return 0;
          if (!a.work_time) return 1;
          if (!b.work_time) return -1;
          return a.work_time < b.work_time ? -1 : 1;
        });
      });

      var todayStr = ymd(t.y, t.m, t.d);
      var thisMonthCount = rows.filter(function (it) {
        return it.work_date.slice(0, 7) === schedView.year + '-' + pad(schedView.month + 1);
      }).length;

      app.innerHTML =
        '<div class="jobhead">' +
          '<h1>Schedule</h1>' +
          '<div class="jobhead-meta">' + thisMonthCount +
            (thisMonthCount === 1 ? ' thing planned this month' : ' things planned this month') + '</div>' +
        '</div>' +

        '<div class="viewswitch">' +
          ['day', 'week', 'month'].map(function (m) {
            return '<button type="button" class="viewswitch-btn' + (schedMode === m ? ' is-on' : '') +
              '" data-mode="' + m + '">' + m.charAt(0).toUpperCase() + m.slice(1) + '</button>';
          }).join('') +
        '</div>' +

        '<div class="cal">' +
          calHeaderHtml() +
          (schedMode === 'month' ? calMonthHtml(range.cells, byDate, todayStr) : '') +
          (schedMode === 'week' ? calWeekHtml(byDate, todayStr, byJob) : '') +
          (schedMode === 'day' ? '' : '') +
        '</div>' +

        (schedMode === 'day'
          ? dayListHtml(schedSelected, byDate[schedSelected] || [], byJob, todayStr, true)
          : schedMode === 'month'
            ? dayListHtml(schedSelected, byDate[schedSelected] || [], byJob, todayStr, false)
            : '') +

        (owner
          ? (schedNew
              ? addFormHtml(jobs, crew)
              : '<div class="dock"><div class="dock-inner">' +
                  '<button id="sc-new" class="btn btn-block">Add to the schedule</button>' +
                '</div></div>')
          : '');

      wireSchedule(rows, jobs, crew, byJob, byDate, todayStr);
    }).catch(function (err) { fatal('Loading the schedule', err); });
  }

  function calHeaderHtml() {
    var title;
    if (schedMode === 'day') title = weekday(schedSelected) + ', ' + longDate(schedSelected);
    else if (schedMode === 'week') {
      var start = weekStart(schedSelected), end = addDaysYmd(start, 6);
      title = longDate(start) + ' – ' + longDate(end);
    } else {
      title = monthLabel(schedView.year, schedView.month);
    }

    return '<div class="cal-head">' +
      '<button id="cal-prev" class="cal-nav" aria-label="Previous">&lsaquo;</button>' +
      '<span class="cal-title">' + esc(title) + '</span>' +
      '<button id="cal-next" class="cal-nav" aria-label="Next">&rsaquo;</button>' +
    '</div>';
  }

  function calMonthHtml(cells, byDate, todayStr) {
    return '<div class="cal-dow">' +
        ['S','M','T','W','T','F','S'].map(function (d) { return '<span>' + d + '</span>'; }).join('') +
      '</div>' +
      '<div class="cal-grid">' +
        cells.map(function (c) {
          var items = byDate[c.date] || [];
          var cls = 'cal-cell' +
            (c.out ? ' cal-out' : '') +
            (c.date === todayStr ? ' cal-today' : '') +
            (c.date === schedSelected ? ' cal-sel' : '');
          return '<button type="button" class="' + cls + '" data-date="' + c.date + '">' +
            '<span class="cal-daynum">' + c.day + '</span>' +
            (items.length
              ? '<span class="cal-dots">' +
                  items.slice(0, 3).map(function () { return '<span class="cal-dot"></span>'; }).join('') +
                '</span>'
              : '') +
          '</button>';
        }).join('') +
      '</div>' +
      '<div class="row" style="margin-top:10px">' +
        '<button id="cal-today-btn" class="btn-plain">Today</button>' +
      '</div>';
  }

  // Seven day-rows. Full item text wraps rather than truncating, empty
  // days say so explicitly, and only ever one row reads as selected.
  function calWeekHtml(byDate, todayStr, byJob) {
    var cells = weekCells(schedSelected);
    return '<div class="cal-week">' +
      cells.map(function (c) {
        var items = byDate[c.date] || [];
        var isToday = c.date === todayStr;
        var isSel = c.date === schedSelected;
        var cls = 'cal-weekrow' + (isToday ? ' cal-today' : '') + (isSel ? ' cal-rowsel' : '');

        return '<button type="button" class="' + cls + '" data-date="' + c.date + '">' +
          '<span class="cal-weekleft">' +
            '<span class="cal-weekdow">' + weekdayShort(c.date) + (isToday ? ' · today' : '') + '</span>' +
            '<span class="cal-weeknum">' + parseYmd(c.date).getDate() + '</span>' +
          '</span>' +
          '<span class="cal-weekitems">' +
            (items.length
              ? items.slice(0, 4).map(function (it) {
                  var job = byJob[it.job_id];
                  var label = job ? job.name : (it.note || 'Planned');
                  return '<span class="cal-weekbar">' +
                    (it.work_time ? '<span class="sc-time">' + esc(formatTime(it.work_time)) + '</span> ' : '') +
                    esc(label) +
                    (it.assignee_name ? ' <span class="cal-weekwho">· ' + esc(it.assignee_name) + '</span>' : '') +
                  '</span>';
                }).join('') +
                (items.length > 4 ? '<span class="cal-weekmore">+' + (items.length - 4) + ' more</span>' : '')
              : '<span class="cal-weeknone">Nothing planned</span>') +
          '</span>' +
        '</button>';
      }).join('') +
      '<div class="row" style="margin-top:10px">' +
        '<button id="cal-today-btn" class="btn-plain">Today</button>' +
      '</div>' +
    '</div>';
  }

  function dayListHtml(dstr, items, byJob, todayStr, withHeading) {
    return (withHeading
      ? '<div class="section-head"><h2>' + (dstr === todayStr ? 'Today' : esc(weekday(dstr))) +
          '</h2><span class="small muted">' + esc(longDate(dstr)) + '</span></div>'
      : '<div class="section-head"><h2>' +
          (dstr === todayStr ? 'Today' : esc(weekday(dstr))) +
        '</h2><span class="small muted">' + esc(longDate(dstr)) + '</span></div>') +

      (items.length
        ? '<ul class="joblist">' + items.map(function (it) {
            var job = byJob[it.job_id];
            return '<li class="jobitem"><div class="jobrow">' +
              '<div class="jobrow-top">' +
                '<span class="jobrow-name">' +
                  (it.work_time ? '<span class="sc-time">' + esc(formatTime(it.work_time)) + '</span> ' : '') +
                  esc(job ? job.name : 'No job set') + '</span>' +
                '<span class="jobrow-when">' + esc(it.assignee_name || 'whole crew') + '</span>' +
              '</div>' +
              (it.note ? '<div class="jobrow-meta" style="white-space:pre-wrap">' + esc(it.note) + '</div>' : '') +
            '</div>' +
            '<button type="button" class="jobact jobdel js-sc-del" data-id="' + esc(it.id) +
              '" aria-label="Remove from schedule" title="Remove">' + TRASH_SVG + '</button>' +
            '</li>';
          }).join('') + '</ul>'
        : '<div class="empty" style="padding:20px"><p style="margin:0">Nothing planned this day.</p></div>');
  }

  function addFormHtml(jobs, crew) {
    return '<div class="panel" style="margin-top:14px">' +
        '<h2 style="font-size:22px;margin-bottom:12px">Plan some work</h2>' +
        '<div class="row">' +
          '<div class="grow"><label for="sc-date">Day</label>' +
            '<input id="sc-date" type="date" value="' + esc(schedSelected) + '"></div>' +
          '<div class="grow"><label for="sc-time">Time <span class="muted">(optional)</span></label>' +
            '<input id="sc-time" type="time"></div>' +
        '</div>' +
        '<div class="row">' +
          '<div class="grow"><label for="sc-job">Job</label>' +
            '<select id="sc-job">' +
              '<option value="">No particular job</option>' +
              jobs.filter(function (j) { return j.status === 'Active'; }).map(function (j) {
                return '<option value="' + esc(j.id) + '">' + esc(j.name) + '</option>';
              }).join('') +
            '</select></div>' +
        '</div>' +
        '<div class="field"><label for="sc-who">Who</label>' +
          '<select id="sc-who">' +
            '<option value="">Anyone / the whole crew</option>' +
            crew.map(function (m) {
              return '<option value="' + esc(m.email) + '">' +
                esc(m.full_name || m.email.split('@')[0]) + '</option>';
            }).join('') +
          '</select></div>' +
        '<div class="field"><label for="sc-note">What is the plan?</label>' +
          '<textarea id="sc-note" style="min-height:80px" ' +
            'placeholder="Hang second floor. Bring the lift and 40 sheets of 5/8."></textarea></div>' +
        '<div class="row" style="margin-top:14px">' +
          '<button id="sc-save" class="btn grow">Add to schedule</button>' +
          '<button id="sc-cancel" class="btn btn-quiet">Cancel</button>' +
        '</div>' +
      '</div>';
  }

  function shiftView(dir) {
    if (schedMode === 'day') {
      schedSelected = addDaysYmd(schedSelected, dir);
      var d = parseYmd(schedSelected);
      schedView = { year: d.getFullYear(), month: d.getMonth() };
    } else if (schedMode === 'week') {
      schedSelected = addDaysYmd(schedSelected, dir * 7);
      var d2 = parseYmd(schedSelected);
      schedView = { year: d2.getFullYear(), month: d2.getMonth() };
    } else {
      schedView.month += dir;
      if (schedView.month < 0) { schedView.month = 11; schedView.year--; }
      if (schedView.month > 11) { schedView.month = 0; schedView.year++; }
    }
  }

  function wireSchedule(rows, jobs, crew, byJob, byDate, todayStr) {
    Array.prototype.forEach.call(document.querySelectorAll('.viewswitch-btn'), function (b) {
      b.addEventListener('click', function () { schedMode = b.dataset.mode; renderSchedule(); });
    });

    Array.prototype.forEach.call(document.querySelectorAll('[data-date]'), function (b) {
      b.addEventListener('click', function () {
        schedSelected = b.dataset.date;
        renderSchedule();
      });
    });

    on('cal-prev', 'click', function () { shiftView(-1); renderSchedule(); });
    on('cal-next', 'click', function () { shiftView(1); renderSchedule(); });
    on('cal-today-btn', 'click', function () {
      var n = todayParts();
      schedView = { year: n.y, month: n.m };
      schedSelected = ymd(n.y, n.m, n.d);
      renderSchedule();
    });

    on('sc-new', 'click', function () { schedNew = true; renderSchedule(); });
    on('sc-cancel', 'click', function () { schedNew = false; renderSchedule(); });

    on('sc-save', 'click', function () {
      var date = document.getElementById('sc-date').value;
      var time = document.getElementById('sc-time').value;
      var jobId = document.getElementById('sc-job').value;
      var whoEmail = document.getElementById('sc-who').value;
      var note = document.getElementById('sc-note').value.trim();

      if (!date) return toast('Pick a day.');
      if (!jobId && !note) return toast('Pick a job, or say what the plan is.');

      var whoName = '';
      if (whoEmail) {
        var found = crew.filter(function (m) { return m.email === whoEmail; })[0];
        whoName = (found && found.full_name) || whoEmail.split('@')[0];
      }

      var btn = document.getElementById('sc-save');
      btn.disabled = true;
      btn.textContent = 'Adding…';

      sb.from('schedule').insert({
        company_id: org.company_id,
        job_id: jobId || null,
        work_date: date,
        work_time: time || null,
        assignee_email: whoEmail,
        assignee_name: whoName,
        note: note,
        created_by: me.email
      }).then(function (res) {
        btn.disabled = false;
        btn.textContent = 'Add to schedule';
        if (res.error) return toast('Could not add that: ' + res.error.message);
        schedNew = false;
        schedSelected = date;
        var d = parseYmd(date);
        schedView = { year: d.getFullYear(), month: d.getMonth() };
        toast('Added to the schedule');
        renderSchedule();
      });
    });

    Array.prototype.forEach.call(document.querySelectorAll('.js-sc-del'), function (b) {
      b.addEventListener('click', function () {
        if (!confirm('Take this off the schedule?')) return;
        sb.from('schedule').delete().eq('id', b.dataset.id).then(function (res) {
          if (res.error) return toast('Could not remove that: ' + res.error.message);
          toast('Removed');
          renderSchedule();
        });
      });
    });
  }

  /* ---------------- crew ---------------- */

    sb.from('memberships')
      .select('user_id,email,full_name,role,created_at')

          '<div class="jobhead">' +

              (free != null && free > 0
                ? ' · ' + free + (free === 1 ? ' seat free' : ' seats free')
                : '') + '</div>' +

          '<ul class="joblist">' + members.map(function (m) {

  /* ---------------- dashboard ---------------- */

  function renderDashboard() {
    app.innerHTML = '<p class="muted">Loading jobs…</p>';

    sb.from('jobs').select('*').order('updated_at', { ascending: false })
      .then(function (res) {
        if (res.error) return renderError(res.error.message);
        paintDashboard(res.data || []);
      });
  }

  var QUIET_DAYS = 3;      // no entry in this many days = worth a look
  var STALE_DAYS = 90;     // nothing for this long = time to archive it

  function daysSince(iso) {
    var t = new Date(iso).getTime();
    if (isNaN(t)) return 0;
    return Math.floor((Date.now() - t) / 86400000);
  }

  function paintDashboard(jobs) {
    var q = dash.q.toLowerCase();
    var shown = jobs.filter(function (j) {
      var okStatus = dash.status === 'All' || j.status === dash.status;
      var hay = (j.name + ' ' + (j.address || '') + ' ' + (j.client_name || '')).toLowerCase();
      return okStatus && (!q || hay.indexOf(q) > -1);
    });

    var counts = { active: 0, completed: 0 };
    jobs.forEach(function (j) { j.status === 'Completed' ? counts.completed++ : counts.active++; });

    // Three buckets. Quiet first because that is what needs a phone call,
    // then everything else newest first, then the ones worth clearing out.
    var stale = [], quiet = [], rest = [];
    shown.forEach(function (j) {
      var age = daysSince(j.updated_at);
      if (age >= STALE_DAYS) stale.push(j);
      else if (j.status === 'Active' && age >= QUIET_DAYS) quiet.push(j);
      else rest.push(j);
    });

    function group(list) {
      return '<ul class="joblist">' + list.map(jobRowHtml).join('') + '</ul>';
    }

    app.innerHTML =
      '<div class="row" style="margin-bottom:4px">' +
        '<div class="grow"><label for="dash-q">Search jobs</label>' +
          '<input id="dash-q" type="text" value="' + esc(dash.q) + '" placeholder="Name, address or client"></div>' +
        '<div style="flex:0 0 150px"><label for="dash-status">Show</label>' +
          '<select id="dash-status">' +
            opt('Active', 'Active (' + counts.active + ')', dash.status) +
            opt('Completed', 'Completed (' + counts.completed + ')', dash.status) +
            opt('All', 'All jobs (' + jobs.length + ')', dash.status) +
          '</select></div>' +
      '</div>' +

      (quiet.length
        ? '<div class="section-head"><h2>Nothing posted lately</h2>' +
            '<span class="small muted">' + quiet.length + '</span></div>' +
          '<p class="small muted" style="margin:-4px 0 10px">No entry in ' + QUIET_DAYS +
            ' days or more. Either the crew is off it, or nobody is logging.</p>' +
          group(quiet)
        : '') +

      (rest.length
        ? '<div class="section-head"><h2>' +
            (dash.status === 'All' ? 'All jobs' : dash.status + ' jobs') + '</h2>' +
            '<span class="small muted">Newest activity first</span></div>' +
          group(rest)
        : '') +

      (stale.length
        ? '<div class="section-head"><h2>Worth archiving</h2>' +
            '<span class="small muted">' + stale.length + '</span></div>' +
          '<div class="panel" style="border-left:5px solid var(--steel);margin-bottom:10px">' +
            '<p class="small" style="margin:0 0 6px"><strong>Nothing on these for ' + STALE_DAYS +
              '+ days.</strong></p>' +
            '<p class="small muted" style="margin:0">Save the notes and the client PDF onto your own ' +
              'computer, then delete the job here. That keeps your photo storage down and leaves you ' +
              'holding the record — worth doing while the job is still fresh enough to answer ' +
              'questions about.</p>' +
          '</div>' +
          group(stale)
        : '') +

      (!shown.length ? emptyJobsHtml(jobs.length) : '') +

      '<div id="newjob" class="panel" hidden style="margin-top:18px">' +
        '<h2 style="font-size:22px;margin-bottom:12px">Add a job</h2>' +
        '<div class="field"><label for="nj-name">Job name</label>' +
          '<input id="nj-name" type="text" placeholder="Hillcrest Apartments, Bldg C"></div>' +
        '<div class="field"><label for="nj-address">Address</label>' +
          '<input id="nj-address" type="text" autocomplete="street-address" ' +
            'placeholder="412 Hillcrest Dr, Morris MN">' +
          '<p class="small muted" style="margin:6px 0 0">Your phone offers addresses you have used ' +
            'before. Tap an address on a job to open it in maps.</p></div>' +
        '<div class="field"><label for="nj-client">Client</label>' +
          '<input id="nj-client" type="text" placeholder="Barrett Construction"></div>' +
        '<div class="row" style="margin-top:14px">' +
          '<button id="nj-save" class="btn grow">Save job</button>' +
          '<button id="nj-cancel" class="btn btn-quiet">Cancel</button>' +
        '</div>' +
      '</div>' +

      '<div class="dock"><div class="dock-inner">' +
        '<button id="nj-open" class="btn btn-block">Add a job</button>' +
      '</div></div>';

    on('dash-q', 'input', function (e) { dash.q = e.target.value; paintDashboardKeepFocus(jobs, 'dash-q'); });
    on('dash-status', 'change', function (e) { dash.status = e.target.value; paintDashboard(jobs); });

    on('nj-open', 'click', function () {
      document.getElementById('newjob').hidden = false;
      document.getElementById('nj-open').hidden = true;
      document.getElementById('nj-name').focus();
    });
    on('nj-cancel', 'click', function () {
      document.getElementById('newjob').hidden = true;
      document.getElementById('nj-open').hidden = false;
    });
    on('nj-save', 'click', saveNewJob);

    Array.prototype.forEach.call(document.querySelectorAll('.js-jobdel'), function (b) {
      b.addEventListener('click', function () { deleteJob(b.dataset.id, b.dataset.name); });
    });
    Array.prototype.forEach.call(document.querySelectorAll('.js-jobtxt'), function (b) {
      b.addEventListener('click', function () {
        var job = jobs.filter(function (j) { return j.id === b.dataset.id; })[0];
        if (job) exportJobNotes(job, b);
      });
    });
  }

  function paintDashboardKeepFocus(jobs, focusId) {
    var pos = document.getElementById(focusId).selectionStart;
    paintDashboard(jobs);
    var node = document.getElementById(focusId);
    node.focus();
    try { node.setSelectionRange(pos, pos); } catch (e) {}
  }

  function opt(value, label, current) {
    return '<option value="' + value + '"' + (current === value ? ' selected' : '') + '>' + esc(label) + '</option>';
  }

  function jobRowHtml(j) {
    return '<li class="jobitem' + (j.status === 'Completed' ? ' is-completed' : '') + '">' +
      '<a class="jobrow" href="#/job/' + esc(j.id) + '">' +
        '<div class="jobrow-top">' +
          '<span class="jobrow-name">' + esc(j.name) + '</span>' +
          '<span class="jobrow-when">' + esc(relTime(j.updated_at)) + '</span>' +
        '</div>' +
        '<div class="jobrow-meta">' + esc(j.client_name || 'No client listed') +
          (j.address ? ' · ' + esc(j.address) : '') + '</div>' +
        (function () {
        var age = daysSince(j.updated_at);
        var chips = [];
        if (j.status === 'Completed') chips.push('<span class="chip chip-done">Completed</span>');
        if (age >= STALE_DAYS) chips.push('<span class="chip">' + age + ' days quiet</span>');
        else if (j.status === 'Active' && age >= QUIET_DAYS) {
          chips.push('<span class="chip chip-issue">' + age + ' days since an entry</span>');
        }
        return chips.length ? '<div style="margin-top:7px">' + chips.join(' ') + '</div>' : '';
      })() +
      '</a>' +
      '<button type="button" class="jobact jobtxt js-jobtxt" data-id="' + esc(j.id) +
        '" aria-label="Save notes for ' + esc(j.name) + '" title="Save notes (.txt)">' + NOTES_SVG + '</button>' +
      '<button type="button" class="jobact jobdel js-jobdel" data-id="' + esc(j.id) + '" data-name="' + esc(j.name) +
        '" aria-label="Delete ' + esc(j.name) + '" title="Delete job">' + TRASH_SVG + '</button>' +
    '</li>';
  }

  function emptyJobsHtml(total) {
    if (total === 0) {
      return '<div class="empty"><h2>No jobs yet</h2>' +
        '<p>Add your first job below. Once it is in, your crew can post notes and photos to it from their phones.</p></div>';
    }
    return '<div class="empty"><h2>Nothing matches</h2>' +
      '<p>Clear the search box, or switch “Show” to all jobs.</p></div>';
  }

  function saveNewJob() {
    var name = document.getElementById('nj-name').value.trim();
    if (name.length < 2) return toast('Give the job a name.');
    var btn = document.getElementById('nj-save');
    btn.disabled = true;
    btn.textContent = 'Saving…';

    sb.from('jobs').insert({
      company_id: org.company_id,
      name: name,
      address: document.getElementById('nj-address').value.trim(),
      client_name: document.getElementById('nj-client').value.trim(),
      status: 'Active'
    }).select().single().then(function (res) {
      if (res.error) { btn.disabled = false; btn.textContent = 'Save job'; return toast('Could not save: ' + res.error.message); }
      toast('Job saved');
      location.hash = '#/job/' + res.data.id;
    });
  }

  function deleteJob(id, name) {
    if (!confirm('Delete "' + name + '"?\n\nEvery entry and photo on this job goes with it, for the whole crew. This cannot be undone.')) return;

    toast('Deleting…');

    sb.from('entries').select('entry_photos(storage_path)').eq('job_id', id)
      .then(function (res) {
        var paths = [];
        (res.data || []).forEach(function (en) {
          (en.entry_photos || []).forEach(function (p) { paths.push(p.storage_path); });
        });
        return paths.length ? sb.storage.from(BUCKET).remove(paths) : Promise.resolve({});
      })
      .then(function () {
        // Entries and photo rows are removed by the database itself.
        return sb.from('jobs').delete().eq('id', id);
      })
      .then(function (res) {
        if (res.error) return toast('Could not delete: ' + res.error.message);
        toast('Job deleted');
        renderDashboard();
      })
      .catch(function (err) { toast('Could not delete: ' + (err.message || err)); });
  }

  /* ---------------- job page ---------------- */

  function renderJob(id) {
    app.innerHTML = '<p class="muted">Loading job…</p>';

    Promise.all([
      sb.from('jobs').select('*').eq('id', id).single(),
      sb.from('entries')
        .select('id,job_id,author_name,author_email,notes,tag,entry_date,created_at,issue_status,resolved_at,resolved_name,entry_photos(id,storage_path),issue_updates(id,status,note,author_name,created_at)')
        .eq('job_id', id)
        .order('entry_date', { ascending: false })
        .order('created_at', { ascending: false }),
      sb.from('schedule').select('work_date,assignee_name,assignee_email,note')
        .eq('job_id', id).gte('work_date', todayISO())
        .order('work_date').limit(6)
    ]).then(function (r) {
      if (r[0].error) return renderError('That job could not be loaded. ' + r[0].error.message);
      if (r[1].error) return renderError(r[1].error.message);
      view.job = r[0].data;
      view.entries = r[1].data || [];
      view.upcoming = (r[2] && r[2].data) || [];
      view.q = ''; view.date = '';
      signPhotos(view.entries).then(paintJob);
    });
  }

  function paintJob() {

            : '') + '</div>' +
        '<div class="row">' +
          '<button id="toggle-status" class="btn btn-quiet">' +
            (j.status === 'Completed' ? 'Reopen job' : 'Mark job completed') + '</button>' +
          '<button id="do-pdf" class="btn btn-quiet">Client PDF</button>' +
        '</div>' +
      '</div>' +

      '<div id="compose" class="panel" hidden style="margin-top:14px">' +
        '<div class="field"><label for="c-date">Date</label>' +
          '<input id="c-date" type="date" value="' + todayISO() + '" max="' + todayISO() + '"></div>' +
        '<div class="field"><label for="c-notes">What happened on site?</label>' +

        '<div class="field">' +
          '<div class="tagpick">' +
            '<input type="radio" name="tag" id="tag-note" value="note" checked><label for="tag-note">Update</label>' +
            '<input type="radio" name="tag" id="tag-issue" value="issue"><label for="tag-issue">Issue</label>' +
          '</div></div>' +
        '<div class="field">' +
          '<div class="filedrop">' +
            '<input id="c-files" type="file" accept="image/*" multiple>' +

      '<div class="row" style="margin-bottom:12px">' +

        '<div style="flex:0 0 165px"><label for="f-date">On date</label>' +

    on('toggle-status', 'click', toggleStatus);

  function visibleEntries() {
    var q = view.q.toLowerCase();
    return view.entries.filter(function (en) {
      if (view.date && en.entry_date !== view.date) return false;
      if (!q) return true;
      return ((en.notes || '') + ' ' + (en.author_name || '')).toLowerCase().indexOf(q) > -1;
    });
  }

  function feedHtml() { return '<div id="feed-wrap">' + feedInner() + '</div>'; }

  function feedInner() {
    var list = visibleEntries();
    if (!list.length) {
      if (view.entries.length === 0) {
        return '<div class="empty"><h2>The log is empty</h2>' +
          '<p>Post the first entry with the button at the bottom. Notes are dated automatically.</p></div>';
      }
      return '<div class="empty"><h2>Nothing matches</h2>' +
        '<p>Clear the search box or the date to see the whole log again.</p></div>';
    }
    return '<ul class="feed">' + list.map(function (en) {
      if (view.editing === en.id) return entryEditHtml(en);
      if (view.issueEditing === en.id) return issueFormHtml(en);
      return entryHtml(en);
    }).join('') + '</ul>';
  }

  function entryHtml(en) {
    var d = dateParts(en.entry_date);
    var photos = en.entry_photos || [];
    var mine = me && en.author_email === me.email;

    var cls = en.tag === 'issue'
      ? (en.issue_status === 'resolved' ? 't-fixed' : 't-issue')
      : 't-note';

    return '<li><article class="entry ' + cls + '">' +
      '<div class="entry-date"><span class="entry-day">' + esc(d.day) + '</span>' +
        '<span class="entry-mon">' + esc(d.mon) + '</span></div>' +
      '<div class="entry-body">' +
        '<div class="entry-head">' +
          '<span class="entry-who">' + esc(en.author_name) + '</span>' +
          '<span class="entry-time">' + esc(clockTime(en.created_at)) + '</span>' +
          tagChip(en) +
        '</div>' +
        (en.notes ? '<p class="entry-note">' + esc(en.notes) + '</p>' : '') +

        issueHistoryHtml(en) +
        (photos.length ? '<div class="gallery">' + photos.map(function (p) {
          var url = p.url || '';
          return '<button type="button" class="js-zoom" data-url="' + esc(url) + '">' +
            '<img loading="lazy" src="' + esc(url) + '" alt="Photo from ' + esc(longDate(en.entry_date)) + '"></button>';
        }).join('') + '</div>' : '') +
        ((mine || en.tag === 'issue') ? '<div class="entry-actions">' +
            (mine ? '<button class="btn-mini js-edit" data-id="' + esc(en.id) + '">Edit</button>' : '') +
            (en.tag === 'issue'
              ? '<button class="btn-mini js-issue" data-id="' + esc(en.id) + '">' +
                  (en.issue_status === 'resolved' ? 'Reopen / update' : 'Add update') + '</button>'
              : '') +
            (mine ? '<button class="btn-mini btn-mini-danger js-del" data-id="' + esc(en.id) + '">Delete</button>' : '') +
          '</div>' : '') +
      '</div>' +
    '</article></li>';

  // Editing reuses the same fields as posting, shown in place of the entry.

    return '<li><div class="panel editpanel">' +
      '<div class="editpanel-head">Editing your entry</div>' +
      '<div class="field"><label for="e-date">Date</label>' +
        '<input id="e-date" type="date" value="' + esc(en.entry_date) + '" max="' + todayISO() + '"></div>' +
      '<div class="field"><label for="e-notes">What happened on site?</label>' +
        '<textarea id="e-notes">' + esc(en.notes || '') + '</textarea></div>' +
      '<div class="field">' +
        '<div class="tagpick">' +
          '<input type="radio" name="etag" id="etag-note" value="note"' + (en.tag !== 'issue' ? ' checked' : '') + '>' +
          '<label for="etag-note">Update</label>' +
          '<input type="radio" name="etag" id="etag-issue" value="issue"' + (en.tag === 'issue' ? ' checked' : '') + '>' +
          '<label for="etag-issue">Issue</label>' +
        '</div></div>' +

      (photos.length ?
        '<div class="field"><label>Photos on this entry</label>' +
          '<p class="small muted" style="margin:0 0 8px">Tap a photo to remove it when you save.</p>' +
          '<div class="thumbs">' + photos.map(function (p) {
            var marked = !!editRemove[p.id];
            return '<button type="button" class="photochip js-photo-toggle' + (marked ? ' marked' : '') + '" ' +
              'data-id="' + esc(p.id) + '">' +
              '<img src="' + esc(p.url || '') + '" alt="Photo on this entry">' +
              (marked ? '<span class="photochip-x">Removing</span>' : '') +

          }).join('') + '</div></div>' : '') +

      '<div class="field">' +
        '<div class="filedrop">' +
          '<input id="e-files" type="file" accept="image/*" multiple>' +
          '<label class="filedrop-label" for="e-files">Add photos</label>' +
          '<div id="e-thumbs" class="thumbs"></div>' +
        '</div></div>' +

      '<div class="row" style="margin-top:16px">' +
        '<button id="e-save" class="btn grow" data-id="' + esc(en.id) + '">Save changes</button>' +
        '<button id="e-cancel" class="btn btn-quiet">Cancel</button>' +
      '</div>' +
    '</div></li>';
  }

  function issueFormHtml(en) {
    var st = en.issue_status || 'open';
    var count = (en.issue_updates || []).length;

    return '<li><div class="panel editpanel">' +
      '<div class="editpanel-head">Add an update</div>' +
      '<p class="small muted" style="margin:-6px 0 12px">Logged by ' + esc(en.author_name) +
        ' on ' + esc(longDate(en.entry_date)) +
        (count ? ' · ' + count + (count === 1 ? ' update so far' : ' updates so far') : '') +
        '. Updates are added to the record — nothing gets overwritten.</p>' +

      '<div class="field">' +
        '<div class="tagpick tagpick-3">' +
          '<input type="radio" name="istat" id="ist-open" value="open"' +
            (st === 'open' ? ' checked' : '') + '><label for="ist-open">Open</label>' +
          '<input type="radio" name="istat" id="ist-working" value="working"' +
            (st === 'working' ? ' checked' : '') + '><label for="ist-working">Being fixed</label>' +
          '<input type="radio" name="istat" id="ist-resolved" value="resolved"' +
            (st === 'resolved' ? ' checked' : '') + '><label for="ist-resolved">Fixed</label>' +
        '</div></div>' +

      '<div class="field"><label for="ist-notes">What has happened?</label>' +
        '<textarea id="ist-notes" placeholder="Called the plumber. He is back Wednesday to move the rough-in."></textarea></div>' +

      '<div class="row" style="margin-top:14px">' +
        '<button id="ist-save" class="btn grow" data-id="' + esc(en.id) + '">Add update</button>' +
        '<button id="ist-cancel" class="btn btn-quiet">Cancel</button>' +
      '</div>' +
    '</div></li>';

  function saveIssueStatus(id) {
    var status = (document.querySelector('input[name=istat]:checked') || {}).value || 'open';
    var notes = document.getElementById('ist-notes').value.trim();

    if (!notes) {
      document.getElementById('ist-notes').focus();
      return toast('Say what has happened, so the history means something later.');
    }

    var btn = document.getElementById('ist-save');
    btn.disabled = true;
    btn.textContent = 'Saving…';

    sb.rpc('update_issue', { p_entry: id, p_status: status, p_notes: notes }).then(function (res) {
      btn.disabled = false;
      btn.textContent = 'Add update';
      if (res.error) return toast(cleanRpcError(res.error));
      view.issueEditing = null;
      toast(status === 'resolved' ? 'Marked fixed' : 'Update added');
      renderJob(view.job.id);
    });
  }

  function clearEditState() {
    view.editing = null;
    view.issueEditing = null;
    editStaged = [];
    editRemove = {};
  }

  function refreshFeed() {
    var wrap = document.getElementById('feed-wrap');
    if (!wrap) return;
    wrap.innerHTML = feedInner();
    wireFeed();
  }

  // An issue's updates are a record, so they all show, in the order they
  // happened. Nothing here is editable.
  function issueHistoryHtml(en) {
    if (en.tag !== 'issue') return '';

    var ups = (en.issue_updates || []).slice().sort(function (a, b) {
      return new Date(a.created_at) - new Date(b.created_at);
    });

    if (!ups.length) return '';

    return '<div class="history">' +
      '<div class="history-head">' + ups.length +
        (ups.length === 1 ? ' update' : ' updates') + '</div>' +
      ups.map(function (u) {
        var label = u.status === 'resolved' ? 'Fixed'
                  : u.status === 'working' ? 'Being fixed'
                  : 'Still open';
        return '<div class="history-item h-' + esc(u.status) + '">' +
          '<div class="history-meta">' +
            '<strong>' + esc(label) + '</strong> · ' + esc(u.author_name || '') +
            ' · ' + esc(longDate(u.created_at.slice(0, 10))) +
            ' ' + esc(clockTime(u.created_at)) +
          '</div>' +
          (u.note ? '<p class="history-note">' + esc(u.note) + '</p>' : '') +
        '</div>';
      }).join('') +
    '</div>';
  }

  function wireFeed() {
    Array.prototype.forEach.call(document.querySelectorAll('.js-zoom'), function (b) {
      b.addEventListener('click', function () { openLightbox(b.dataset.url); });
    });
    Array.prototype.forEach.call(document.querySelectorAll('.js-del'), function (b) {
      b.addEventListener('click', function () { deleteEntry(b.dataset.id); });
    });
    Array.prototype.forEach.call(document.querySelectorAll('.js-edit'), function (b) {
      b.addEventListener('click', function () {
        clearEditState();
        view.editing = b.dataset.id;
        refreshFeed();
        var box = document.getElementById('e-notes');
        if (box) box.focus();
      });
    });
    Array.prototype.forEach.call(document.querySelectorAll('.js-issue'), function (b) {
      b.addEventListener('click', function () {
        clearEditState();
        view.issueEditing = b.dataset.id;
        refreshFeed();
        var box = document.getElementById('ist-notes');
        if (box) box.focus();
      });
    });

    on('ist-cancel', 'click', function () { clearEditState(); refreshFeed(); });

    var istSave = document.getElementById('ist-save');
    if (istSave) istSave.addEventListener('click', function () { saveIssueStatus(istSave.dataset.id); });

    Array.prototype.forEach.call(document.querySelectorAll('.js-photo-toggle'), function (b) {
      b.addEventListener('click', function () {
        var id = b.dataset.id;
        editRemove[id] = !editRemove[id];
        refreshFeed();
      });
    });

    on('e-cancel', 'click', function () { clearEditState(); refreshFeed(); });
    on('e-files', 'change', function (e) { collectFiles(e, editStaged, 'e-thumbs'); });
    var save = document.getElementById('e-save');
    if (save) save.addEventListener('click', function () { saveEdit(save.dataset.id); });
  }

  /* ---------------- posting an entry ---------------- */

  function onPickFiles(e) { collectFiles(e, staged, 'c-thumbs'); }

  function collectFiles(e, into, thumbsId) {
    Array.prototype.slice.call(e.target.files || []).forEach(function (f) {
      if (f.type.indexOf('image/') === 0) into.push(f);
    });
    e.target.value = '';
    var wrap = document.getElementById(thumbsId);
    if (!wrap) return;
    wrap.innerHTML = into.map(function (f) {
      return '<img alt="Selected photo" src="' + URL.createObjectURL(f) + '">';
    }).join('') + (into.length ? '<div class="small muted" style="width:100%">' + into.length +
      (into.length === 1 ? ' photo ready' : ' photos ready') + '</div>' : '');
  }

  function postEntry() {
    var notes = document.getElementById('c-notes').value.trim();
    var tag = (document.querySelector('input[name=tag]:checked') || {}).value || 'note';
    var when = document.getElementById('c-date').value || todayISO();

    if (!notes && !staged.length) return toast('Add a note or a photo first.');

    var btn = document.getElementById('c-save');
    btn.disabled = true;
    btn.textContent = 'Posting…';

    // No signal: shrink the photos now and keep the lot on the phone.
    if (!navigator.onLine) return queueEntry(notes, tag, when, btn);

    sb.from('entries').insert({
      job_id: view.job.id,
      author_name: me.name,
      author_email: me.email,
      notes: notes,
      tag: tag,
      entry_date: when
    }).select().single().then(function (res) {
      if (res.error) throw res.error;
      var entry = res.data;
      return uploadPhotos(entry, staged, btn).then(function () { return entry; });
    }).then(function (entry) {
      toast('Entry posted');
      staged = [];
      notifyEntry(entry && entry.id);
      renderJob(view.job.id);
    }).catch(function (err) {
      // A network failure mid-post is exactly what the queue is for.
      if (!navigator.onLine || /fetch|network|Failed to send/i.test(err.message || '')) {
        return queueEntry(notes, tag, when, btn);
      }
      btn.disabled = false;
      btn.textContent = 'Post entry';
      toast('Could not post: ' + (err.message || err));
    });
  }

  function queueEntry(notes, tag, when, btn) {
    if (btn) btn.textContent = 'Saving on this phone…';

    // Shrink before storing, so a queued entry takes the same room it would
    // have taken uploaded.
    return staged.reduce(function (chain, file) {
      return chain.then(function (out) {
        return shrink(file).then(function (blob) { out.push(blob); return out; },
                                 function () { out.push(file); return out; });
      });
    }, Promise.resolve([])).then(function (blobs) {
      return qAdd({
        job_id: view.job.id,
        company_id: org.company_id,
        author_name: me.name,
        author_email: me.email,
        notes: notes,
        tag: tag,
        entry_date: when,
        photos: blobs,
        saved_at: new Date().toISOString()
      });
    }).then(function () {
      staged = [];
      toast(navigator.onLine
        ? 'Saved on this phone — it will post shortly.'
        : 'Saved on this phone. It posts as soon as you have signal.');
      paintQueueBanner();
      renderJob(view.job.id);
    }).catch(function (err) {
      if (btn) { btn.disabled = false; btn.textContent = 'Post entry'; }
      toast('Could not save that entry: ' + (err.message || err));
    });
  }

  // Fire and forget: an alert failing must never fail the entry.
  // Fire and forget for the person posting — a failed alert must never
  // block or roll back their entry. But "forget" should not mean "and
  // nobody can ever find out why", so failures are still logged.
  function notifyEntry(entryId) {
    if (!entryId) return Promise.resolve();
    if (!navigator.onLine) {
      if (window.console) console.warn('[jobsite-logger] Skipped entry alert: offline.');
      return Promise.resolve();
    }
    return sb.functions.invoke('notify-entry', { body: { entry_id: entryId } })
      .then(function (res) {
        if (res && res.error) {
          console.error('[jobsite-logger] notify-entry call failed:', res.error);
        } else if (res && res.data && res.data.error) {
          console.error('[jobsite-logger] notify-entry rejected:', res.data.error);
        } else if (window.console && res && res.data) {
          console.info('[jobsite-logger] notify-entry:', res.data);
        }
      }, function (err) {
        console.error('[jobsite-logger] notify-entry request never completed:', err);
      });
  }

  function uploadPhotos(entry, files, btn) {
    if (!files.length) return Promise.resolve();
    var done = 0;
    var rows = [];

    return files.reduce(function (chain, file, i) {
      return chain.then(function () {
        return shrink(file).then(function (blob) {
          var path = org.company_id + '/' + view.job.id + '/' + entry.id + '/' + Date.now() + '-' + i + '.jpg';
          return sb.storage.from(BUCKET).upload(path, blob, { contentType: 'image/jpeg' })
            .then(function (up) {
              if (up.error) throw up.error;
              rows.push({ entry_id: entry.id, storage_path: path });
              done++;
              if (btn) btn.textContent = 'Uploading photo ' + done + ' of ' + files.length + '…';
            });
        });
      });
    }, Promise.resolve()).then(function () {
      return sb.from('entry_photos').insert(rows).then(function (res) {
        if (res.error) throw res.error;
      });
    });
  }

  // Phone photos are 4-8 MB each. Shrinking in the browser keeps uploads fast
  // on a weak site signal and keeps you well inside the free storage tier.
  function shrink(file) {
    return new Promise(function (resolve, reject) {
      var url = URL.createObjectURL(file);
      var img = new Image();
      img.onload = function () {
        var scale = Math.min(1, MAX_PX / Math.max(img.width, img.height));
        var w = Math.round(img.width * scale), h = Math.round(img.height * scale);
        var canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        URL.revokeObjectURL(url);
        canvas.toBlob(function (blob) {
          resolve(blob || file);
        }, 'image/jpeg', JPEG_Q);
      };
      img.onerror = function () { URL.revokeObjectURL(url); reject(new Error('That photo could not be read.')); };
      img.src = url;
    });
  }

  function saveEdit(id) {
    var en = view.entries.filter(function (x) { return x.id === id; })[0];
    if (!en) return;

    var notes = document.getElementById('e-notes').value.trim();
    var tag = (document.querySelector('input[name=etag]:checked') || {}).value || 'note';
    var when = document.getElementById('e-date').value || en.entry_date;

    var photos = en.entry_photos || [];
    var dropping = photos.filter(function (p) { return editRemove[p.id]; });
    var keeping = photos.length - dropping.length;

    if (!notes && !editStaged.length && keeping === 0) {
      return toast('An entry needs a note or a photo.');
    }

    var btn = document.getElementById('e-save');
    btn.disabled = true;
    btn.textContent = 'Saving…';

    sb.from('entries')
      .update({ notes: notes, tag: tag, entry_date: when })
      .eq('id', id).eq('author_email', me.email)
      .then(function (res) {
        if (res.error) throw res.error;
        if (!dropping.length) return;
        var paths = dropping.map(function (p) { return p.storage_path; });
        var ids = dropping.map(function (p) { return p.id; });
        return sb.storage.from(BUCKET).remove(paths).then(function () {
          return sb.from('entry_photos').delete().in('id', ids).then(function (r) {
            if (r.error) throw r.error;
          });
        });
      })
      .then(function () { return uploadPhotos(en, editStaged, btn); })
      .then(function () {
        toast('Entry updated');
        clearEditState();
        renderJob(view.job.id);
      })
      .catch(function (err) {
        btn.disabled = false;
        btn.textContent = 'Save changes';
        toast('Could not save: ' + (err.message || err));
      });
  }

  function deleteEntry(id) {
    var en = view.entries.filter(function (x) { return x.id === id; })[0];
    if (!en) return;
    if (!confirm('Delete this entry and its photos? This cannot be undone.')) return;

    var paths = (en.entry_photos || []).map(function (p) { return p.storage_path; });
    var first = paths.length ? sb.storage.from(BUCKET).remove(paths) : Promise.resolve({});

    first.then(function () {
      return sb.from('entries').delete().eq('id', id).eq('author_email', me.email);
    }).then(function (res) {
      if (res.error) return toast('Could not delete: ' + res.error.message);
      toast('Entry deleted');
      renderJob(view.job.id);
    });
  }

  function toggleStatus() {
    var next = view.job.status === 'Completed' ? 'Active' : 'Completed';
    sb.from('jobs').update({ status: next, updated_at: new Date().toISOString() })
      .eq('id', view.job.id).select().single()
      .then(function (res) {
        if (res.error) return toast('Could not update: ' + res.error.message);
        view.job = res.data;
        toast(next === 'Completed' ? 'Job marked completed' : 'Job reopened');
        paintJob();
      });
  }

  /* ---------------- lightbox ---------------- */

  function openLightbox(url) {
    lightboxImg.src = url;
    lightbox.hidden = false;
    document.getElementById('lightbox-close').focus();
  }

  function closeLightbox() {
    lightbox.hidden = true;
    lightboxImg.src = '';
  }

  /* ---------------- plain text export ---------------- */

  // One file per job: notes only, oldest day first, no photos.
  function exportJobNotes(job, btn) {
    btn.disabled = true;
    toast('Building notes file…');

    sb.from('entries')
      .select('id,author_name,notes,tag,entry_date,created_at,issue_status,issue_updates(status,note,author_name,created_at)')
      .eq('job_id', job.id)
      .order('entry_date', { ascending: true })
      .order('created_at', { ascending: true })
      .then(function (res) {
        if (res.error) throw res.error;
        var list = res.data || [];

        var L = [];
        L.push(job.name);
        L.push(new Array(job.name.length + 1).join('='));
        if (job.client_name) L.push('Client:  ' + job.client_name);
        if (job.address)     L.push('Address: ' + job.address);
        L.push('Status:  ' + job.status);
        L.push('Entries: ' + list.length);
        L.push('Saved:   ' + longDate(todayISO()) + ' by ' + companyName());
        L.push('');

        if (!list.length) {
          L.push('No entries yet.');
        } else {
          list.forEach(function (en) {
            L.push('----------------------------------------');
            L.push(longDate(en.entry_date) + '   ' + en.author_name + '   ' +
                   clockTime(en.created_at) +
                   (en.tag === 'issue'
                     ? '   [ISSUE - ' + String(en.issue_status || 'open').toUpperCase() + ']'
                     : ''));
            L.push('');
            if (en.notes) L.push(en.notes);

            var ups = (en.issue_updates || []).slice().sort(function (a, b) {
              return new Date(a.created_at) - new Date(b.created_at);
            });

            if (ups.length) {
              L.push('');
              ups.forEach(function (u) {
                var label = u.status === 'resolved' ? 'FIXED'
                          : u.status === 'working' ? 'BEING FIXED' : 'STILL OPEN';
                L.push('  [' + label + '] ' + longDate(u.created_at.slice(0, 10)) +
                       ', ' + (u.author_name || '') + ': ' + u.note);
              });
            }
            L.push('');
          });
        }

        var stem = job.name.replace(/[^a-z0-9]+/gi, '-').replace(/^-|-$/g, '').toLowerCase();
        downloadFile(stem + '-notes-' + todayISO() + '.txt',
                     L.join('\r\n'), 'text/plain;charset=utf-8');

        btn.disabled = false;
        toast('Notes saved');
      })
      .catch(function (err) {
        btn.disabled = false;
        toast('Could not build the file: ' + (err.message || err));
      });
  }

  function downloadFile(filename, text, type) {
    var url = URL.createObjectURL(new Blob([text], { type: type }));
    var a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    setTimeout(function () { URL.revokeObjectURL(url); a.remove(); }, 2000);
  }

  /* ---------------- PDF report ---------------- */

  function exportPdf() {
    var btn = document.getElementById('do-pdf');
    btn.disabled = true;
    btn.textContent = 'Building…';

    var list = visibleEntries().slice().reverse();   // oldest first reads better for a client
    var doc = new window.jspdf.jsPDF({ unit: 'pt', format: 'letter' });
    var M = 48, PW = 612, PH = 792, CW = PW - M * 2;
    var y = M;

    function space(need) {
      if (y + need > PH - M) { doc.addPage(); y = M; }
    }

    doc.setFont('helvetica', 'bold'); doc.setFontSize(22);
    doc.text(view.job.name, M, y); y += 26;

    doc.setFont('helvetica', 'normal'); doc.setFontSize(11);
    [
      view.job.client_name ? 'Client: ' + view.job.client_name : '',
      view.job.address || '',
      'Status: ' + view.job.status,
      'Report prepared by ' + companyName() + ' on ' + longDate(todayISO()),
      list.length + (list.length === 1 ? ' entry' : ' entries')
    ].filter(Boolean).forEach(function (line) {
      doc.text(line, M, y); y += 15;
    });

    y += 6;
    doc.setDrawColor(120); doc.line(M, y, PW - M, y); y += 20;

    var step = list.reduce(function (chain, en) {
      return chain.then(function () {
        space(70);
        doc.setFont('helvetica', 'bold'); doc.setFontSize(13);
        doc.text(longDate(en.entry_date), M, y);
        doc.setFont('helvetica', 'normal'); doc.setFontSize(10);
        var right = en.author_name;
        if (en.tag === 'issue') {
          right += '  ·  ISSUE' +
            (en.issue_status === 'resolved' ? ' (FIXED)' :
             en.issue_status === 'working' ? ' (BEING FIXED)' : ' (OPEN)');
        }
        doc.text(right, PW - M, y, { align: 'right' });
        y += 16;

        if (en.notes) {
          doc.setFontSize(11);
          var lines = doc.splitTextToSize(en.notes, CW);
          lines.forEach(function (ln) { space(16); doc.text(ln, M, y); y += 14; });
        }

        var ups = (en.issue_updates || []).slice().sort(function (a, b) {
          return new Date(a.created_at) - new Date(b.created_at);
        });

        if (ups.length) {
          doc.setFontSize(10);
          ups.forEach(function (u) {
            var label = u.status === 'resolved' ? 'Fixed'
                      : u.status === 'working' ? 'Being fixed' : 'Still open';
            space(16);
            doc.setFont('helvetica', 'bold');
            doc.text(label + ' — ' + (u.author_name || '') + ', ' +
                     longDate(u.created_at.slice(0, 10)) + ':', M + 14, y);
            y += 13;
            doc.setFont('helvetica', 'normal');
            doc.splitTextToSize(u.note, CW - 14).forEach(function (ln) {
              space(15); doc.text(ln, M + 14, y); y += 13;
            });
          });
          doc.setFontSize(11);
        }

        var photos = en.entry_photos || [];
        if (!photos.length) { y += 14; return; }
        y += 6;

        return photos.reduce(function (c2, p, i) {
          return c2.then(function () {
            return imageData(p.url || '').then(function (im) {
              if (!im) return;
              var boxW = (CW - 12) / 2;
              var w = boxW, h = boxW * (im.h / im.w);
              if (h > 200) { h = 200; w = 200 * (im.w / im.h); }
              var col = i % 2;
              if (col === 0) space(h + 12);
              var x = M + col * (boxW + 12);
              doc.addImage(im.data, 'JPEG', x, y, w, h);
              if (col === 1 || i === photos.length - 1) y += h + 12;
            });
          });
        }, Promise.resolve()).then(function () { y += 10; });
      });
    }, Promise.resolve());

    step.then(function () {
      var pages = doc.getNumberOfPages();
      for (var p = 1; p <= pages; p++) {
        doc.setPage(p);
        doc.setFont('helvetica', 'normal'); doc.setFontSize(9); doc.setTextColor(110);
        doc.text(companyName() + '  —  ' + view.job.name, M, PH - 26);
        doc.text('Page ' + p + ' of ' + pages, PW - M, PH - 26, { align: 'right' });
      }
      var safe = view.job.name.replace(/[^a-z0-9]+/gi, '-').toLowerCase();
      doc.save(safe + '-report-' + todayISO() + '.pdf');
      btn.disabled = false;
      btn.textContent = 'Client PDF';
    }).catch(function (err) {
      btn.disabled = false;
      btn.textContent = 'Client PDF';
      toast('PDF failed: ' + (err.message || err));
    });
  }

  // Photos are re-drawn small so a 30-entry report stays a reasonable file size.
  function imageData(url) {
    return fetch(url).then(function (r) { return r.blob(); }).then(function (blob) {
      return new Promise(function (resolve) {
        var objUrl = URL.createObjectURL(blob);
        var img = new Image();
        img.onload = function () {
          var scale = Math.min(1, 900 / Math.max(img.width, img.height));
          var w = Math.round(img.width * scale), h = Math.round(img.height * scale);
          var canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          canvas.getContext('2d').drawImage(img, 0, 0, w, h);
          URL.revokeObjectURL(objUrl);
          resolve({ data: canvas.toDataURL('image/jpeg', 0.7), w: w, h: h });
        };
        img.onerror = function () { URL.revokeObjectURL(objUrl); resolve(null); };
        img.src = objUrl;
      });
    }).catch(function () { return null; });
  }

  /* ---------------- errors ---------------- */

  function renderError(msg) {
    app.innerHTML = '<div class="error"><h2 style="font-size:20px;margin-bottom:6px">Could not reach your data</h2>' +
      '<p class="small" style="margin:0 0 10px">' + esc(msg) + '</p>' +
      '<p class="small muted" style="margin:0">If this mentions a missing table, relationship or column, ' +
      'one of the SQL files in <code>db/</code> has not been run yet against this database — check which ' +
      'feature the error names and run the matching file.</p>' +
      '<a class="backlink" href="#/">Back to jobs</a></div>';
  }

  boot();

})();

</script>
